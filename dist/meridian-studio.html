<title>Meridian Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Instrument+Serif&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDE8DC; --panel:#F7F3EB; --panel2:#FCFAF4; --ink:#3B423E;
    --rust:#A8624C; --muted:#868C86; --muted2:#585E59; --line:#D6D0C2;
    --good:#7FA476; --mid:#C9A45E; --bad:#AE6450;
    --ubi:#A8624C; --infra:#7FA3AC; --resv:#88A87E;
    --head:76px;
  }
  *{box-sizing:border-box}
  :where(button,[href],input,textarea,select):focus-visible{outline:3px solid var(--rust);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* The whole point: the page never scrolls. Each rail does. */
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--bg);color:var(--ink);
    font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px}
  h1,h2,h3{margin:0;font-weight:400}
  .mono{font-family:"Space Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .lbl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

  /* ---------- header: always visible, always current ---------- */
  header{height:var(--head);display:flex;align-items:center;gap:16px;padding:0 16px;
    background:var(--ink);color:var(--panel);overflow-x:auto;overflow-y:hidden}
  header .brand{font-family:"Instrument Serif",Georgia,serif;font-size:23px;line-height:1;
    white-space:nowrap}
  header .who{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:#9BA29B;margin-top:2px;white-space:nowrap;cursor:pointer}
  .clock{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .clock .yr{font-family:"Space Mono",monospace;font-size:22px;font-weight:700;min-width:64px;
    text-align:center;font-variant-numeric:tabular-nums}
  .clock .rd{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#9BA29B}
  .cd{text-align:center;padding-left:8px;border-left:1px solid #4A4636;margin-left:2px}
  .cd .cdv{font-family:"Space Mono",monospace;font-size:19px;font-weight:700;line-height:1;
    font-variant-numeric:tabular-nums;color:#DDBE7E}
  .cd.soon .cdv{color:#E39A86}
  .hbtn{font-family:inherit;font-size:12px;font-weight:800;padding:5px 9px;cursor:pointer;
    border:2px solid #4A4636;background:transparent;color:#9BA29B;line-height:1}
  .hbtn:hover{border-color:var(--panel);color:var(--panel)}
  .hbtn.on{background:var(--panel);color:var(--ink);border-color:var(--panel)}
  .hm{display:flex;gap:12px;flex:1;min-width:0;overflow-x:auto}
  .hmi{flex:0 0 auto;min-width:78px}
  .hmi .v{font-family:"Space Mono",monospace;font-size:17px;font-weight:700;line-height:1.05;
    font-variant-numeric:tabular-nums}
  .hmi .k{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:#9BA29B;margin-top:1px;white-space:nowrap}
  .score{flex:0 0 auto;text-align:right}
  .score .sv{font-family:"Space Mono",monospace;font-size:27px;font-weight:700;line-height:1}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block}

  /* ---------- three rails, each scrolling on its own ---------- */
  .rails{display:grid;grid-template-columns:330px minmax(0,1fr) 380px;
    height:calc(100% - var(--head));gap:1px;background:var(--line)}
  @media(max-width:1300px){.rails{grid-template-columns:290px minmax(0,1fr) 330px}}
  @media(max-width:1050px){.rails{grid-template-columns:1fr;grid-template-rows:auto}
    .rail{max-height:none}}
  .rail{background:var(--bg);display:flex;flex-direction:column;min-height:0;min-width:0}
  .railtabs{display:flex;gap:0;background:var(--panel);border-bottom:2px solid var(--ink);flex:0 0 auto}
  .railtabs button{flex:1;font-family:inherit;font-size:10px;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;padding:9px 4px;cursor:pointer;border:0;border-right:1px solid var(--line);
    background:transparent;color:var(--muted)}
  .railtabs button:last-child{border-right:0}
  .railtabs button.on{background:var(--ink);color:var(--panel)}
  .railbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;min-height:0}

  .box{background:var(--panel);border:2px solid var(--ink);padding:11px 12px;margin-bottom:11px}
  .box h4{margin:0 0 9px;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;
    padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
    align-items:baseline;gap:8px}
  .box h4 .a{font-weight:600;letter-spacing:.03em;text-transform:none;color:var(--muted)}

  label{display:block;margin-bottom:9px}
  label>span{display:block;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:3px}
  input[type=text],input[type=number],select,textarea{width:100%;font-family:inherit;font-size:12px;
    padding:6px 7px;border:2px solid var(--ink);background:var(--panel2);color:var(--ink)}
  textarea{font-family:"Space Mono",monospace;font-size:10px;line-height:1.5;resize:vertical}
  .row{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-end}
  .row>label{flex:1;min-width:78px;margin-bottom:0}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:7px;
    background:var(--line);border:2px solid var(--ink);outline:none;margin:0;cursor:pointer;padding:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:16px;
    background:var(--panel2);border:2px solid var(--ink);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:13px;height:16px;background:var(--panel2);
    border:2px solid var(--ink);border-radius:0;cursor:pointer}

  .btn{font-family:inherit;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    padding:7px 10px;cursor:pointer;border:2px solid var(--ink);background:var(--panel2);color:var(--ink)}
  .btn:hover{background:var(--ink);color:var(--panel)}
  .btn.pri{background:var(--rust);border-color:var(--rust);color:#FAF6EE}
  .btn.pri:hover{background:var(--ink);border-color:var(--ink)}
  .btn.on{background:var(--ink);color:var(--panel)}
  .btn.sm{padding:5px 7px;font-size:9px}
  .btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg .btn{flex:1;min-width:42px}

  .lvr{margin-bottom:10px}
  .lvrh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:3px}
  .lvrh .n{font-family:"Space Mono",monospace;font-size:11px;font-weight:700}
  .alloc{display:flex;gap:9px;align-items:flex-end;height:96px;margin-bottom:5px}
  .ac{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
  .ab{position:relative;flex:1;width:100%;background:var(--line);border:2px solid var(--ink);
    cursor:ns-resize;overflow:hidden}
  .af{position:absolute;left:0;right:0;bottom:0}
  .an{font-family:"Space Mono",monospace;font-size:11px;font-weight:700}

  .cityfit{position:relative;width:100%;overflow:hidden;border:2px solid var(--ink);
    background:linear-gradient(170deg,#E7E1D2,#EFEADD 55%,#E4DED0)}
  .cityfit .city-scene{transform-origin:0 0}
  .city-group{position:absolute;left:0;top:0;width:0;height:0;cursor:pointer}
  .city-puff{position:absolute;width:34px;height:34px;border-radius:50%;background:#EDE3D0;
    pointer-events:none;animation:puff 4.2s linear infinite;opacity:0}
  @keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.5}
                  100%{transform:translateY(-72px) scale(1.6);opacity:0}}
  .city-label{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:7px;
    padding:3px 9px;border-radius:999px;background:var(--panel);border:2px solid transparent;
    box-shadow:0 2px 8px rgba(59,66,62,.1);cursor:pointer;font-family:inherit;white-space:nowrap}
  .city-label.on{border-color:var(--ink);background:var(--panel2)}
  .city-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .city-name{font-size:10px;font-weight:800;color:var(--ink)}
  .city-q{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink)}
  .city-plaza{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
    align-items:center;padding:6px 13px;background:var(--panel);border:2px solid var(--ink);
    box-shadow:4px 4px 0 rgba(22,21,15,.14);z-index:55;white-space:nowrap}
  .city-plaza-v{font-family:"Space Mono",monospace;font-size:18px;font-weight:700}
  .city-plaza-u{font-size:10px;font-weight:700;color:var(--muted2)}

  .pips{display:flex;gap:3px;flex:1;min-width:120px}
  .pip{flex:1;height:22px;border:2px solid var(--ink);background:var(--panel2);cursor:pointer;
    font-family:"Space Mono",monospace;font-size:9px;font-weight:700;color:var(--muted);padding:0}
  .pip.on{background:var(--ink);color:var(--panel)}
  .pip.past{background:var(--line)}
  .scrub{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
  .card{background:var(--panel);border:2px solid var(--ink);padding:9px 10px}
  .card .ch{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .card .cv{font-family:"Space Mono",monospace;font-size:19px;font-weight:700;line-height:1.15}
  .card .cd{font-size:10px;font-weight:700}
  .card svg{display:block;width:100%;height:auto;margin:3px 0}
  .card .cf{font-size:10px;color:var(--muted2);line-height:1.4}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:6px}
  .tile{border:2px solid var(--ink);background:var(--panel2);padding:6px 7px}
  .tile .tn{font-size:10px;font-weight:800;display:flex;align-items:center;gap:5px;line-height:1.2}
  .tile .tv{font-family:"Space Mono",monospace;font-size:16px;font-weight:700;margin-top:2px}
  .tile .ts{font-size:9px;color:var(--muted2)}
  .sqd{width:8px;height:8px;border:1px solid var(--ink);flex:0 0 auto}

  .deal{border:2px solid var(--ink);background:var(--panel2);padding:8px 9px;margin-bottom:7px}
  .deal.tome{border-left:6px solid var(--good)}
  .deal.mine{border-left:6px solid var(--rust)}
  .deal.agreed{border-left:6px solid var(--good);background:#F2F6EE}
  .deal .dt{display:flex;justify-content:space-between;gap:7px;align-items:baseline}
  .deal .dd{font-family:"Space Mono",monospace;font-size:12px;font-weight:700;margin-top:3px}
  .deal .dm{font-size:10px;color:var(--muted2);margin-top:2px}
  .chip{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 5px;border:1px solid var(--ink);background:var(--panel)}
  .ledgerline{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;padding-top:5px;
    border-top:1px dashed var(--line);font-size:10px;font-weight:700}
  .gives{color:var(--bad)}.gives::before{content:"− "}
  .gets{color:var(--good)}.gets::before{content:"+ "}
  .preview{margin-top:6px;padding:5px 7px;border:2px dashed var(--line);background:#FAF7F0;
    display:flex;gap:9px;flex-wrap:wrap;font-size:10px}
  .preview .pvl{font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

  .msg{padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.45}
  .msg .f{font-weight:800;font-size:10px;letter-spacing:.05em;text-transform:uppercase}
  .msg .t{color:var(--rust);font-weight:800}

  .hint{font-size:10px;color:var(--muted2);line-height:1.45;margin-top:6px}
  .empty{font-size:11px;color:var(--muted);padding:7px 0}
  .ok{color:var(--good);font-weight:700}.err{color:var(--bad);font-weight:700}
  .notice{padding:8px 10px;border:2px solid var(--ink);background:#F1ECE0;font-size:11px;
    line-height:1.45;margin-bottom:10px}
  .notice.bad{background:#F3E0DA;border-color:var(--bad)}
  code{font-family:"Space Mono",monospace;font-size:10px;background:var(--panel2);
    border:1px solid var(--line);padding:0 3px}
  .gate{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    padding:2px 5px;background:#A85B49;color:#FAF6EE;margin-right:3px;display:inline-block}
</style>

<header>
  <div style="flex:0 0 auto">
    <div class="brand">Meridian studio</div>
    <div class="who" id="who">pick a society</div>
  </div>
  <div class="clock">
    <button class="hbtn" id="rBack">◀</button>
    <div><div class="yr" id="yr">2050</div><div class="rd" id="rd">round 1</div></div>
    <button class="hbtn" id="rFwd">▶</button>
    <div id="cd" class="cd" hidden><div class="cdv" id="cdv">–</div><div class="rd">to the tick</div></div>
    <button class="hbtn" id="play" title="space">▶ play</button>
  </div>
  <div class="hm" id="hm"></div>
  <div class="score" title="A trial preview of the physics with no society in it. Results that count come from an agent run (Run society tab)."><div class="sv" id="sv">–</div><div class="rd" id="gates">trial · no gates</div></div>
  <span class="dot" id="live" style="background:#A85B49" title="offline"></span>
</header>

<div class="rails">
  <div class="rail">
    <div class="railtabs" id="ltabs"></div>
    <div class="railbody" id="lbody"></div>
  </div>
  <div class="rail">
    <div class="railtabs" id="ctabs"></div>
    <div class="railbody" id="cbody"></div>
  </div>
  <div class="rail">
    <div class="railtabs" id="rtabs"></div>
    <div class="railbody" id="rbody"></div>
  </div>
</div>

<script>
(function(){
/* =====================================================================
   WHAT EACH INDUSTRY IS FOR
   ---------------------------------------------------------------------
   Every sector is scored out of 100 by ONE formula:

     target = Q_BASE + Q_CAPACITY·access + Q_INFRA·reliability
                     - Q_HUMAN·human_touch·overAutomation
                     + Q_STAFF·delivery + guarantee + friction

   Four dimensions, the same four for everybody, in the same proportions
   for everybody. Healthcare and Finance are judged identically apart
   from two coefficients. A hospital and a bank are not good at the same
   things and should not be measured as though they were.

   THE FIX, AND THE TRAP IN IT
   ---------------------------
   Each sector gets a MISSION and a scorecard of weighted dimensions. The
   obvious next step — letting each industry's agent decide what its own
   KPIs are — is the trap, and it is worth naming because it looks like
   more autonomy rather than less rigour. An agent that sets its own
   targets can declare success on transactions processed while the
   country starves, and no number anywhere would contradict it.

   So: the scorecard is AUTHORED HERE and measured deterministically from
   engine state. The agent's agency is in HOW it hits the targets, never
   in what they are. That keeps the score falsifiable, which is the only
   thing that makes it worth anything.

   THE OLD FORMULA IS A SPECIAL CASE
   ---------------------------------
   It is the scorecard where every sector weights the same four
   dimensions in the same proportions. Setting a sector's weights to
   mirror the global coefficients reproduces its old behaviour, which is
   what makes this safe to introduce gradually: `MISSION_WEIGHT` blends
   between the two and is zero until the blend has been looked at.

   WEIGHTS SUM TO 1 within a sector, so a scorecard is a statement about
   PRIORITY rather than about intensity. A sector cannot be made better
   simply by caring about more things.
   ===================================================================== */

'use strict';

/* ---------------------------------------------------------------------
   THE DIMENSIONS
   ---------------------------------------------------------------------
   Each is a signal roughly in [-1, +1], computed from what the engine
   already has. `scale` converts a weight of 1.0 into a full-strength
   effect on the 100-point scale, and is set so that a sector weighting
   a dimension the way the old global formula implicitly did produces
   approximately its old number.
   --------------------------------------------------------------------- */
const DIMENSIONS = {
  access:       { scale: 120, blurb: 'is there enough of it for everyone asking' },
  delivery:     { scale:  80, blurb: 'are there enough people to actually deliver it' },
  humanity:     { scale: 400, blurb: 'is a person still doing the part that has to be a person' },
  reliability:  { scale: 100, blurb: 'is the infrastructure underneath it maintained' },
  affordability:{ scale:  60, blurb: 'can people pay for it without going without something else' },
  equity:       { scale:  70, blurb: 'when it is rationed, who goes without' }
};

/* ---------------------------------------------------------------------
   THE MISSIONS
   ---------------------------------------------------------------------
   The `mission` line is what the industry is FOR, in one sentence. It is
   read by a human, and in due course by that industry's agent, which is
   why it is written as an obligation rather than a description.
   --------------------------------------------------------------------- */
const MISSIONS = {
  healthcare: {
    mission: 'Everyone who needs care gets it in time, and nobody is ruined by needing it.',
    /* Access dominates because a hospital that turns people away has
       failed at the thing it is for, however good the care inside is. */
    kpi: { access: 0.34, humanity: 0.24, delivery: 0.18, equity: 0.16, reliability: 0.08 }
  },
  care_services: {
    mission: 'The people who cannot look after themselves are looked after, by someone who knows them.',
    /* The one sector where the human IS the service. Automate it past
       its comfort and there is nothing left worth measuring. */
    kpi: { humanity: 0.40, delivery: 0.24, access: 0.20, equity: 0.16 }
  },
  education_research: {
    mission: 'Every child becomes someone this economy still has a use for, and the country keeps learning things nobody knew.',
    kpi: { humanity: 0.28, delivery: 0.26, access: 0.22, equity: 0.14, reliability: 0.10 }
  },
  transport_logistics: {
    mission: 'People and goods get where they are going, on time, at a price that does not decide who travels.',
    kpi: { access: 0.34, reliability: 0.28, affordability: 0.20, delivery: 0.10, equity: 0.08 }
  },
  energy_utilities: {
    mission: 'The lights stay on, the water runs, and the bill does not choose between them.',
    /* Reliability and affordability, not margin. A grid that is
       profitable and intermittent has failed. */
    kpi: { reliability: 0.34, access: 0.28, affordability: 0.28, delivery: 0.10 }
  },
  compute_telecom: {
    mission: 'The network carries what the country asks of it, and asking more of it is not ruinous.',
    kpi: { access: 0.38, reliability: 0.30, affordability: 0.22, delivery: 0.10 }
  },
  housing_construction: {
    mission: 'Everyone has somewhere to live that they can afford and that is still standing in thirty years.',
    kpi: { affordability: 0.32, access: 0.28, reliability: 0.22, equity: 0.18 }
  },
  food_agri: {
    mission: 'Nobody goes hungry, and the city is not one shipping lane away from finding out it could.',
    kpi: { access: 0.32, affordability: 0.28, reliability: 0.22, equity: 0.18 }
  },
  manufacturing: {
    mission: 'The things this country needs can be made here, by an industry that is still here next decade.',
    kpi: { access: 0.36, reliability: 0.26, delivery: 0.20, affordability: 0.18 }
  },
  finance: {
    /* Scored on whether capital reaches the real economy, NOT on margin.
       A banking sector can be enormously profitable while starving
       everything it is supposed to fund. */
    mission: 'Capital reaches the people and firms that can use it, and the system survives its own bad years.',
    kpi: { reliability: 0.34, access: 0.30, equity: 0.22, delivery: 0.14 }
  },
  retail_commerce: {
    mission: 'People can buy what they need near where they live, at a price they can meet.',
    kpi: { affordability: 0.34, access: 0.30, delivery: 0.20, equity: 0.16 }
  },
  public_admin: {
    mission: 'The state can still do what it decides to do, and a citizen can find out why.',
    kpi: { delivery: 0.32, humanity: 0.26, reliability: 0.22, access: 0.20 }
  },
  public_safety: {
    mission: 'People are safe, and feel safe, without being policed into it.',
    kpi: { delivery: 0.30, humanity: 0.26, access: 0.24, equity: 0.20 }
  }
};

/* ---------------------------------------------------------------------
   VALIDATION
   ---------------------------------------------------------------------
   Weights that do not sum to 1 make a sector quietly easier or harder to
   score than its neighbours, which is exactly the kind of thing nobody
   notices until a team asks why their hospital is doing so well.
   --------------------------------------------------------------------- */
function validate(order) {
  const problems = [];
  (order || Object.keys(MISSIONS)).forEach(k => {
    const m = MISSIONS[k];
    if (!m) { problems.push(k + ' has no mission'); return; }
    if (!m.mission || m.mission.length < 20) problems.push(k + ' has no mission statement');
    const keys = Object.keys(m.kpi || {});
    if (!keys.length) { problems.push(k + ' has no KPI weights'); return; }
    keys.forEach(d => {
      if (!DIMENSIONS[d]) problems.push(k + ' weights an unknown dimension "' + d + '"');
    });
    const sum = keys.reduce((a, d) => a + m.kpi[d], 0);
    if (Math.abs(sum - 1) > 1e-9) {
      problems.push(k + ' KPI weights sum to ' + sum.toFixed(4) + ', not 1');
    }
  });
  Object.keys(MISSIONS).forEach(k => {
    if (order && order.indexOf(k) < 0) problems.push('mission for "' + k + '", which is not a sector');
  });
  return problems;
}

/**
 * Score one sector against its own mission.
 *
 * `signals` are the normalised dimension readings for this sector this
 * round. Returns the 0-100 target plus the per-dimension breakdown, so a
 * team can see WHICH part of the mission is failing rather than being
 * handed one number.
 */
function scoreAgainstMission(key, signals, base) {
  const m = MISSIONS[key];
  const parts = {};
  let total = base;
  if (!m) return { target: total, parts: parts, mission: null };

  Object.keys(m.kpi).forEach(d => {
    const dim = DIMENSIONS[d];
    if (!dim) return;
    const raw = signals[d] == null ? 0 : signals[d];
    const contribution = m.kpi[d] * dim.scale * raw;
    parts[d] = { weight: m.kpi[d], signal: raw, points: contribution };
    total += contribution;
  });

  return { target: total, parts: parts, mission: m.mission };
}

/** The weakest part of a sector's mission, for a report or a prompt. */
function weakest(parts) {
  const keys = Object.keys(parts || {});
  if (!keys.length) return null;
  const worst = keys.sort((a, b) => parts[a].points - parts[b].points)[0];
  return { dimension: worst, points: parts[worst].points,
