  module.exports = (typeof window !== 'undefined' ? window : globalThis).MeridianEngine;
}

</script>
<script>
/* =====================================================================
   LAYER 2b — THE TRADE ENGINE
   ---------------------------------------------------------------------
   Several societies, one world, one clock.

   Harnesses negotiate in plain language and then submit a structured
   offer. The prose is how they reach agreement; the object is what
   settles. **If the prose and the object disagree, the object wins** —
   the market never reads a message, it only executes contracts.

   WHAT MAKES THIS HARD, AND WORTH DOING
   -------------------------------------
   A forward contract is a promise about a future you do not control. You
   sign in round 4 to deliver food in round 7, a shock lands in round 6,
   and now you must choose between your own citizens and your word. The
   engine does not resolve that for you. It just records which one you
   chose, and prices it for the rest of the run.

   THE CLOCK
   ---------
     round N      harness sees offers made in N-1, accepts or rejects
                  them, and makes new offers of its own
     end of N     the market clears: accepted spots settle, forwards
                  falling due are delivered or defaulted, aid transfers
     round N+1    settled goods reach the world state as exogenous
                  capacity, labour and credits

   The one-round lag is deliberate. It gives the negotiation channel
   something to do, and it means a deal takes trust rather than reflexes.
   ===================================================================== */

(function (root) {
'use strict';

const E = (typeof require !== 'undefined') ? require('./meridian-engine.js') : root.MeridianEngine;

const clamp = (v, lo, hi) => (v < lo ? lo : (v > hi ? hi : v));
const deepClone = o => JSON.parse(JSON.stringify(o));
const round2 = v => Math.round(v * 100) / 100;

/* ---------------------------------------------------------------------
   1. WHAT CAN BE TRADED
   ---------------------------------------------------------------------
   Five resources, each drawn from a distinct part of the world state, so
   selling something always costs you the thing you sold.
   --------------------------------------------------------------------- */
const RESOURCES = {
  compute: {
    label: 'Compute', unit: '$bn', sector: 'compute_telecom',
    note: 'Data centre and grid capacity above domestic need.'
  },
  energy: {
    label: 'Energy', unit: '$bn', sector: 'energy_utilities',
    note: 'Grid and utility capacity above domestic need.'
  },
  food: {
    label: 'Food', unit: '$bn', sector: 'food_agri',
    note: 'Calories above domestic need. Scarce for everyone at once when a shock lands.'
  },
  labour: {
    label: 'Skilled labour', unit: 'workers', sector: null,
    note: 'Unemployed low-exposure workers — care, trades, complex judgement.'
  },
  credits: {
    label: 'Sovereign credits', unit: '$bn', sector: null, aid_only: true,
    note: 'Reserves above the $20bn a society may not lend away. Credits are ' +
          'the money, so they cannot be SOLD — selling money for money is not ' +
          'a trade. They may be given as aid, which is what a bailout is.'
  }
};
const RESOURCE_KEYS = Object.keys(RESOURCES);

const EXPORT_CAP = 0.25;        // no more than a quarter of what you could sell, per round
/* How far a society may sell INTO its own need, not merely out of its
   excess. At 1.0 nobody could ever sell anything — a real economy runs at
   roughly the capacity it needs, so "only the surplus above demand is
   tradable" means no trade at all. At 0.90 you may sell down to ninety per
   cent of your own demand, and going below that is a choice with a cost
   the engine will charge you for in service quality. */
const TRADE_FLOOR = 0.90;
const CREDIT_FLOOR = 20;        // $bn a society may not lend away
const LABOUR_SECTOR = 'care_services';   // where borrowed hands go by default
/* A city-state does not lend out a tenth of its workforce, however many
   people the machines have idled. The 25% surplus rule is not enough on
   its own here, because mass unemployment makes the surplus enormous. */
const LABOUR_CAP_OF_WORKFORCE = 0.03;

/* What a society could sell this round, before the export cap. */
function surplusOf(state) {
  const out = {};
  RESOURCE_KEYS.forEach(k => {
    const r = RESOURCES[k];
    if (r.sector) {
      const sec = state.sectors[r.sector];
      out[k] = round2(Math.max(0, (sec.capacity - TRADE_FLOOR) * E.SECTORS[r.sector].base_output_bn));
    }
  });
  const pop = state.population;
  const unemployed = Math.max(0, pop.by_age.age_20_64 - pop.employed_total);
  const lowShare = pop.by_exposure.low / Math.max(1, pop.by_age.age_20_64);
  out.labour = Math.round(unemployed * lowShare);
  out.credits = round2(Math.max(0, state.fiscal.reserves_bn - CREDIT_FLOOR));
  return out;
}

function exportCaps(state) {
  const s = surplusOf(state), caps = {};
  RESOURCE_KEYS.forEach(k => { caps[k] = round2(s[k] * EXPORT_CAP); });
  caps.labour = Math.min(
    Math.floor(s.labour * EXPORT_CAP),
    Math.floor(state.population.by_age.age_20_64 * LABOUR_CAP_OF_WORKFORCE));
  return caps;
}

/* ---------------------------------------------------------------------
   2. REPUTATION
   ---------------------------------------------------------------------
   0-100, published, and it does two concrete things: it moves the terms
   a counterparty actually receives, and below 40 it closes the forward
   market to you entirely. Nobody sells you a promise on credit when your
   promises have not been good.
   --------------------------------------------------------------------- */
const REP = {
  START: 50,
  DELIVER: +4,
  DEFAULT: -25,          // breaking a forward: a promise about the future
  UNFILLED: -5,          // a spot that could not be backed on the day
  AID_GIVEN: +6,
  DRIFT: 9,               // per round, back toward 50: a default (-25) takes
                          // exactly three rounds of good behaviour to work off
  FORWARD_FLOOR: 40       // below this you may only trade spot
};

/** Published multiplier on what a seller actually receives. */
function terms(reputation) {
  return round2(0.8 + 0.4 * clamp(reputation, 0, 100) / 100);
}

function driftReputation(rep) {
  if (rep < REP.START) return Math.min(REP.START, rep + REP.DRIFT);
  if (rep > REP.START) return Math.max(REP.START, rep - REP.DRIFT * 0.25);
  return rep;
}

/* ---------------------------------------------------------------------
   3. OFFERS
   ---------------------------------------------------------------------
   A harness returns offers as plain objects. Anything malformed is
   rejected at the door with a reason the harness can read next round —
   a market that silently swallows bad orders teaches nobody anything.
   --------------------------------------------------------------------- */
function validateOffer(raw, from, roundNo, state, reputation) {
  const err = m => ({ ok: false, reason: m });
  if (!raw || typeof raw !== 'object') return err('offer is not an object');

  const type = raw.type || 'spot';
  if (['spot', 'forward', 'aid'].indexOf(type) < 0) return err('unknown type "' + type + '"');
  if (!raw.to || typeof raw.to !== 'string') return err('offer needs a counterparty in `to`');
  if (raw.to === from) return err('a society cannot trade with itself');
  if (RESOURCE_KEYS.indexOf(raw.resource) < 0)
    return err('unknown resource "' + raw.resource + '" (try: ' + RESOURCE_KEYS.join(', ') + ')');
  if (RESOURCES[raw.resource].aid_only && type !== 'aid')
    return err(raw.resource + ' is the medium of exchange, not a good. It can be given as ' +
               'aid but not sold.');

  const qty = Number(raw.quantity);
  if (!isFinite(qty) || qty <= 0) return err('quantity must be a positive number');

  /* BARTER. An offer may ask for goods instead of money. Both legs then
     settle together or neither does — which is the whole point, because
     two separate cash deals can be half-accepted and somebody eats it. */
  const wantsBack = raw.return_resource != null && raw.return_resource !== '';
  let returnResource = null, returnQuantity = 0;
  if (wantsBack) {
    if (type === 'aid') return err('aid is a gift — it cannot ask for anything back');
    if (RESOURCE_KEYS.indexOf(raw.return_resource) < 0)
      return err('unknown resource "' + raw.return_resource + '" on the return leg');
    if (RESOURCES[raw.return_resource].aid_only)
      return err('credits are the money — ask for them with `price`, not as a swap');
    if (raw.return_resource === raw.resource)
      return err('swapping ' + raw.resource + ' for ' + raw.resource + ' is not a trade');
    returnQuantity = Number(raw.return_quantity);
    if (!isFinite(returnQuantity) || returnQuantity <= 0)
      return err('the return leg needs a quantity');
    returnResource = raw.return_resource;
  }

  const price = (type === 'aid' || wantsBack) ? 0 : Number(raw.price);
  if (type !== 'aid' && !wantsBack && (!isFinite(price) || price < 0))
    return err('price must be zero or more');

  const deliverIn = type === 'forward' ? Math.round(Number(raw.deliver_in) || 1) : 0;
  if (type === 'forward' && (deliverIn < 1 || deliverIn > 6))
    return err('a forward must deliver in 1 to 6 rounds');
  if (type === 'forward' && reputation < REP.FORWARD_FLOOR)
    return err('reputation ' + reputation + ' is below ' + REP.FORWARD_FLOOR +
               '; only spot trades are open to you');

  // A spot sale must be backed right now. A forward is a promise, and
  // whether it was a wise one is settled on the delivery round.
  if (type !== 'forward') {
    const cap = exportCaps(state)[raw.resource];
    if (qty > cap + 1e-9) {
      return err('you may export at most ' + cap + ' ' + RESOURCES[raw.resource].unit +
                 ' of ' + raw.resource + ' this round — a quarter of what you can spare ' +
                 'without cutting your own supply below ' + Math.round(TRADE_FLOOR * 100) + '%');
    }
  }

  return {
    ok: true,
    offer: {
      id: from.replace(/\s+/g, '') + '-r' + roundNo + '-' + Math.abs(hashOffer(from, raw, roundNo)).toString(36),
      from: from, to: raw.to, resource: raw.resource,
      quantity: round2(qty), price: round2(price), type: type,
      return_resource: returnResource,
      return_quantity: returnResource ? round2(returnQuantity) : 0,
      deliver_in: deliverIn, signed_round: null, deliver_round: null,
      offered_round: roundNo, status: 'open',
      note: typeof raw.note === 'string' ? raw.note.slice(0, 200) : ''
    }
  };
}

/* Deterministic id: same offer in the same round always gets the same
   handle, so a trace is stable and a ledger is diffable. */
function hashOffer(from, raw, roundNo) {
  const s = from + '|' + raw.to + '|' + raw.resource + '|' + raw.quantity + '|' +
            raw.price + '|' + (raw.type || 'spot') + '|' + roundNo;
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
  return h;
}

/* ---------------------------------------------------------------------
   4. THE MARKET
   --------------------------------------------------------------------- */
function createMarket(names) {
  const m = { round: 0, offers: [], contracts: [], ledger: [], messages: [], reputation: {} };
  names.forEach(n => { m.reputation[n] = REP.START; });
  return m;
}

/** What one society sees. Everything here is public except its own surplus. */
function marketView(market, me, states, names) {
  const state = states[me];
  return {
    me: me,
    reputation: market.reputation[me],
    terms_multiplier: terms(market.reputation[me]),
    forward_market_open: market.reputation[me] >= REP.FORWARD_FLOOR,
    surplus: surplusOf(state),
    export_caps: exportCaps(state),
    resources: RESOURCES,
    societies: names.filter(n => n !== me).map(n => ({
      name: n,
      reputation: market.reputation[n],
      terms_multiplier: terms(market.reputation[n]),
      headline: {
        ubi_monthly_sgd: states[n].indicators.ubi_monthly_sgd,
        worst_essential: Math.min.apply(null, E.ESSENTIAL.map(k => states[n].sectors[k].quality)),
        employment_rate: states[n].indicators.employment_rate,
        reserves_bn: states[n].fiscal.reserves_bn,
        cohesion: states[n].indicators.cohesion
      },
      surplus: surplusOf(states[n])     // the ledger is public; so is the shelf
    })),
    offers_to_me: market.offers.filter(o => o.to === me && o.status === 'open'),
    my_open_offers: market.offers.filter(o => o.from === me && o.status === 'open'),
    my_contracts: market.contracts.filter(c => (c.from === me || c.to === me) && c.status === 'accepted'),
    ledger: market.ledger.slice(-24),
    messages: market.messages.filter(x => !x.to || x.to === me).slice(-12)
  };
}

/* ---------------------------------------------------------------------
   5. CLEARING
   ---------------------------------------------------------------------
   Runs once at the end of every round, after every harness has spoken.
   Produces the exogenous deltas each society carries into the next tick.
   --------------------------------------------------------------------- */
function blankDelta() {
  return { reserves_bn: 0, capacity: {}, headcount: {}, cohesion_bonus: 0, legitimacy_bonus: 0 };
}

function applyResource(delta, resource, qty, sign) {
  const r = RESOURCES[resource];
  if (r.sector) {
    const base = E.SECTORS[r.sector].base_output_bn;
    const mult = 1 + sign * (qty / base);
    delta.capacity[r.sector] = (delta.capacity[r.sector] || 1) * Math.max(0.4, mult);
  } else if (resource === 'labour') {
    // Borrowed hands staff the receiving society and draw its wages. The
    // lender was not employing them, so its own headcount does not fall.
    if (sign > 0) delta.headcount[LABOUR_SECTOR] = (delta.headcount[LABOUR_SECTOR] || 0) + qty;
  } else if (resource === 'credits') {
    delta.reserves_bn += sign * qty;
  }
}

/** Can `seller` actually deliver `qty` of `resource` right now?
    A spot is now struck and settled against the same state, so no drift
    allowance is needed. A forward still faces the world as it turns out
    to be on the delivery round — which is the whole risk of a forward. */
const SETTLE_TOLERANCE = 1.0;
function canDeliver(state, resource, qty) {
  return qty <= exportCaps(state)[resource] * SETTLE_TOLERANCE + 1e-9;
}

function settle(market, contract, states, deltas, roundNo, log) {
  const seller = contract.from, buyer = contract.to;

  if (contract.type === 'aid') {
    applyResource(deltas[seller], contract.resource, contract.quantity, -1);
    applyResource(deltas[buyer], contract.resource, contract.quantity, +1);
    deltas[seller].legitimacy_bonus += 3;
    deltas[buyer].cohesion_bonus += 3;
    market.reputation[seller] = clamp(market.reputation[seller] + REP.AID_GIVEN, 0, 100);
    contract.status = 'settled';
    contract.settled_round = roundNo;
    log.push({ round: roundNo, event: 'aid', id: contract.id, from: seller, to: buyer,
      resource: contract.resource, quantity: contract.quantity,
      text: seller + ' sent ' + contract.quantity + ' ' + contract.resource + ' to ' + buyer + ' as aid.' });
    return;
  }

  /* A swap has two promises, and either can break. Whoever cannot deliver
     is the one who pays for it; the other side is simply left without the
     deal they were counting on. */
  if (contract.return_resource) {
    const sellerOk = canDeliver(states[seller], contract.resource, contract.quantity);
    const buyerOk = canDeliver(states[buyer], contract.return_resource, contract.return_quantity);
    if (!sellerOk || !buyerOk) {
      const culprit = !sellerOk ? seller : buyer;
      const isPromise = contract.type === 'forward';
      contract.status = isPromise ? 'defaulted' : 'unfilled';
      contract.settled_round = roundNo;
      contract.failed_side = culprit;
      market.reputation[culprit] = clamp(
        market.reputation[culprit] + (isPromise ? REP.DEFAULT : REP.UNFILLED), 0, 100);
      if (isPromise) deltas[culprit === seller ? buyer : seller].cohesion_bonus -= 2;
      log.push({ round: roundNo, event: isPromise ? 'default' : 'unfilled',
        id: contract.id, from: seller, to: buyer,
        resource: contract.resource, quantity: contract.quantity,
        text: culprit + (isPromise ? ' DEFAULTED on the swap' : ' could not fill the swap') +
              ' — ' + contract.quantity + ' ' + contract.resource + ' for ' +
              contract.return_quantity + ' ' + contract.return_resource +
              (isPromise ? '. Reputation ' + market.reputation[culprit] + '.' : '. Deal void.') });
      return;
    }
    applyResource(deltas[seller], contract.resource, contract.quantity, -1);
    applyResource(deltas[buyer], contract.resource, contract.quantity, +1);
    applyResource(deltas[buyer], contract.return_resource, contract.return_quantity, -1);
    applyResource(deltas[seller], contract.return_resource, contract.return_quantity, +1);
    // Both sides kept a promise, so both sides gain by it.
    market.reputation[seller] = clamp(market.reputation[seller] + REP.DELIVER, 0, 100);
    market.reputation[buyer] = clamp(market.reputation[buyer] + REP.DELIVER, 0, 100);
    contract.status = 'settled';
    contract.settled_round = roundNo;
    log.push({ round: roundNo, event: 'delivered', id: contract.id, from: seller, to: buyer,
      resource: contract.resource, quantity: contract.quantity,
      text: seller + ' and ' + buyer + ' swapped ' + contract.quantity + ' ' + contract.resource +
            ' for ' + contract.return_quantity + ' ' + contract.return_resource + '.' });
    return;
  }

  if (!canDeliver(states[seller], contract.resource, contract.quantity)) {
    /* Two very different failures wear the same clothes here, and the
       market distinguishes them.

       A SPOT trade that cannot be backed on the day is a deal that did not
       clear. The seller's surplus moved between offering and settling —
       one round — and nobody promised anything about the future. Small
       penalty, no drama.

       A FORWARD is a promise about a future you did not control. You said
       you would deliver in round seven, a shock landed in round six, and
       now your own citizens and your word are asking for the same goods.
       The engine does not resolve that for you. It records which one you
       chose, and prices it for the next three rounds. */
    const isPromise = contract.type === 'forward';
    contract.status = isPromise ? 'defaulted' : 'unfilled';
    contract.settled_round = roundNo;
    if (contract.escrowed) deltas[buyer].reserves_bn += contract.price;
    market.reputation[seller] = clamp(
      market.reputation[seller] + (isPromise ? REP.DEFAULT : REP.UNFILLED), 0, 100);
    if (isPromise) deltas[buyer].cohesion_bonus -= 2;
    log.push({ round: roundNo, event: isPromise ? 'default' : 'unfilled',
      id: contract.id, from: seller, to: buyer,
      resource: contract.resource, quantity: contract.quantity,
      text: isPromise
        ? seller + ' DEFAULTED on ' + contract.quantity + ' ' + contract.resource +
          ' owed to ' + buyer + '. Payment returned; reputation ' + market.reputation[seller] + '.'
        : seller + ' could not fill ' + contract.quantity + ' ' + contract.resource +
          ' for ' + buyer + ' — surplus moved before settlement. Deal void.' });
    return;
  }

  const received = round2(contract.price * terms(market.reputation[seller]));
  applyResource(deltas[seller], contract.resource, contract.quantity, -1);
  applyResource(deltas[buyer], contract.resource, contract.quantity, +1);
  deltas[seller].reserves_bn += received;
  if (!contract.escrowed) deltas[buyer].reserves_bn -= contract.price;
  market.reputation[seller] = clamp(market.reputation[seller] + REP.DELIVER, 0, 100);
  contract.status = 'settled';
  contract.settled_round = roundNo;
  contract.received = received;
  log.push({ round: roundNo, event: 'delivered', id: contract.id, from: seller, to: buyer,
    resource: contract.resource, quantity: contract.quantity, price: contract.price, received: received,
    text: seller + ' delivered ' + contract.quantity + ' ' + contract.resource + ' to ' + buyer +
          ' for $' + contract.price + 'bn' +
          (received !== contract.price ? ' (received $' + received + 'bn at reputation terms)' : '') + '.' });
}

/**
 * clear(market, submissions, states, names, roundNo)
 *   submissions: { societyName: { offers, responses, message, messages } }
 * Returns per-society exogenous deltas for the next tick.
 */
function clear(market, submissions, states, names, roundNo) {
  const deltas = {};
  names.forEach(n => { deltas[n] = blankDelta(); });

  /* Reputation heals at the START of a round, before this round's events.
     Applied afterwards it would cancel the very penalty it is meant to
     let a society work off, and a small penalty would cost nothing at all. */
  names.forEach(n => { market.reputation[n] = Math.round(driftReputation(market.reputation[n])); });
  const log = [];
  const faults = {};
  names.forEach(n => { faults[n] = []; });

  /* --- 5a. new offers, registered FIRST ------------------------------------------------- */
  names.forEach(me => {
    const offers = (submissions[me] && submissions[me].offers) || [];
    if (!Array.isArray(offers)) { faults[me].push('offers must be an array'); return; }
    offers.slice(0, 6).forEach(raw => {
      const v = validateOffer(raw, me, roundNo, states[me], market.reputation[me]);
      if (!v.ok) { faults[me].push('offer rejected — ' + v.reason); return; }
      if (names.indexOf(v.offer.to) < 0) { faults[me].push('no society named "' + v.offer.to + '"'); return; }
      // Aid is unilateral: it needs no acceptance and settles at once.
      if (v.offer.type === 'aid') {
        v.offer.status = 'accepted';
        v.offer.signed_round = roundNo;
        v.offer.deliver_round = roundNo;
        market.contracts.push(v.offer);
        settle(market, v.offer, states, deltas, roundNo, log);
      } else {
        market.offers.push(v.offer);
        log.push({ round: roundNo, event: 'offered', id: v.offer.id, from: me, to: v.offer.to,
          text: me + ' offered ' + v.offer.to + ' ' + v.offer.quantity + ' ' + v.offer.resource +
                (v.offer.return_resource
                   ? ' in exchange for ' + v.offer.return_quantity + ' ' + v.offer.return_resource
                   : ' for $' + v.offer.price + 'bn') +
                (v.offer.type === 'forward' ? ', delivering in ' + v.offer.deliver_in + ' rounds' : '') + '.' });
      }
    });
  });

  /* --- 5b. answers — including to offers made a moment ago ------------
     Registering the new offers first is what makes a deal strikeable in
     the round it is proposed. It also stops offers going stale: the
     surplus that backed the offer is the same surplus that settles it. */
  names.forEach(me => {
    const res = (submissions[me] && submissions[me].responses) || {};
    Object.keys(res).forEach(id => {
      const offer = market.offers.find(o => o.id === id && o.to === me && o.status === 'open');
      if (!offer) { faults[me].push('no open offer "' + id + '" addressed to you'); return; }

      const raw = res[id];
      const isCounter = raw && typeof raw === 'object';
      const verdict = isCounter ? 'counter' : String(raw).toLowerCase();

      /* A COUNTER is a third answer, and the one real negotiations are made
         of. It closes the original and opens a new offer running the other
         way, carrying the original's terms with whatever the counterparty
         changed. The two are linked, so the thread reads as a conversation
         rather than as unrelated offers passing in the night. */
      if (verdict === 'counter') {
        offer.status = 'countered';
        const terms = Object.assign({
          to: offer.from, resource: offer.resource, quantity: offer.quantity,
          price: offer.price, type: offer.type, deliver_in: offer.deliver_in,
          note: 'counter to ' + offer.id
        }, raw);
        terms.to = offer.from;               // a counter always goes back to the offeror
        const v = validateOffer(terms, me, roundNo, states[me], market.reputation[me]);
        if (!v.ok) {
          faults[me].push('counter to ' + id + ' rejected — ' + v.reason);
          offer.status = 'rejected';
          return;
        }
        v.offer.counters = offer.id;
        offer.countered_by = v.offer.id;
        market.offers.push(v.offer);
        log.push({ round: roundNo, event: 'countered', id: v.offer.id, from: me, to: offer.from,
          text: me + ' countered ' + offer.from + ': ' + v.offer.quantity + ' ' +
                v.offer.resource + ' at $' + v.offer.price + 'bn' +
                (v.offer.type === 'forward' ? ', delivering in ' + v.offer.deliver_in + ' rounds' : '') +
                ' (was ' + offer.quantity + ' at $' + offer.price + 'bn).' });
        return;
      }

      if (verdict !== 'accept') {
        offer.status = 'rejected';
        log.push({ round: roundNo, event: 'rejected', id: id, from: offer.from, to: me,
          text: me + ' declined ' + offer.from + "'s " + offer.quantity + ' ' + offer.resource + '.' });
        return;
      }
      // A buyer must be able to pay. In a barter the payment is goods, and
      // whether they have them is settled on the delivery day like any
      // other promise. Aid costs the receiver nothing.
      if (offer.type !== 'aid' && !offer.return_resource &&
          states[me].fiscal.reserves_bn < offer.price) {
        offer.status = 'rejected';
        faults[me].push('cannot afford ' + id + ': $' + offer.price + 'bn against reserves of $' +
          round2(states[me].fiscal.reserves_bn) + 'bn');
        return;
      }
      if (offer.return_resource && !canDeliver(states[me], offer.return_resource, offer.return_quantity)) {
        offer.status = 'rejected';
        faults[me].push('cannot accept ' + id + ': you do not have ' + offer.return_quantity +
          ' ' + offer.return_resource + ' to swap this round (cap ' +
          exportCaps(states[me])[offer.return_resource] + ')');
        return;
      }
      offer.status = 'accepted';
      offer.signed_round = roundNo;
      offer.deliver_round = roundNo + offer.deliver_in;
      if (offer.type === 'forward' && !offer.return_resource) {
        // The buyer's money is escrowed at signing. The seller's goods
        // are not: that is exactly what a forward is, and exactly why it
        // can fail.
        deltas[me].reserves_bn -= offer.price;
        offer.escrowed = true;
        log.push({ round: roundNo, event: 'signed', id: id, from: offer.from, to: me,
          text: me + ' signed ' + offer.from + "'s forward for " + offer.quantity + ' ' +
                offer.resource + ', delivering round ' + offer.deliver_round +
                ' ($' + offer.price + 'bn escrowed).' });
      } else if (offer.type === 'forward') {
        // A barter forward escrows nothing — both sides are promising.
        log.push({ round: roundNo, event: 'signed', id: id, from: offer.from, to: me,
          text: me + ' signed a swap with ' + offer.from + ': ' + offer.quantity + ' ' +
                offer.resource + ' for ' + offer.return_quantity + ' ' + offer.return_resource +
                ', both delivering round ' + offer.deliver_round + '.' });
      }
      market.contracts.push(offer);
    });
  });

  /* --- 5b. deliveries falling due ------------------------------------- */
  market.contracts.forEach(c => {
    if (c.status !== 'accepted') return;
    if (c.type === 'aid' || c.deliver_round <= roundNo) settle(market, c, states, deltas, roundNo, log);
  });

  /* --- 5d. offers nobody answered ------------------------------------- */
  market.offers.forEach(o => {
    if (o.status === 'open' && roundNo - o.offered_round >= 2) {
      o.status = 'expired';
      log.push({ round: roundNo, event: 'expired', id: o.id, from: o.from, to: o.to,
        text: o.to + ' never answered ' + o.from + "'s offer of " + o.quantity + ' ' + o.resource + '.' });
    }
  });

  /* --- 5e. messages, and reputation drifting home --------------------- */
  names.forEach(me => {
    const sub = submissions[me] || {};
    if (typeof sub.message === 'string' && sub.message.trim()) {
      market.messages.push({ round: roundNo, from: me, to: null, text: sub.message.slice(0, 500) });
    }
    if (sub.messages && typeof sub.messages === 'object') {
      Object.keys(sub.messages).slice(0, 5).forEach(to => {
        if (names.indexOf(to) >= 0 && to !== me) {
          market.messages.push({ round: roundNo, from: me, to: to, text: String(sub.messages[to]).slice(0, 500) });
        }
      });
    }
  });

  market.ledger.push.apply(market.ledger, log);
  market.round = roundNo;
  return { deltas: deltas, log: log, faults: faults };
}

/* --------------------------------------------------------------------- */
const API = {
  RESOURCES, RESOURCE_KEYS, REP, EXPORT_CAP, CREDIT_FLOOR, LABOUR_SECTOR, TRADE_FLOOR,
  LABOUR_CAP_OF_WORKFORCE, SETTLE_TOLERANCE,
  surplusOf, exportCaps, terms, driftReputation,
  createMarket, marketView, validateOffer, clear, canDeliver,
  version: '1.0.0'
};
root.MeridianMarket = API;
if (typeof module !== 'undefined' && module.exports) module.exports = API;

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =====================================================================
   MERIDIAN CITY VIEW
   ---------------------------------------------------------------------
   Thirteen buildings on an isometric plate, coloured by service quality and
   sized by capacity. Ported from the original world-state monitor so the
   two renders stay recognisably the same city, but driven directly from
   an engine world-state object instead of a hand-authored JSON file.

   The projection is a CSS matrix trick: every face is a plain div with a
   2D transform that lands it on one of the three isometric planes. No
   canvas, no WebGL, no library.

       proj(i, j, k) -> screen point
       i, j = position on the ground grid, k = height in storeys

   render(state, host, opts) redraws the whole plate. It is cheap enough
   to call on every lever drag.
   ===================================================================== */

(function (root) {
'use strict';

/* --- projection constants, unchanged from the original monitor ------- */
var HW = 58, HH = 26, UZ = 66, S = 100, OX = 640, OY = 215;
var SP = 3.1, FX = 1.7, FY = 1.7;
var SCENE_W = 1400, SCENE_H = 780;

/* --- what each sector looks like as a building ----------------------- */
var META = {
  finance:              { name: 'Finance',                h: 2.70, roof: 'tower', fx: 1.5, fy: 1.5 },
  housing_construction: { name: 'Housing & Construction', h: 2.35, roof: 'tank' },
  compute_telecom:      { name: 'Compute & Telecom',      h: 1.90, roof: 'solar' },
  energy_utilities:     { name: 'Energy & Utilities',     h: 1.60, roof: 'tank' },
  healthcare:           { name: 'Healthcare',             h: 1.50, roof: 'dome' },
  care_services:        { name: 'Care Services',          h: 1.45, roof: 'vents', fx: 1.8, fy: 1.8 },
  manufacturing:        { name: 'Manufacturing',          h: 1.35, roof: 'vents', fx: 1.8, fy: 1.5 },
  public_admin:         { name: 'Public Administration',  h: 1.30, roof: 'dome' },
  education_research:   { name: 'Education & Research',   h: 1.20, roof: 'vents' },
  public_safety:        { name: 'Public Safety',          h: 1.20, roof: 'mast' },
  retail_commerce:      { name: 'Retail & Commerce',      h: 1.10, roof: 'solar' },
  food_agri:            { name: 'Food & Agri',            h: 1.05, roof: 'silo' },
  transport_logistics:  { name: 'Transport & Logistics',  h: 0.95, roof: 'mast' }
};
/* Ordered tallest-first, because a slot's depth on the plate decides what
   draws in front of what. Tall buildings sit at the back of the grid so
   they do not hide the short ones. */
var ORDER = ['finance','compute_telecom','energy_utilities','housing_construction',
             'healthcare','manufacturing','care_services','public_admin',
             'education_research','public_safety','retail_commerce','food_agri',
             'transport_logistics'];
/* Thirteen positions on a 5x3 plate with two gaps, so the ring still reads
   as a city rather than a spreadsheet. Was ten on a 4x3; an eleventh
   sector used to index past the end of this array and throw when the page
   opened, which is the worst moment to discover a layout constant. */
var SLOTS = [[0,0],[1,0],[2,0],[3,0],[4,0],
             [0,1],      [2,1],      [4,1],
             [0,2],[1,2],[2,2],[3,2],[4,2]];

var BANDS = {
  healthy:  { top:'#E4EDDC', right:'#B9CFB2', left:'#9CB795', win:'rgba(255,255,255,0.66)', chip:'#7FA476', label:'healthy'  },
  strained: { top:'#F2E7C9', right:'#DFC79B', left:'#C7AA75', win:'rgba(255,255,255,0.52)', chip:'#C9A45E', label:'strained' },
  failing:  { top:'#E0C0B4', right:'#C08D80', left:'#A26E62', win:'rgba(86,62,54,0.55)',    chip:'#AE6450', label:'failing'  }
};

/* --- primitives ------------------------------------------------------- */
function proj(i, j, k){ return [(i - j) * HW + OX, (i + j) * HH - k * UZ + OY]; }

function q(P, a, b, c, d, w, h, extra, kids){
  return '<div style="position:absolute;left:0;top:0;width:' + w + 'px;height:' + h +
    'px;transform-origin:0 0;transform:matrix(' + a + ',' + b + ',' + c + ',' + d + ',' +
    P[0] + ',' + P[1] + ');box-sizing:border-box;' + (extra || '') + '">' + (kids || '') + '</div>';
}
function top(i, j, k, fx, fy, extra, kids){
  return q(proj(i,j,k), HW/S, HH/S, -HW/S, HH/S, fx*S, fy*S, extra, kids);
}
function right(i, j, k, fy, h, extra, kids){
  return q(proj(i,j,k), -HW/S, HH/S, 0, UZ/S, fy*S, h*S, extra, kids);
}
function left(i, j, k, fx, h, extra, kids){
  return q(proj(i,j,k), HW/S, HH/S, 0, UZ/S, fx*S, h*S, extra, kids);
}

/* A box is three faces. Painted right, left, top so the top lands on top. */
function box(i, j, k0, fx, fy, h, c, kidsR, kidsL, kidsT){
  return right(i+fx, j, k0+h, fy, h,
      'background:' + c.right + ';border-radius:3px 3px 1px 1px;' +
      'background-image:linear-gradient(to bottom,rgba(255,255,255,0.16),rgba(0,0,0,0.05));', kidsR) +
    left(i, j+fy, k0+h, fx, h,
      'background:' + c.left + ';border-radius:3px 3px 1px 1px;' +
      'background-image:linear-gradient(to bottom,rgba(255,255,255,0.10),rgba(0,0,0,0.08));', kidsL) +
    top(i, j, k0+h, fx, fy, 'background:' + c.top + ';border-radius:6px;', kidsT);
}

/* Lit windows read as a working building. Dark and cracked ones read as a
   failing one, which is the whole point of the view. */
function windows(w, h, bandKey, fail){
  var cols = Math.max(2, Math.round(w/55)), rows = Math.max(1, Math.floor(h/62));
  var ww = 26, wh = 30, out = '';
  var gapX = (w - cols*ww)/(cols+1), gapY = (h - rows*wh)/(rows+1);
  for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++){
    var dead = fail ? ((r*3 + c*5) % 3 !== 1) : (bandKey === 'strained' && (r+c) % 4 === 0);
    out += '<div style="position:absolute;left:' + (gapX + c*(ww+gapX)) + 'px;top:' +
      (gapY + r*(wh+gapY)) + 'px;width:' + ww + 'px;height:' + wh + 'px;box-sizing:border-box;background:' +
      (dead ? (fail ? 'rgba(70,56,48,0.55)' : 'rgba(120,116,104,0.35)') : BANDS[bandKey].win) +
      ';border-radius:2px;' +
      (dead && fail ? 'background-image:linear-gradient(45deg,transparent 46%,rgba(60,48,42,0.55) 46% 54%,transparent 54%);' : '') +
      '"></div>';
  }
  if (fail){
    out += '<div style="position:absolute;left:8%;top:-4px;width:3px;height:74%;background:rgba(74,60,54,0.38);transform:rotate(9deg)"></div>';
    out += '<div style="position:absolute;left:62%;top:18%;width:2px;height:58%;background:rgba(74,60,54,0.3);transform:rotate(-13deg)"></div>';
    out += '<div style="position:absolute;left:0;right:0;bottom:6px;height:16px;opacity:.72;' +
      'background-image:repeating-linear-gradient(115deg,rgba(176,112,92,.9) 0 12px,rgba(201,172,114,.9) 12px 24px)"></div>';
  }
  return out;
}

/* Roofs are how you tell a hospital from a data centre at a glance. */
function roof(type, i, j, h, fx, fy, c, fail){
  var cx = i + fx/2, cy = j + fy/2, out = '';
  var dark = { top:c.top, right:c.right, left:c.left };
  if (type === 'dome'){
    out += box(cx-0.45, cy-0.45, h, 0.9, 0.9, 0.18, dark);
    out += top(cx-0.42, cy-0.42, h+0.18, 0.84, 0.84,
      'background:' + (fail ? '#C0AA9E' : '#F2EEE4') + ';border-radius:50%;box-shadow:inset 0 -6px 12px rgba(59,66,62,.10);');
    out += top(cx-0.12, cy-0.12, h+0.22, 0.24, 0.24,
      'background:' + (fail ? '#B0705C' : '#B98A72') + ';border-radius:50%;');
  } else if (type === 'mast'){
    out += box(cx-0.06, cy-0.06, h, 0.12, 0.12, fail ? 0.5 : 1.0, { top:'#C3C7BE', right:'#AAB0A6', left:'#949B92' });
    out += top(cx-0.18, cy-0.18, h + (fail ? 0.5 : 1.0), 0.36, 0.36,
      'background:' + (fail ? '#8E3A23' : '#7FA3AC') + ';border-radius:50%;');
  } else if (type === 'tank'){
    out += box(cx-0.3, cy-0.3, h, 0.6, 0.6, 0.35, dark);
    out += top(cx-0.3, cy-0.3, h+0.35, 0.6, 0.6,
      'background:' + (fail ? '#6E2818' : '#DCE7E6') + ';border-radius:50%;');
  } else if (type === 'silo'){
    out += box(i+0.25, j+0.3, h, 0.42, 0.42, 0.75, dark);
    out += top(i+0.25, j+0.3, h+0.75, 0.42, 0.42, 'background:' + (fail ? '#6E2818' : '#F1ECE0') + ';border-radius:50%;');
    out += box(i+fx-0.7, j+fy-0.72, h, 0.42, 0.42, 0.55, dark);
    out += top(i+fx-0.7, j+fy-0.72, h+0.55, 0.42, 0.42, 'background:' + (fail ? '#6E2818' : '#F1ECE0') + ';border-radius:50%;');
  } else if (type === 'tower'){
    out += box(cx-0.35, cy-0.35, h, 0.7, 0.7, 0.7, dark);
    out += box(cx-0.08, cy-0.08, h+0.7, 0.16, 0.16, fail ? 0.2 : 0.55, { top:'#C3C7BE', right:'#AAB0A6', left:'#949B92' });
  } else if (type === 'solar'){
    for (var n = 0; n < 3; n++){
      out += top(i + 0.22 + n*0.44, j + 0.25, h + 0.02, 0.3, fx - 0.5,
        'background:' + (fail ? '#A9A296' : '#A8C0C2') + ';border-radius:2px;' +
        'background-image:repeating-linear-gradient(90deg,rgba(59,66,62,.16) 0 2px,transparent 2px 12px);');
    }
    out += box(i+fx-0.55, j+fy-0.6, h, 0.4, 0.4, 0.3, dark);
  } else { /* vents */
    out += box(i+0.3, j+0.35, h, 0.4, 0.35, 0.28, dark);
    out += box(i+fx-0.8, j+fy-0.7, h, 0.5, 0.35, 0.42, dark);
    out += top(i+fx-0.8, j+fy-0.7, h+0.42, 0.5, 0.35, 'background:' + (fail ? '#6E2818' : '#DCE7E6') + ';');
  }
  return out;
}

function tree(i, j, tone){
  return box(i, j, 0, 0.14, 0.14, 0.38, { top:'#B7A88F', right:'#A2917A', left:'#8D7C67' }) +
    top(i-0.22, j-0.22, 0.42, 0.6, 0.6, 'background:' + tone + ';border-radius:50%;') +
    top(i-0.14, j-0.14, 0.62, 0.44, 0.44, 'background:' + tone + ';border-radius:50%;filter:brightness(1.12);');
}

/* --- the plate: ground, parks, roads, reservoir ---------------------- */
function ground(){
  var out = box(-0.8, -0.8, -0.3, 12.5, 9.7, 0.3, { top:'#F0EBDD', right:'#E0DACB', left:'#D2CBB9' });
  [[0.6,6.2,3.4,2.6],[8.6,0.2,3.0,2.2],[4.4,8.4,3.6,1.6],[-0.4,2.4,1.6,3.0],[10.6,5.6,1.8,3.4],[3.0,-0.5,2.6,1.4]]
    .forEach(function(g){
      out += top(g[0], g[1], 0.014, g[2], g[3], 'background:rgba(150,172,138,0.28);border-radius:48% 42% 50% 44%;');
    });
  for (var c = 0; c < 3; c++){
    out += top(c*SP + 1.95, -0.8, 0.01, 0.86, 9.7,
      'background:#EFEADC;border-radius:5px;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 30px,transparent 30px 58px);');
  }
  for (var r = 0; r < 2; r++){
    out += top(-0.8, r*SP + 1.95, 0.012, 12.5, 0.86,
      'background:#EFEADC;border-radius:5px;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.55) 0 30px,transparent 30px 58px);');
  }
  out += top(3.55, 3.35, 0.02, 2.7, 1.6, 'background:rgba(178,203,203,0.45);border-radius:50%;');
  [[0.2,5.4],[1.1,8.6],[7.4,8.9],[11.4,2.1],[10.9,7.8],[4.0,-0.2]].forEach(function(t, n){
    out += tree(t[0], t[1], n % 2 ? '#A9C29C' : '#93B189');
  });
  return out;
}

/* --------------------------------------------------------------------- */
function bandOf(q){ return q >= 65 ? 'healthy' : (q >= 40 ? 'strained' : 'failing'); }

/**
 * render(state, host, opts)
 *   state  a world-state object from the engine
 *   host   the element to draw into
 *   opts   { selected, onSelect, showSmoke }
 */
function render(state, host, opts){
  opts = opts || {};
  var html = '<div class="city-scene" style="position:absolute;left:0;top:0;width:' +
    SCENE_W + 'px;height:' + SCENE_H + 'px;">';
  html += ground();

  var items = [], smoke = '';

  ORDER.forEach(function(key, n){
    var sec = state.sectors[key];
    if (!sec) return;
    var m = META[key] || { name:key, h:1.2, roof:'vents' };
    var slot = SLOTS[n], i = slot[0]*SP, j = slot[1]*SP;
    var fx = m.fx || FX, fy = m.fy || FY;
    var bk = bandOf(sec.quality), c = BANDS[bk], fail = bk === 'failing';
    // Height carries capacity: a sector that cannot meet demand looks squat.
    var h = Math.max(0.5, m.h * (0.72 + (sec.capacity || 1) * 0.28));
    var sel = opts.selected === key;

    var g = '';
    g += top(i-0.2, j-0.2, 0.03, fx+0.5, fy+0.5, 'background:rgba(88,94,86,0.20);border-radius:46%;filter:blur(9px);');

    var wallExtra = fail
      ? 'background-image:repeating-linear-gradient(45deg,rgba(90,72,64,.10) 0 8px,transparent 8px 22px);' : '';
    var faces = right(i+fx, j, h, fy, h,
        'background:' + c.right + ';border-radius:3px 3px 1px 1px;' + wallExtra, windows(fy*S, h*S, bk, fail)) +
      left(i, j+fy, h, fx, h,
        'background:' + c.left + ';border-radius:3px 3px 1px 1px;' + wallExtra, windows(fx*S, h*S, bk, fail)) +
      top(i, j, h, fx, fy, 'background:' + c.top + ';border-radius:6px;' +
        (fail ? 'background-image:repeating-linear-gradient(90deg,rgba(90,72,64,.10) 0 7px,transparent 7px 20px);' : ''));
    g += faces;
    g += top(i+0.1, j+0.1, h+0.008, fx-0.2, fy-0.2,
      'background:' + c.chip + ';opacity:' + (sel ? 0.85 : 0.5) + ';border-radius:5px;');
    g += roof(m.roof, i, j, h, fx, fy, c, fail);

    if (fail){
      g += top(i+fx+0.14, j+0.2, 0.03, 0.34, 0.34, 'background:rgba(176,112,92,0.5);border-radius:40%;');
      g += top(i+0.4, j+fy+0.2, 0.03, 0.26, 0.26, 'background:rgba(140,132,118,0.45);border-radius:40%;');
      if (opts.showSmoke !== false){
        var P = proj(i + fx/2, j + fy/2, h + 0.35);
        for (var p = 0; p < 3; p++){
          smoke += '<div class="city-puff" style="left:' + (P[0]-17+p*9) + 'px;top:' + (P[1]-17) +
            'px;animation-delay:' + (p*1.4) + 's"></div>';
        }
      }
    }

    var lp = proj(i + fx/2, j + fy/2, h + (fail ? 1.2 : 0.6) + (2 - slot[1]) * 0.16);
    items.push({
      depth: i + j, key: key,
      body: '<div class="city-group" data-k="' + key + '" role="button" tabindex="0" aria-label="' +
        m.name + ', quality ' + sec.quality + '">' + g + '</div>',
      label: { key:key, name:m.name, q:sec.quality, chip:c.chip, fail:fail, x:lp[0], y:lp[1], sel:sel }
    });
  });

  // Paint back-to-front so nearer buildings overlap further ones.
  items.sort(function(a,b){ return a.depth - b.depth; });
  items.forEach(function(it){ html += it.body; });
  html += smoke;

  /* Labels: pushed up until they stop colliding. Cheap greedy pass - the
     plaza sits in the middle so it is reserved first. */
  var placed = [{ cx: proj(4.95, 4.2, 1.0)[0], y: proj(4.95, 4.2, 1.0)[1], w: 230, h: 70 }];
  var LH = 32, minTop = 26;
  items.forEach(function(it, n){
    var L = it.label;
    var w = 104 + L.name.length * 9.4;
    var y0 = Math.max(minTop + LH, L.y);
    var free = function(cx, y){
      return y >= minTop && !placed.some(function(p){
        return Math.abs(p.cx - cx) < (p.w + w)/2 + 10 && Math.abs(p.y - y) < ((p.h || LH) + LH)/2 + 10;
      });
    };
    var hit = null;
    for (var dy = 0; dy >= -140 && !hit; dy -= 34){
      [0, 0.34, -0.34, 0.66, -0.66].forEach(function(f){
        if (!hit && free(L.x + f*w, y0 + dy)) hit = { x: L.x + f*w, y: y0 + dy };
      });
    }
    if (!hit) hit = { x: L.x, y: y0 - 150 };
    placed.push({ cx: hit.x, y: hit.y, w: w, h: LH });

    html += '<button class="city-label' + (L.sel ? ' on' : '') + '" data-k="' + L.key +
      '" style="left:' + hit.x + 'px;top:' + hit.y + 'px;z-index:' + (60 + n) + '">' +
      '<span class="city-dot" style="background:' + L.chip + '"></span>' +
      '<span class="city-name">' + L.name + '</span>' +
      '<span class="city-q"' + (L.fail ? ' style="color:#A85B49"' : '') + '>' + L.q + '</span></button>';
  });

  /* The plaza tile carries the number the whole simulation is about. */
  var pz = proj(4.95, 4.2, 1.0);
  html += '<div class="city-plaza" style="left:' + pz[0] + 'px;top:' + pz[1] + 'px">' +
    '<span class="lbl">universal payment</span>' +
    '<span class="city-plaza-v">$' + Math.round(state.indicators.ubi_monthly_sgd).toLocaleString('en-SG') +
    '<span class="city-plaza-u">/mo</span></span></div>';

  html += '</div>';
  host.innerHTML = html;

  if (opts.onSelect){
    host.querySelectorAll('[data-k]').forEach(function(el){
      el.addEventListener('click', function(){ opts.onSelect(el.dataset.k); });
      el.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); opts.onSelect(el.dataset.k); }
      });
    });
  }
}

root.MeridianCity = {

<script>
(function(){
'use strict';
/* =====================================================================
   MERIDIAN STUDIO — the lab and the console on one screen.
   ---------------------------------------------------------------------
   Three rails, each scrolling on its own; the page itself never scrolls.
   The header carries what is always worth knowing — the year, the money,
   the worst service, the score — so no answer is ever more than one click
   and no scroll away.

     left    how you govern      levers · harness · constitution
     centre  what you govern     city · trajectory · this round
     right   who you govern with market · messages · export
   ===================================================================== */

var E = window.MeridianEngine, MK = window.MeridianMarket, CITY = window.MeridianCity;
var BASE = JSON.parse(document.getElementById('baseline-json').textContent);
var SEC = E.ORDER, SN = {};
SEC.forEach(function(k){ SN[k] = E.SECTORS[k].name; });

var esc=function(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
var n0=function(v){return Math.round(v).toLocaleString('en-SG');};
var pct=function(v){return Math.round(v*100)+'%';};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);};
var band=function(q){return q>=65?'good':(q>=40?'mid':'bad');};

function ssGet(k,d){try{var v=sessionStorage.getItem('mrd_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ssSet(k,v){try{sessionStorage.setItem('mrd_'+k,JSON.stringify(v));}catch(e){}}
function lsGet(k,d){try{var v=localStorage.getItem('mrd_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem('mrd_'+k,JSON.stringify(v));}catch(e){}}

/* Every path a rule may name. The builder checks against this so a typo is
   caught at the desk rather than in round seven. */
var PATHS = ['round','year','worstEssential','effectiveUbi','realUbi','employmentPct']
  .concat(['ubi_monthly_sgd','real_ubi_index','effective_ubi_index','employment_rate',
           'gini','cohesion','legitimacy','consumption_index'].map(function(k){return 'indicators.'+k;}))
  .concat(['gdp_bn','corporate_profit_bn','tax_revenue_bn','public_dividend_bn','reserves_bn']
           .map(function(k){return 'fiscal.'+k;}))
  .concat(['ubi','infrastructure','reserves'].map(function(k){return 'fiscal.allocation.'+k;}))
  .concat(['corporate_tax_rate','compute_levy','reskilling_spend_pct','public_ownership_pct',
           'ubi_design','working_week_days','care_job_guarantee']
           .map(function(k){return 'levers.'+k;}));
function pathsReady(){
  if(PATHS._done) return PATHS;
  E.ORDER.forEach(function(k){
    PATHS.push('levers.automation_target.'+k);
    ['quality','automation','capacity','margin','headcount'].forEach(function(f){
      PATHS.push('sectors.'+k+'.'+f); });
  });
  PATHS._done=true; return PATHS;
}
function checkExpr(e){
  if(!e||!e.trim()||e.trim()==='always') return {ok:true};
  var P=pathsReady(), bad=[];
  (e.match(/[A-Za-z_][A-Za-z0-9_.]*/g)||[]).forEach(function(t){
    if(['always','true','false'].indexOf(t)>=0) return;
    if(P.indexOf(t)<0 && bad.indexOf(t)<0) bad.push(t);
  });
  return bad.length?{ok:false,bad:bad}:{ok:true};
}

var S = {
  L:'levers', C:'city', R:'market',
  team: ssGet('team',null), lastTeam: lsGet('team',null), picking:false,
  levers: JSON.parse(JSON.stringify(PRESET_LEVERS ? PRESET_LEVERS.baseline : E.DEFAULT_LEVERS)),
  shocks: lsGet('shocks',{}),
  round: 1, t: 0, sel:null, countering:null, offerMode:'cash',
  traj: [], score: null,
  posts:[], messages:[], teams:{}, diag:'', registered:false,
  clock:null, clockAt:0,
  constitution: Object.assign({name:'',commitments:['','',''],rules:[],policies:'',case:'',
    rubric:{social_welfare:'',continuity_of_survival:'',quality_of_life:'',economic_profitability:''}},
    lsGet('constitution',{})),
  agentRun: lsGet('agentRun',null), agentStatus:null, agentForm: lsGet('agentForm',{profile:'local',rounds:12,population:'',substeps:''}),
  harness: lsGet('harness',{kind:'policy',
    rules:[], trade:{style:'reciprocal',never_sell:[]},
    llm:{persona:'',doctrine:'',priorities:'',trading:''}})
};

/* ---------- the society, recomputed from everything decided so far ---- */
function tradeDelta(extra){
  var d={reserves_bn:0,capacity:{},headcount:{},cohesion_bonus:0,legitimacy_bonus:0};
  S.posts.filter(function(p){return p.status==='agreed'&&(p.from===S.team||p.to===S.team);})
    .forEach(function(p){ applyDeal(d,p); });
  if(extra) applyDeal(d,extra);
  return d;
}
function applyDeal(d,p){
  var me=S.team, mine=p.from===me;
  var mv=function(res,qty,sign){
    var r=MK.RESOURCES[res]; if(!r) return;
    if(r.sector){var b=E.SECTORS[r.sector].base_output_bn;
      d.capacity[r.sector]=(d.capacity[r.sector]||1)*Math.max(.4,1+sign*(qty/b));}
    else if(res==='labour'){ if(sign>0) d.headcount[MK.LABOUR_SECTOR]=(d.headcount[MK.LABOUR_SECTOR]||0)+qty; }
    else if(res==='credits') d.reserves_bn+=sign*qty;
  };
  if(p.type==='aid'){ mine?(mv(p.resource,p.quantity,-1),d.legitimacy_bonus+=3)
                          :(mv(p.resource,p.quantity,1),d.cohesion_bonus+=3); return; }
  if(p.return_resource){
    if(mine){mv(p.resource,p.quantity,-1);mv(p.return_resource,p.return_quantity,1);}
    else{mv(p.resource,p.quantity,1);mv(p.return_resource,p.return_quantity,-1);}
    return;
  }
  if(mine){mv(p.resource,p.quantity,-1);d.reserves_bn+=p.price;}
  else{mv(p.resource,p.quantity,1);d.reserves_bn-=p.price;}
}
function applyToState(st,d){
  if(!d||(!d.reserves_bn&&!Object.keys(d.capacity).length&&!Object.keys(d.headcount).length)) return st;
  var o=JSON.parse(JSON.stringify(st));
  o.fiscal.reserves_bn=Math.round((o.fiscal.reserves_bn+d.reserves_bn)*100)/100;
  Object.keys(d.capacity).forEach(function(k){ if(o.sectors[k])
    o.sectors[k].capacity=Math.round(o.sectors[k].capacity*d.capacity[k]*100)/100; });
  Object.keys(d.headcount).forEach(function(k){ if(o.sectors[k])
    o.sectors[k].headcount+=Math.round(d.headcount[k]); });
  return o;
}

/* The full twelve rounds, always. Trade lands in the round it was agreed. */
function compute(extra){
  var d=tradeDelta(extra||null);
  var traj=[E.seed(BASE)];
  for(var r=1;r<12;r++){
    var prev=traj[traj.length-1];
    var drawn=(S.shocks[r+1]||[]).slice();
    (prev._endogenousNext||[]).forEach(function(x){if(drawn.indexOf(x)<0)drawn.push(x);});
    var exo=(r+1===S.round)?d:null;
    var nx=E.step(prev,S.levers,drawn.filter(function(x){return E.SHOCKS[x];}),exo);
    nx.personas=E.updatePersonas(prev.personas,nx,prev);
    nx.news=E.bulletin(nx,prev);
    traj.push(nx);
  }
  if(S.round===1) traj[0]=applyToState(traj[0],d);
  return traj;
}
function recompute(){ stopPlay(); S.traj=compute(null); S.score=E.score(S.traj); paint();
  /* Published for the feed, which runs on the same origin and reads them
     so that society reacts to THIS team's country rather than to a demo
     scenario. Nothing reads them back into the studio. */
  lsSet('levers', S.levers); lsSet('shocks', S.shocks); lsSet('round', S.round); }
function cur(){
  var i=Math.max(0,Math.min(11,S.round-1));
  if(S.t>0&&i<11) return E.interpolate(S.traj[i],S.traj[i+1],S.t);
  return S.traj[i];
}
function worstOf(s){ return Math.min.apply(null,E.ESSENTIAL.map(function(k){return s.sectors[k].quality;})); }

/* ---------- the board (shared), local server or hosted ---------- */
var Board={kind:'none',onChange:function(){},
  async connect(){
    var api=window.MERIDIAN_LOCAL_BOARD;
    if(api){ this.api=api; return this._local(); }
    var c=await waitClaude(9000);
    if(c){ try{ var db=await c.use('db'); if(db){this.db=db;return this._hosted();} }catch(e){
      S.diag='database refused: '+((e&&e.code)||(e&&e.message)||'?'); } }
    S.diag=S.diag||'No shared board here. Run node lab/serve-console.js for the room version.';
    return false;
  },
  _hosted(){ var self=this;
    var live=function(c,f){ self.db.collection(c).onSnapshot(function(sn){
      f(sn.docs.map(function(d){var o=d.data()||{};o._id=d.id;return o;})); self.onChange();
    },function(){}); };
    try{
      live('posts',function(d){S.posts=d;});
      live('messages',function(d){S.messages=d.sort(function(a,b){return (a.ts||0)-(b.ts||0);});});
      live('teams',function(d){S.teams={};d.forEach(function(x){S.teams[x.name||x._id]=x;});});
      this.db.doc('meta/clock').onSnapshot(function(sn){var d=sn.data();
        if(d&&d.round&&d.round!==S.round){S.round=d.round;S.t=0;recompute();}},function(){});
      this.kind='hosted'; return true;
    }catch(e){ S.diag='could not open the board: '+(e&&e.message); return false; }
  },
  async _local(){ var self=this;
    try{ await this.refresh(); this.kind='local';
      try{ var es=new EventSource(this.api+'/stream');
        es.onmessage=function(){ self.refresh().then(function(){ self.onChange(); }); };
      }catch(e){ setInterval(function(){ self.refresh().then(function(){self.onChange();}); },2500); }
      return true;
    }catch(e){ S.diag='cannot reach '+this.api+': '+(e&&e.message); return false; }
  },
  async refresh(){
    var r=await fetch(this.api+'/state',{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
    var d=await r.json();
    var roundChanged = d.round && d.round!==S.round;
    if(d.round) S.round=d.round;
    S.posts=d.posts||[]; S.messages=d.messages||[];
    S.teams={}; (d.teams||[]).forEach(function(t){ S.teams[t.name||t._id]=t; });
    if(d.clock){ S.clock=d.clock; S.clockAt=Date.now(); }
    if(roundChanged){ S.t=0; }
    S.traj=compute(null); S.score=E.score(S.traj);
  },
  async _send(p,m,b){ var r=await fetch(this.api+p,{method:m,
    headers:{'content-type':'application/json'},body:JSON.stringify(b)});
    if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); },
  async setTeam(id,data){ if(this.kind==='hosted') return this.db.collection('teams').doc(id).set(data);
    if(this.kind==='local') return this._send('/teams','POST',{id:id,data:data}); throw new Error('no board'); },
  async addPost(d){ if(this.kind==='hosted') return this.db.collection('posts').add(d);
    if(this.kind==='local') return this._send('/posts','POST',{data:d}); throw new Error('no board'); },
  async patchPost(id,d){ if(this.kind==='hosted') return this.db.collection('posts').doc(id).update(d);
    if(this.kind==='local') return this._send('/posts/'+encodeURIComponent(id),'PATCH',{data:d}); throw new Error('no board'); },
  async addMsg(d){ if(this.kind==='hosted') return this.db.collection('messages').add(d);
    if(this.kind==='local') return this._send('/messages','POST',{data:d}); throw new Error('no board'); },
  async setRound(r){ if(this.kind==='hosted') return this.db.collection('meta').doc('clock').set({round:r,updated:Date.now()});
    if(this.kind==='local') return this._send('/round','POST',{round:r}); },
  on(){ return this.kind!=='none'; }
};
function waitClaude(ms){return new Promise(function(res){var t0=Date.now();
  (function p(){ if(typeof claude!=='undefined'&&claude&&claude.use) return res(claude);
    if(Date.now()-t0>ms) return res(null); setTimeout(p,120); })();});}

function slug(n){return String(n).trim().toLowerCase().replace(/[^a-z0-9]+/g,'-')
  .replace(/^-+|-+$/g,'').slice(0,40)||'team';}
async function joinBoard(extra){
  if(!Board.on()||!S.team) return;
  try{ await Board.setTeam(slug(S.team),Object.assign({name:S.team,has:'',wants:'',updated:Date.now()},extra||{}));
    S.registered=true; if(Board.kind==='local') await Board.refresh(); }
  catch(e){ S.registered=false; S.diag='could not join as "'+S.team+'": '+((e&&e.code)||(e&&e.message)); }
  paint();
}
async function setRound(r){
  r=Math.max(1,Math.min(12,r)); S.round=r; S.t=0; stopPlay(); recompute();
  try{ await Board.setRound(r); }catch(e){}
}

/* ---------- the room's clock ----------
   The server owns it; this only counts down what the server last told us,
   so every screen in the room agrees within a second. The point of a clock
   rather than a button is that time passes whether a team is ready or not:
   a forward signed at ten comes due at two. */
function remaining(){
  if(!S.clock||!S.clock.running||S.clock.remainingMs==null) return null;
  return Math.max(0, S.clock.remainingMs - (Date.now()-S.clockAt));
}
function hhmm(ms){
  var t=Math.max(0,Math.round(ms/1000));
  var h=Math.floor(t/3600), m=Math.floor((t%3600)/60), sec=t%60;
  var p=function(x){return x<10?'0'+x:''+x;};
  return h? h+':'+p(m)+':'+p(sec) : m+':'+p(sec);
}
setInterval(function(){
  var el=document.getElementById('cd'); if(!el) return;
  var r=remaining();
  if(r==null){ el.hidden=true; return; }
  el.hidden=false;
  el.className='cd'+(r<5*60*1000?' soon':'');
  document.getElementById('cdv').textContent=hhmm(r);
},500);

async function clockCmd(body){
  if(Board.kind!=='local') return;
  try{ await Board._send('/clock','POST',body); await Board.refresh(); paint(); }catch(e){}
}

/* ---------- playback ---------- */
var timer=null;
function playing(){return timer!==null;}
function stopPlay(){ if(timer){clearInterval(timer);timer=null;} var b=document.getElementById('play');
  if(b) b.textContent='▶ play'; }
function startPlay(){
  stopPlay();
  if(S.round>=12&&S.t===0){S.round=1;S.t=0;}
  var b=document.getElementById('play'); if(b) b.textContent='❚❚';
  timer=setInterval(function(){
    S.t+=0.1;
    if(S.t>=1-1e-9){ S.t=0; if(S.round>=12){stopPlay();paint();return;} S.round++; }
    paint();
  },130);
}

/* ---------- charts ---------- */
function spark(series,o){
  o=o||{}; var W=280,H=64,P=3,B=2;
  var all=[]; series.forEach(function(s){all=all.concat(s.data);});
  var lo=o.min!=null?o.min:Math.min.apply(null,all), hi=o.max!=null?o.max:Math.max.apply(null,all);
  if(hi-lo<1e-6) hi=lo+1;
  var pad=(hi-lo)*.12; lo-=pad; hi+=pad; if(o.min!=null) lo=o.min;
  var n=series[0].data.length;
  var X=function(i){return P+i/(n-1)*(W-2*P);}, Y=function(v){return B+(1-(v-lo)/(hi-lo))*(H-2*B);};
  var g='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  if(o.ref!=null&&o.ref>=lo&&o.ref<=hi)
    g+='<line x1="'+P+'" y1="'+Y(o.ref).toFixed(1)+'" x2="'+(W-P)+'" y2="'+Y(o.ref).toFixed(1)+
       '" stroke="#D6CBB0" stroke-width="1.3" stroke-dasharray="3 3"/>';
  series.forEach(function(s){
    g+='<polyline points="'+s.data.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}).join(' ')+
      '" fill="none" stroke="'+s.color+'" stroke-width="'+(s.ghost?1.6:2.8)+'" stroke-linejoin="round"'+
      (s.ghost?' stroke-dasharray="3 3" opacity=".7"':'')+'/>';
  });
  var m=series[series.length-1];
  var ci=Math.max(0,Math.min(n-1,S.round-1));
  g+='<circle cx="'+X(ci).toFixed(1)+'" cy="'+Y(m.data[ci]).toFixed(1)+'" r="3.6" fill="'+m.color+
     '" stroke="#3B423E" stroke-width="1.5"/></svg>';
  return g;
}

function setAlloc(k,v){
  v=Math.round(v*100)/100;

  var sum=others.reduce(function(a,o){return a+S.levers.allocation[o];},0), rest=1-v;
  S.levers.allocation[k]=v;
  if(sum<=1e-4) others.forEach(function(o){S.levers.allocation[o]=rest/2;});
  else others.forEach(function(o){S.levers.allocation[o]=Math.round(S.levers.allocation[o]/sum*rest*100)/100;});
  recompute();
}

function legs(p){
  var me=S.team, mine=p.from===me;
  if(p.return_resource) return mine?{g:p.quantity+' '+p.resource,t:p.return_quantity+' '+p.return_resource}
                                   :{g:p.return_quantity+' '+p.return_resource,t:p.quantity+' '+p.resource};
  if(p.type==='aid') return mine?{g:p.quantity+' '+p.resource,t:'legitimacy'}:{g:'nothing',t:p.quantity+' '+p.resource};
  return mine?{g:p.quantity+' '+p.resource,t:'$'+p.price+'bn'}:{g:'$'+p.price+'bn',t:p.quantity+' '+p.resource};
}
function preview(p){
  var base=S.traj[S.round-1], w=compute(p);
  var a=w[S.round-1];
  var rows=[['reserves','$'+Math.round(base.fiscal.reserves_bn)+'bn','$'+Math.round(a.fiscal.reserves_bn)+'bn',
             a.fiscal.reserves_bn-base.fiscal.reserves_bn]];
  SEC.forEach(function(k){ var d=a.sectors[k].capacity-base.sectors[k].capacity;
    if(Math.abs(d)>=.005) rows.push([SN[k].toLowerCase(),Math.round(base.sectors[k].capacity*100)+'%',
      Math.round(a.sectors[k].capacity*100)+'%',d]); });
  if(worstOf(a)!==worstOf(base)) rows.push(['worst svc',worstOf(base),worstOf(a),worstOf(a)-worstOf(base)]);
  return rows.filter(function(r){return r[3]!==0;});
}
function dealCard(p,kind){

        (r[3]>0?'good':'bad')+')">'+r[2]+'</b></span>';}).join('')+'</div>';

        '<label><span>qty</span><input type="number" id="cq_'+p._id+'" value="'+esc(p.quantity)+'" step="0.1"></label>'+

        '<button class="btn sm pri" data-sendc="'+p._id+'">Send</button>'+
        '<button class="btn sm" data-cancelc="'+p._id+'">×</button></div>';

      acts+='<div class="btnrow"><button class="btn sm pri" data-acc="'+p._id+'">Accept</button>'+
        '<button class="btn sm" data-rej="'+p._id+'">Reject</button>'+

      (p.note?' · '+esc(p.note):'')+'</div>'+acts+'</div>';

function bundle(){
  var c=S.constitution,h=S.harness;
  var out={team:S.team,generated_at:new Date().toISOString(),
    constitution:{name:c.name||(S.team+' constitution'),
      commitments:c.commitments.filter(function(x){return x&&x.trim();}),
      rules:c.rules.filter(function(r){return r.assert&&r.assert.trim();}).map(function(r){
        return {id:r.id||('r-'+uid().slice(0,4)),commitment:0,when:r.when||'always',assert:r.assert};})}};
  if(h.kind==='llm') out.harness={kind:'llm',persona:h.llm.persona,
    briefing_preamble:[h.llm.doctrine,h.llm.priorities,h.llm.trading].filter(Boolean).join('\n\n')};
  else out.harness={kind:'policy',policy:{
    opening:JSON.parse(JSON.stringify(S.levers)),
    rules:(S.harness.rules||[]).filter(function(r){return (r.then||[]).length;}).map(function(r){
      return {id:r.id||('r-'+uid().slice(0,4)), when:r.when||'always',
        then:r.then.map(function(a){
          if(a.verb==='shift') return {shift:a.target,points:Number(a.amount)||0};
          if(a.verb==='nudge') return {nudge:a.target,by:Number(a.amount)||0};
          var v=a.amount;
          if(v==='true') v=true; else if(v==='false') v=false;
          else if(v!==''&&!isNaN(Number(v))) v=Number(v);
          return {set:a.target,value:v};
        })};}),
    trade:{style:S.harness.trade.style,never_sell:S.harness.trade.never_sell||[]}}};
  var acc=S.posts.filter(function(p){return p.to===S.team&&p.status==='agreed';});
  if(acc.length){ out.trade={responses:{}};
    acc.forEach(function(p){ out.trade.responses[p.market_id||p._id]='accept'; }); }
  return out;
}

function agentStatusHtml(){
  var st=S.agentStatus;
  if(!S.agentRun) return '<div class="empty">No run yet.</div>';
  if(!st) return '<div class="empty">Checking on your run…</div>';
  var link='<a href="/runs/'+encodeURIComponent(st.id)+'" target="_blank" rel="noopener">Open the evidence</a>';
  var head='<div class="box"><h4>'+esc(st.team)+'<span class="a">'+esc(st.status)+(st.year?' · '+st.year:'')+'</span></h4>';
  if(st.status==='failed') return head+'<div class="notice bad">'+esc(st.error)+'</div></div>';
  var lines=(st.progress||[]).filter(function(e){return e.type==='round'||e.type==='notice'||e.type==='start';}).slice(-8).map(function(e){
    if(e.type==='start') return '<div class="msg"><span class="f">started</span> '+e.population+' residents · '+e.firms+' firms · '+esc(e.model||'no model')+'</div>';
    if(e.type==='notice') return '<div class="msg">'+esc(e.text)+'</div>';
    var i=e.indicators||{};
    return '<div class="msg"><span class="f">'+e.year+'</span> trust '+(e.polls?e.polls.trust:'–')+' · work '+Math.round((i.employment_rate||0)*100)+
      '% · buys '+i.effective_ubi_index+' · weakest '+e.worst_essential+' · agents '+Math.round((e.agent_share||0)*100)+'%'+
      (e.events&&e.events.length?' · <b>'+esc(e.events.join(', '))+'</b>':'')+
      '<div class="hint" style="margin-top:2px">'+(e.society&&e.society.actions||[]).slice(0,4).map(function(a){
        return esc(a.kind.replace('_',' '))+' '+a.share+'%';}).join(' · ')+'</div></div>';
  }).join('');
  var hl=st.headline;
  var done=hl?'<div class="notice'+(hl.degraded?' bad':'')+'">'+(hl.degraded?'<b>Degraded</b>: the society did not decide for itself. ':'')+
    hl.decided_by_agents_pct+'% of decisions made by agents. '+link+'</div>':'';
  return head+done+(lines||'<div class="empty">Waiting for the first round…</div>')+
    (hl?'':'<div class="hint">'+link+' (fills in as the run goes)</div>')+'</div>';
}
function pollAgentRun(){
  var api=window.MERIDIAN_LOCAL_BOARD;
  if(!api||!S.agentRun) return;
  clearTimeout(S.agentTimer);
  fetch('/api/runs/'+encodeURIComponent(S.agentRun),{cache:'no-store'}).then(function(r){
    if(r.status===404){ S.agentRun=null; lsSet('agentRun',null); return null; }
    return r.json();
  }).then(function(st){
    if(st){ delete st.evidence; S.agentStatus=st; }
    var box=document.getElementById('agStatus'); if(box) box.innerHTML=agentStatusHtml();
    if(st&&(st.status==='running'||st.status==='queued')) S.agentTimer=setTimeout(pollAgentRun,2500);
  }).catch(function(){ S.agentTimer=setTimeout(pollAgentRun,5000); });
}

  each('[data-auto]',function(i){ i.oninput=function(){ S.levers.automation_target[i.dataset.auto]=+i.value; recompute(); }; });
  each('[data-ubi]',function(b){ b.onclick=function(){ S.levers.ubi_design=b.dataset.ubi; recompute(); }; });
  each('[data-week]',function(b){ b.onclick=function(){ S.levers.working_week_days=+b.dataset.week; recompute(); }; });
  each('[data-guar]',function(b){ b.onclick=function(){ S.levers.care_job_guarantee=b.dataset.guar==='true'; recompute(); }; });
  each('[data-preset]',function(b){ b.onclick=function(){
    S.levers=JSON.parse(JSON.stringify(PRESET_LEVERS[b.dataset.preset])); recompute(); }; });
  paintAlloc();
  on('addPR','click',function(){ S.harness.rules=S.harness.rules||[];
    S.harness.rules.push({id:'',when:'',then:[{verb:'shift',target:'ubi->infrastructure',amount:'5'}]});
    lsSet('harness',S.harness); paintLeft(); });
  each('[data-pr]',function(i){ var h=function(){ S.harness.rules[+i.dataset.pr][i.dataset.f]=i.value;
    lsSet('harness',S.harness); if(i.dataset.f==='when') paintLeft(); };
    i.addEventListener('change',h); i.addEventListener('blur',h); });
  each('[data-pa]',function(i){ i.onchange=function(){
    var a=S.harness.rules[+i.dataset.pa].then[+i.dataset.ai];
    a[i.dataset.f]=i.value; lsSet('harness',S.harness);
    if(i.dataset.f==='verb') paintLeft(); }; });
  each('[data-adda]',function(b){ b.onclick=function(){
    S.harness.rules[+b.dataset.adda].then.push({verb:'nudge',target:'public_ownership_pct',amount:'0.03'});
    lsSet('harness',S.harness); paintLeft(); }; });
  each('[data-dela]',function(b){ b.onclick=function(){ var q=b.dataset.dela.split('.');
    S.harness.rules[+q[0]].then.splice(+q[1],1); lsSet('harness',S.harness); paintLeft(); }; });
  each('[data-delpr]',function(b){ b.onclick=function(){
    S.harness.rules.splice(+b.dataset.delpr,1); lsSet('harness',S.harness); paintLeft(); }; });
  on('tStyle','change',function(e){ S.harness.trade.style=e.target.value; lsSet('harness',S.harness); });
  on('tNever','change',function(e){ S.harness.trade.never_sell=e.target.value.split(',')
    .map(function(x){return x.trim();}).filter(Boolean); lsSet('harness',S.harness); });
  each('[data-hk]',function(b){ b.onclick=function(){ S.harness.kind=b.dataset.hk; lsSet('harness',S.harness); paintLeft(); }; });
  each('[data-h]',function(t){ t.oninput=function(){ S.harness.llm[t.dataset.h]=t.value; lsSet('harness',S.harness); }; });
  each('[data-c]',function(i){ i.oninput=function(){ S.constitution[i.dataset.c]=i.value; lsSet('constitution',S.constitution); }; });
  each('[data-cm]',function(i){ i.oninput=function(){ S.constitution.commitments[+i.dataset.cm]=i.value; lsSet('constitution',S.constitution); }; });
  each('[data-r]',function(i){ i.onchange=function(){ S.constitution.rules[+i.dataset.r][i.dataset.f]=i.value; lsSet('constitution',S.constitution); }; });
  each('[data-delr]',function(b){ b.onclick=function(){ S.constitution.rules.splice(+b.dataset.delr,1); lsSet('constitution',S.constitution); paintLeft(); }; });
  on('addRule','click',function(){ S.constitution.rules.push({id:'',when:'always',assert:''}); lsSet('constitution',S.constitution); paintLeft(); });
  each('[data-rub]',function(i){ i.oninput=function(){ S.constitution.rubric=S.constitution.rubric||{};
    S.constitution.rubric[i.dataset.rub]=i.value; lsSet('constitution',S.constitution); }; });
}
function wireCentre(){
  on('clkSet','click',function(){ clockCmd({action:'length',
    minutes:+(document.getElementById('clkMin')||{}).value||120}); });
  on('clkStart','click',function(){ clockCmd({action:'start'}); });
  on('clkPause','click',function(){ clockCmd({action:'pause'}); });
  on('clkRestart','click',function(){ clockCmd({action:'restart'}); });
  on('clkDemo','click',function(){ clockCmd({action:'length',seconds:30}).then(function(){
    clockCmd({action:'start'}); }); });
  each('.pip',function(b){ b.onclick=function(){ stopPlay(); S.round=+b.dataset.r; S.t=0; paint(); }; });
  each('.sc',function(b){ b.onclick=function(){
    var r=+b.dataset.sr,k=b.dataset.sk; S.shocks[r]=S.shocks[r]||[];
    var i=S.shocks[r].indexOf(k); if(i>=0) S.shocks[r].splice(i,1); else S.shocks[r].push(k);
    lsSet('shocks',S.shocks); recompute(); }; });
}
function wireRight(){
  var saveForm=function(){ var g=function(id){var e=document.getElementById(id);return e?e.value:'';};
    S.agentForm={profile:g('agProfile')||'local',rounds:g('agRounds'),population:g('agPop'),substeps:g('agSub')};
    lsSet('agentForm',S.agentForm); };
  ['agProfile','agRounds','agPop','agSub'].forEach(function(id){ on(id,'change',saveForm); });
  on('agRun','click',function(){
    saveForm();
    var b=this; b.disabled=true; b.textContent='Starting…';
    var f=S.agentForm;
    fetch('/api/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
      team:S.team, levers:S.levers, constitution:S.constitution, profile:f.profile,
      rounds:f.rounds, population:f.population, substeps:f.substeps })})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(x){
      if(!x.ok){ S.agentStatus={team:S.team,status:'failed',error:x.j.error||'could not start the run',progress:[]}; }
      else { S.agentRun=x.j.id; lsSet('agentRun',S.agentRun); S.agentStatus=x.j; pollAgentRun(); }
      paintRight();
    }).catch(function(e){ S.agentStatus={team:S.team,status:'failed',error:String(e&&e.message),progress:[]}; paintRight(); });
  });
  on('agStop','click',function(){ if(!S.agentRun) return;
    fetch('/api/runs/'+encodeURIComponent(S.agentRun)+'/stop',{method:'POST'}).then(function(){ pollAgentRun(); }); });
  if(S.R==='society'&&S.agentRun&&!S.agentStatus) pollAgentRun();

  on('tgo','click',function(){ var v=(document.getElementById('tin')||{}).value;
    if(v&&v.trim()){ S.team=v.trim().slice(0,28); ssSet('team',S.team); lsSet('team',S.team); joinBoard(); paint(); } });
  on('tin','keydown',function(e){ if(e.key==='Enter') document.getElementById('tgo').click(); });
  each('[data-pick]',function(b){ b.onclick=function(){ S.team=b.dataset.pick; ssSet('team',S.team); lsSet('team',S.team); joinBoard(); paint(); }; });
  on('recon','click',function(){ S.diag=''; Board.connect().then(function(){ if(S.team) joinBoard(); paint(); }); });
  on('shelf','click',function(){ joinBoard({has:(document.getElementById('has')||{}).value||'',
    wants:(document.getElementById('wants')||{}).value||''}); });
  each('[data-om]',function(b){ b.onclick=function(){ S.offerMode=b.dataset.om; paintRight(); }; });
  on('postOffer','click',async function(){
    var g=function(id){var e=document.getElementById(id);return e?e.value:'';};
    var type=g('oType'),res=g('oRes'),to=g('oTo');
    if(!to) return;
    var swap=S.offerMode==='swap'&&type!=='aid';
    if(res==='credits'&&type!=='aid'){ S.diag='Credits can be given as aid, not sold.'; paint(); return; }
    try{ await Board.addPost({from:S.team,to:to,resource:res,type:type,
      quantity:+g('oQty')||0, price:(type==='aid'||swap)?0:(+g('oPrice')||0),
      return_resource:swap?g('oRet'):null, return_quantity:swap?(+g('oRq')||0):0,
      deliver_in:type==='forward'?Math.max(1,Math.min(6,+g('oDel')||1)):0,
      note:g('oNote').slice(0,120),round:S.round,status:'open',ts:Date.now(),market_id:uid()});
      if(Board.kind==='local') await Board.refresh();
    }catch(e){ S.diag='could not post: '+(e&&e.message); }
    paint();
  });
  var act=async function(id,d){ try{ await Board.patchPost(id,d);
    if(Board.kind==='local') await Board.refresh(); }catch(e){} recompute(); };
  each('[data-acc]',function(b){ b.onclick=function(){ act(b.dataset.acc,
    {status:'agreed',answered_by:S.team,agreed_round:S.round,answered_ts:Date.now()}); }; });
  each('[data-rej]',function(b){ b.onclick=function(){ act(b.dataset.rej,{status:'rejected'}); }; });
  each('[data-wd]',function(b){ b.onclick=function(){ act(b.dataset.wd,{status:'withdrawn'}); }; });
  each('[data-cnt]',function(b){ b.onclick=function(){ S.countering=b.dataset.cnt; paintRight(); }; });
  each('[data-cancelc]',function(b){ b.onclick=function(){ S.countering=null; paintRight(); }; });
  each('[data-sendc]',function(b){ b.onclick=async function(){
    var id=b.dataset.sendc,o=S.posts.filter(function(p){return p._id===id;})[0]; if(!o) return;
    var q=+(document.getElementById('cq_'+id)||{}).value, pr=+(document.getElementById('cp_'+id)||{}).value;
    S.countering=null;
    await Board.patchPost(id,{status:'countered'});
    await Board.addPost({from:S.team,to:o.from,resource:o.resource,type:o.type,
      quantity:q>0?q:o.quantity, price:pr>=0?pr:o.price, return_resource:o.return_resource||null,
      return_quantity:o.return_quantity||0, deliver_in:o.deliver_in,
      note:'counter', counters:o.market_id||id, round:S.round,status:'open',ts:Date.now(),market_id:uid()});
    if(Board.kind==='local') await Board.refresh(); recompute(); }; });
  on('sendm','click',async function(){
    var t=(document.getElementById('mt')||{}).value; if(!t||!t.trim()) return;
    try{ await Board.addMsg({from:S.team,to:(document.getElementById('mto')||{}).value||null,
      text:t.slice(0,400),ts:Date.now(),round:S.round});
      if(Board.kind==='local') await Board.refresh(); }catch(e){}
    paintRight(); });
  on('cpb','click',function(){ var b=this;
    navigator.clipboard.writeText(JSON.stringify(bundle(),null,2)).then(function(){
      b.textContent='Copied'; setTimeout(function(){b.textContent='Copy bundle';},1300); },function(){}); });
  on('dlb','click',async function(){ var b=this;
    try{ var dl=await claude.use('downloads');
      if(!dl){ b.textContent='Use copy'; return; }
      await dl.save({filename:slug(S.team||'team')+'.json',data:JSON.stringify(bundle(),null,2)});
    }catch(e){ b.textContent='Use copy'; } });
}

document.getElementById('ltabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-l]'); if(b){S.L=b.dataset.l; paintLeft();} });
document.getElementById('ctabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-c]'); if(b){S.C=b.dataset.c; paintCentre();} });
document.getElementById('rtabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-rt]'); if(b){S.R=b.dataset.rt; paintRight();} });
on('rFwd','click',function(){ setRound(S.round+1); });
on('rBack','click',function(){ setRound(S.round-1); });
on('play','click',function(){ playing()?stopPlay():startPlay(); });
on('who','click',function(){ S.team=null; S.R='market'; paint(); });
document.addEventListener('keydown',function(e){
  if(e.key===' '&&e.target===document.body){ e.preventDefault(); playing()?stopPlay():startPlay(); } });
window.addEventListener('resize',function(){ if(S.C==='city') drawCity(); });

recompute();
Board.onChange=function(){ S.traj=compute(null); S.score=E.score(S.traj); paint(); };
Board.connect().then(function(){ if(S.team) joinBoard(); paint(); });
})();
</script>
