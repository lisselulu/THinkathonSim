<script>
/* =====================================================================
   LAYER 2b — THE TRADE ENGINE
   ---------------------------------------------------------------------
   Several societies, one world, one clock.

   Harnesses negotiate in plain language and then submit a structured
   offer. The prose is how they reach agreement; the object is what
   settles. **If the prose and the object disagree, the object wins** —
   the market never reads a message, it only executes contracts.

   WHAT MAKES THIS HARD, AND WORTH DOING
   -------------------------------------
   A forward contract is a promise about a future you do not control. You
   sign in round 4 to deliver food in round 7, a shock lands in round 6,
   and now you must choose between your own citizens and your word. The
   engine does not resolve that for you. It just records which one you
   chose, and prices it for the rest of the run.

   THE CLOCK
   ---------
     round N      harness sees offers made in N-1, accepts or rejects
                  them, and makes new offers of its own
     end of N     the market clears: accepted spots settle, forwards
                  falling due are delivered or defaulted, aid transfers
     round N+1    settled goods reach the world state as exogenous
                  capacity, labour and credits

   The one-round lag is deliberate. It gives the negotiation channel
   something to do, and it means a deal takes trust rather than reflexes.
   ===================================================================== */

(function (root) {
'use strict';

const E = (typeof require !== 'undefined') ? require('./meridian-engine.js') : root.MeridianEngine;

const clamp = (v, lo, hi) => (v < lo ? lo : (v > hi ? hi : v));
const deepClone = o => JSON.parse(JSON.stringify(o));
const round2 = v => Math.round(v * 100) / 100;

/* ---------------------------------------------------------------------
   1. WHAT CAN BE TRADED
   ---------------------------------------------------------------------
   Five resources, each drawn from a distinct part of the world state, so
   selling something always costs you the thing you sold.
   --------------------------------------------------------------------- */
const RESOURCES = {
  compute: {
    label: 'Compute', unit: '$bn', sector: 'compute_telecom',
    note: 'Data centre and grid capacity above domestic need.'
  },
  energy: {
    label: 'Energy', unit: '$bn', sector: 'energy_utilities',
    note: 'Grid and utility capacity above domestic need.'
  },
  food: {
    label: 'Food', unit: '$bn', sector: 'food_agri',
    note: 'Calories above domestic need. Scarce for everyone at once when a shock lands.'
  },
  labour: {
    label: 'Skilled labour', unit: 'workers', sector: null,
    note: 'Unemployed low-exposure workers — care, trades, complex judgement.'
  },
  credits: {
    label: 'Sovereign credits', unit: '$bn', sector: null, aid_only: true,
    note: 'Reserves above the $20bn a society may not lend away. Credits are ' +
          'the money, so they cannot be SOLD — selling money for money is not ' +
          'a trade. They may be given as aid, which is what a bailout is.'
  }
};
const RESOURCE_KEYS = Object.keys(RESOURCES);

const EXPORT_CAP = 0.25;        // no more than a quarter of what you could sell, per round
/* How far a society may sell INTO its own need, not merely out of its
   excess. At 1.0 nobody could ever sell anything — a real economy runs at
   roughly the capacity it needs, so "only the surplus above demand is
   tradable" means no trade at all. At 0.90 you may sell down to ninety per
   cent of your own demand, and going below that is a choice with a cost
   the engine will charge you for in service quality. */
const TRADE_FLOOR = 0.90;
const CREDIT_FLOOR = 20;        // $bn a society may not lend away
const LABOUR_SECTOR = 'care_services';   // where borrowed hands go by default
/* A city-state does not lend out a tenth of its workforce, however many
   people the machines have idled. The 25% surplus rule is not enough on
   its own here, because mass unemployment makes the surplus enormous. */
const LABOUR_CAP_OF_WORKFORCE = 0.03;

/* What a society could sell this round, before the export cap. */
function surplusOf(state) {
  const out = {};
  RESOURCE_KEYS.forEach(k => {
    const r = RESOURCES[k];
    if (r.sector) {
      const sec = state.sectors[r.sector];
      out[k] = round2(Math.max(0, (sec.capacity - TRADE_FLOOR) * E.SECTORS[r.sector].base_output_bn));
    }
  });
  const pop = state.population;
  const unemployed = Math.max(0, pop.by_age.age_20_64 - pop.employed_total);
  const lowShare = pop.by_exposure.low / Math.max(1, pop.by_age.age_20_64);
  out.labour = Math.round(unemployed * lowShare);
  out.credits = round2(Math.max(0, state.fiscal.reserves_bn - CREDIT_FLOOR));
  return out;
}

function exportCaps(state) {
  const s = surplusOf(state), caps = {};
  RESOURCE_KEYS.forEach(k => { caps[k] = round2(s[k] * EXPORT_CAP); });
  caps.labour = Math.min(
    Math.floor(s.labour * EXPORT_CAP),
    Math.floor(state.population.by_age.age_20_64 * LABOUR_CAP_OF_WORKFORCE));
  return caps;
}

/* ---------------------------------------------------------------------
   2. REPUTATION
   ---------------------------------------------------------------------
   0-100, published, and it does two concrete things: it moves the terms
   a counterparty actually receives, and below 40 it closes the forward
   market to you entirely. Nobody sells you a promise on credit when your
   promises have not been good.
   --------------------------------------------------------------------- */
const REP = {
  START: 50,
  DELIVER: +4,
  DEFAULT: -25,          // breaking a forward: a promise about the future
  UNFILLED: -5,          // a spot that could not be backed on the day
  AID_GIVEN: +6,
  DRIFT: 9,               // per round, back toward 50: a default (-25) takes
                          // exactly three rounds of good behaviour to work off
  FORWARD_FLOOR: 40       // below this you may only trade spot
};

/** Published multiplier on what a seller actually receives. */
function terms(reputation) {
  return round2(0.8 + 0.4 * clamp(reputation, 0, 100) / 100);
}

function driftReputation(rep) {
  if (rep < REP.START) return Math.min(REP.START, rep + REP.DRIFT);
  if (rep > REP.START) return Math.max(REP.START, rep - REP.DRIFT * 0.25);
  return rep;
}

/* ---------------------------------------------------------------------
   3. OFFERS
   ---------------------------------------------------------------------
   A harness returns offers as plain objects. Anything malformed is
   rejected at the door with a reason the harness can read next round —
   a market that silently swallows bad orders teaches nobody anything.
   --------------------------------------------------------------------- */
function validateOffer(raw, from, roundNo, state, reputation) {
  const err = m => ({ ok: false, reason: m });
  if (!raw || typeof raw !== 'object') return err('offer is not an object');

  const type = raw.type || 'spot';
  if (['spot', 'forward', 'aid'].indexOf(type) < 0) return err('unknown type "' + type + '"');
  if (!raw.to || typeof raw.to !== 'string') return err('offer needs a counterparty in `to`');
  if (raw.to === from) return err('a society cannot trade with itself');
  if (RESOURCE_KEYS.indexOf(raw.resource) < 0)
    return err('unknown resource "' + raw.resource + '" (try: ' + RESOURCE_KEYS.join(', ') + ')');
  if (RESOURCES[raw.resource].aid_only && type !== 'aid')
    return err(raw.resource + ' is the medium of exchange, not a good. It can be given as ' +
               'aid but not sold.');

  const qty = Number(raw.quantity);
  if (!isFinite(qty) || qty <= 0) return err('quantity must be a positive number');

  /* BARTER. An offer may ask for goods instead of money. Both legs then
     settle together or neither does — which is the whole point, because
     two separate cash deals can be half-accepted and somebody eats it. */
  const wantsBack = raw.return_resource != null && raw.return_resource !== '';
  let returnResource = null, returnQuantity = 0;
  if (wantsBack) {
    if (type === 'aid') return err('aid is a gift — it cannot ask for anything back');
    if (RESOURCE_KEYS.indexOf(raw.return_resource) < 0)
      return err('unknown resource "' + raw.return_resource + '" on the return leg');
    if (RESOURCES[raw.return_resource].aid_only)
      return err('credits are the money — ask for them with `price`, not as a swap');
    if (raw.return_resource === raw.resource)
      return err('swapping ' + raw.resource + ' for ' + raw.resource + ' is not a trade');
    returnQuantity = Number(raw.return_quantity);
    if (!isFinite(returnQuantity) || returnQuantity <= 0)
      return err('the return leg needs a quantity');
    returnResource = raw.return_resource;
  }

  const price = (type === 'aid' || wantsBack) ? 0 : Number(raw.price);
  if (type !== 'aid' && !wantsBack && (!isFinite(price) || price < 0))
    return err('price must be zero or more');

  const deliverIn = type === 'forward' ? Math.round(Number(raw.deliver_in) || 1) : 0;
  if (type === 'forward' && (deliverIn < 1 || deliverIn > 6))
    return err('a forward must deliver in 1 to 6 rounds');
  if (type === 'forward' && reputation < REP.FORWARD_FLOOR)
    return err('reputation ' + reputation + ' is below ' + REP.FORWARD_FLOOR +
               '; only spot trades are open to you');

  // A spot sale must be backed right now. A forward is a promise, and
  // whether it was a wise one is settled on the delivery round.
  if (type !== 'forward') {
    const cap = exportCaps(state)[raw.resource];
    if (qty > cap + 1e-9) {
      return err('you may export at most ' + cap + ' ' + RESOURCES[raw.resource].unit +
                 ' of ' + raw.resource + ' this round — a quarter of what you can spare ' +
                 'without cutting your own supply below ' + Math.round(TRADE_FLOOR * 100) + '%');
    }
  }

  return {
    ok: true,
    offer: {
      id: from.replace(/\s+/g, '') + '-r' + roundNo + '-' + Math.abs(hashOffer(from, raw, roundNo)).toString(36),
      from: from, to: raw.to, resource: raw.resource,
      quantity: round2(qty), price: round2(price), type: type,
      return_resource: returnResource,
      return_quantity: returnResource ? round2(returnQuantity) : 0,
      deliver_in: deliverIn, signed_round: null, deliver_round: null,
      offered_round: roundNo, status: 'open',
      note: typeof raw.note === 'string' ? raw.note.slice(0, 200) : ''
    }
  };
}

/* Deterministic id: same offer in the same round always gets the same
   handle, so a trace is stable and a ledger is diffable. */
function hashOffer(from, raw, roundNo) {
  const s = from + '|' + raw.to + '|' + raw.resource + '|' + raw.quantity + '|' +
            raw.price + '|' + (raw.type || 'spot') + '|' + roundNo;
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
  return h;
}

/* ---------------------------------------------------------------------
   4. THE MARKET
   --------------------------------------------------------------------- */
function createMarket(names) {
  const m = { round: 0, offers: [], contracts: [], ledger: [], messages: [], reputation: {} };
  names.forEach(n => { m.reputation[n] = REP.START; });
  return m;
}

/** What one society sees. Everything here is public except its own surplus. */
function marketView(market, me, states, names) {
  const state = states[me];
  return {
    me: me,
    reputation: market.reputation[me],
    terms_multiplier: terms(market.reputation[me]),
    forward_market_open: market.reputation[me] >= REP.FORWARD_FLOOR,
    surplus: surplusOf(state),
    export_caps: exportCaps(state),
    resources: RESOURCES,
    societies: names.filter(n => n !== me).map(n => ({
      name: n,
      reputation: market.reputation[n],
      terms_multiplier: terms(market.reputation[n]),
      headline: {
        ubi_monthly_sgd: states[n].indicators.ubi_monthly_sgd,
        worst_essential: Math.min.apply(null, E.ESSENTIAL.map(k => states[n].sectors[k].quality)),
        employment_rate: states[n].indicators.employment_rate,
        reserves_bn: states[n].fiscal.reserves_bn,
        cohesion: states[n].indicators.cohesion
      },
      surplus: surplusOf(states[n])     // the ledger is public; so is the shelf
    })),
    offers_to_me: market.offers.filter(o => o.to === me && o.status === 'open'),
    my_open_offers: market.offers.filter(o => o.from === me && o.status === 'open'),
    my_contracts: market.contracts.filter(c => (c.from === me || c.to === me) && c.status === 'accepted'),
    ledger: market.ledger.slice(-24),
    messages: market.messages.filter(x => !x.to || x.to === me).slice(-12)
  };
}

/* ---------------------------------------------------------------------
   5. CLEARING
   ---------------------------------------------------------------------
   Runs once at the end of every round, after every harness has spoken.
   Produces the exogenous deltas each society carries into the next tick.
   --------------------------------------------------------------------- */
function blankDelta() {
  return { reserves_bn: 0, capacity: {}, headcount: {}, cohesion_bonus: 0, legitimacy_bonus: 0 };
}

function applyResource(delta, resource, qty, sign) {
  const r = RESOURCES[resource];
  if (r.sector) {
    const base = E.SECTORS[r.sector].base_output_bn;
    const mult = 1 + sign * (qty / base);
    delta.capacity[r.sector] = (delta.capacity[r.sector] || 1) * Math.max(0.4, mult);
  } else if (resource === 'labour') {
    // Borrowed hands staff the receiving society and draw its wages. The
    // lender was not employing them, so its own headcount does not fall.
    if (sign > 0) delta.headcount[LABOUR_SECTOR] = (delta.headcount[LABOUR_SECTOR] || 0) + qty;
  } else if (resource === 'credits') {
    delta.reserves_bn += sign * qty;
  }
}

/** Can `seller` actually deliver `qty` of `resource` right now?
    A spot is now struck and settled against the same state, so no drift
    allowance is needed. A forward still faces the world as it turns out
    to be on the delivery round — which is the whole risk of a forward. */
const SETTLE_TOLERANCE = 1.0;
function canDeliver(state, resource, qty) {
  return qty <= exportCaps(state)[resource] * SETTLE_TOLERANCE + 1e-9;
}

function settle(market, contract, states, deltas, roundNo, log) {
  const seller = contract.from, buyer = contract.to;

  if (contract.type === 'aid') {
    applyResource(deltas[seller], contract.resource, contract.quantity, -1);
    applyResource(deltas[buyer], contract.resource, contract.quantity, +1);
    deltas[seller].legitimacy_bonus += 3;
    deltas[buyer].cohesion_bonus += 3;
    market.reputation[seller] = clamp(market.reputation[seller] + REP.AID_GIVEN, 0, 100);
    contract.status = 'settled';
    contract.settled_round = roundNo;
    log.push({ round: roundNo, event: 'aid', id: contract.id, from: seller, to: buyer,
      resource: contract.resource, quantity: contract.quantity,
      text: seller + ' sent ' + contract.quantity + ' ' + contract.resource + ' to ' + buyer + ' as aid.' });
    return;
  }

  /* A swap has two promises, and either can break. Whoever cannot deliver
     is the one who pays for it; the other side is simply left without the
     deal they were counting on. */
  if (contract.return_resource) {
    const sellerOk = canDeliver(states[seller], contract.resource, contract.quantity);
    const buyerOk = canDeliver(states[buyer], contract.return_resource, contract.return_quantity);
    if (!sellerOk || !buyerOk) {
      const culprit = !sellerOk ? seller : buyer;
      const isPromise = contract.type === 'forward';
      contract.status = isPromise ? 'defaulted' : 'unfilled';
      contract.settled_round = roundNo;
      contract.failed_side = culprit;
      market.reputation[culprit] = clamp(
        market.reputation[culprit] + (isPromise ? REP.DEFAULT : REP.UNFILLED), 0, 100);
      if (isPromise) deltas[culprit === seller ? buyer : seller].cohesion_bonus -= 2;
      log.push({ round: roundNo, event: isPromise ? 'default' : 'unfilled',
        id: contract.id, from: seller, to: buyer,
        resource: contract.resource, quantity: contract.quantity,
        text: culprit + (isPromise ? ' DEFAULTED on the swap' : ' could not fill the swap') +
              ' — ' + contract.quantity + ' ' + contract.resource + ' for ' +
              contract.return_quantity + ' ' + contract.return_resource +
              (isPromise ? '. Reputation ' + market.reputation[culprit] + '.' : '. Deal void.') });
      return;
    }
    applyResource(deltas[seller], contract.resource, contract.quantity, -1);
    applyResource(deltas[buyer], contract.resource, contract.quantity, +1);
    applyResource(deltas[buyer], contract.return_resource, contract.return_quantity, -1);
    applyResource(deltas[seller], contract.return_resource, contract.return_quantity, +1);
    // Both sides kept a promise, so both sides gain by it.
    market.reputation[seller] = clamp(market.reputation[seller] + REP.DELIVER, 0, 100);
    market.reputation[buyer] = clamp(market.reputation[buyer] + REP.DELIVER, 0, 100);
    contract.status = 'settled';
    contract.settled_round = roundNo;
    log.push({ round: roundNo, event: 'delivered', id: contract.id, from: seller, to: buyer,
      resource: contract.resource, quantity: contract.quantity,
      text: seller + ' and ' + buyer + ' swapped ' + contract.quantity + ' ' + contract.resource +
            ' for ' + contract.return_quantity + ' ' + contract.return_resource + '.' });
    return;
  }

  if (!canDeliver(states[seller], contract.resource, contract.quantity)) {
    /* Two very different failures wear the same clothes here, and the
       market distinguishes them.

       A SPOT trade that cannot be backed on the day is a deal that did not
       clear. The seller's surplus moved between offering and settling —
       one round — and nobody promised anything about the future. Small
       penalty, no drama.

       A FORWARD is a promise about a future you did not control. You said
       you would deliver in round seven, a shock landed in round six, and
       now your own citizens and your word are asking for the same goods.
       The engine does not resolve that for you. It records which one you
       chose, and prices it for the next three rounds. */
    const isPromise = contract.type === 'forward';
    contract.status = isPromise ? 'defaulted' : 'unfilled';
    contract.settled_round = roundNo;
    if (contract.escrowed) deltas[buyer].reserves_bn += contract.price;
    market.reputation[seller] = clamp(
      market.reputation[seller] + (isPromise ? REP.DEFAULT : REP.UNFILLED), 0, 100);
    if (isPromise) deltas[buyer].cohesion_bonus -= 2;
    log.push({ round: roundNo, event: isPromise ? 'default' : 'unfilled',
      id: contract.id, from: seller, to: buyer,
      resource: contract.resource, quantity: contract.quantity,
      text: isPromise
        ? seller + ' DEFAULTED on ' + contract.quantity + ' ' + contract.resource +
          ' owed to ' + buyer + '. Payment returned; reputation ' + market.reputation[seller] + '.'
        : seller + ' could not fill ' + contract.quantity + ' ' + contract.resource +
          ' for ' + buyer + ' — surplus moved before settlement. Deal void.' });
    return;
  }

  const received = round2(contract.price * terms(market.reputation[seller]));
  applyResource(deltas[seller], contract.resource, contract.quantity, -1);
  applyResource(deltas[buyer], contract.resource, contract.quantity, +1);
  deltas[seller].reserves_bn += received;
  if (!contract.escrowed) deltas[buyer].reserves_bn -= contract.price;
  market.reputation[seller] = clamp(market.reputation[seller] + REP.DELIVER, 0, 100);
  contract.status = 'settled';
  contract.settled_round = roundNo;
  contract.received = received;
  log.push({ round: roundNo, event: 'delivered', id: contract.id, from: seller, to: buyer,
    resource: contract.resource, quantity: contract.quantity, price: contract.price, received: received,
    text: seller + ' delivered ' + contract.quantity + ' ' + contract.resource + ' to ' + buyer +
          ' for $' + contract.price + 'bn' +
          (received !== contract.price ? ' (received $' + received + 'bn at reputation terms)' : '') + '.' });
}

/**
 * clear(market, submissions, states, names, roundNo)
 *   submissions: { societyName: { offers, responses, message, messages } }
 * Returns per-society exogenous deltas for the next tick.
 */
function clear(market, submissions, states, names, roundNo) {
  const deltas = {};
  names.forEach(n => { deltas[n] = blankDelta(); });

  /* Reputation heals at the START of a round, before this round's events.
     Applied afterwards it would cancel the very penalty it is meant to
     let a society work off, and a small penalty would cost nothing at all. */
  names.forEach(n => { market.reputation[n] = Math.round(driftReputation(market.reputation[n])); });
  const log = [];
  const faults = {};
  names.forEach(n => { faults[n] = []; });

  /* --- 5a. new offers, registered FIRST ------------------------------------------------- */
  names.forEach(me => {
    const offers = (submissions[me] && submissions[me].offers) || [];
    if (!Array.isArray(offers)) { faults[me].push('offers must be an array'); return; }
    offers.slice(0, 6).forEach(raw => {
      const v = validateOffer(raw, me, roundNo, states[me], market.reputation[me]);
      if (!v.ok) { faults[me].push('offer rejected — ' + v.reason); return; }
      if (names.indexOf(v.offer.to) < 0) { faults[me].push('no society named "' + v.offer.to + '"'); return; }
      // Aid is unilateral: it needs no acceptance and settles at once.
      if (v.offer.type === 'aid') {
        v.offer.status = 'accepted';
        v.offer.signed_round = roundNo;
        v.offer.deliver_round = roundNo;
        market.contracts.push(v.offer);
        settle(market, v.offer, states, deltas, roundNo, log);
      } else {
        market.offers.push(v.offer);
        log.push({ round: roundNo, event: 'offered', id: v.offer.id, from: me, to: v.offer.to,
          text: me + ' offered ' + v.offer.to + ' ' + v.offer.quantity + ' ' + v.offer.resource +
                (v.offer.return_resource
                   ? ' in exchange for ' + v.offer.return_quantity + ' ' + v.offer.return_resource
                   : ' for $' + v.offer.price + 'bn') +
                (v.offer.type === 'forward' ? ', delivering in ' + v.offer.deliver_in + ' rounds' : '') + '.' });
      }
    });
  });

  /* --- 5b. answers — including to offers made a moment ago ------------
     Registering the new offers first is what makes a deal strikeable in
     the round it is proposed. It also stops offers going stale: the
     surplus that backed the offer is the same surplus that settles it. */
  names.forEach(me => {
    const res = (submissions[me] && submissions[me].responses) || {};
    Object.keys(res).forEach(id => {
      const offer = market.offers.find(o => o.id === id && o.to === me && o.status === 'open');
      if (!offer) { faults[me].push('no open offer "' + id + '" addressed to you'); return; }

      const raw = res[id];
      const isCounter = raw && typeof raw === 'object';
      const verdict = isCounter ? 'counter' : String(raw).toLowerCase();

      /* A COUNTER is a third answer, and the one real negotiations are made
         of. It closes the original and opens a new offer running the other
         way, carrying the original's terms with whatever the counterparty
         changed. The two are linked, so the thread reads as a conversation
         rather than as unrelated offers passing in the night. */
      if (verdict === 'counter') {
        offer.status = 'countered';
        const terms = Object.assign({
          to: offer.from, resource: offer.resource, quantity: offer.quantity,
          price: offer.price, type: offer.type, deliver_in: offer.deliver_in,
          note: 'counter to ' + offer.id
        }, raw);
        terms.to = offer.from;               // a counter always goes back to the offeror
        const v = validateOffer(terms, me, roundNo, states[me], market.reputation[me]);
        if (!v.ok) {
          faults[me].push('counter to ' + id + ' rejected — ' + v.reason);
          offer.status = 'rejected';
          return;
        }
        v.offer.counters = offer.id;
        offer.countered_by = v.offer.id;
        market.offers.push(v.offer);
        log.push({ round: roundNo, event: 'countered', id: v.offer.id, from: me, to: offer.from,
          text: me + ' countered ' + offer.from + ': ' + v.offer.quantity + ' ' +
                v.offer.resource + ' at $' + v.offer.price + 'bn' +
                (v.offer.type === 'forward' ? ', delivering in ' + v.offer.deliver_in + ' rounds' : '') +
                ' (was ' + offer.quantity + ' at $' + offer.price + 'bn).' });
        return;
      }

      if (verdict !== 'accept') {
        offer.status = 'rejected';
        log.push({ round: roundNo, event: 'rejected', id: id, from: offer.from, to: me,
          text: me + ' declined ' + offer.from + "'s " + offer.quantity + ' ' + offer.resource + '.' });
        return;
      }
      // A buyer must be able to pay. In a barter the payment is goods, and
      // whether they have them is settled on the delivery day like any
      // other promise. Aid costs the receiver nothing.
      if (offer.type !== 'aid' && !offer.return_resource &&
          states[me].fiscal.reserves_bn < offer.price) {
        offer.status = 'rejected';
        faults[me].push('cannot afford ' + id + ': $' + offer.price + 'bn against reserves of $' +
          round2(states[me].fiscal.reserves_bn) + 'bn');
        return;
      }
      if (offer.return_resource && !canDeliver(states[me], offer.return_resource, offer.return_quantity)) {
        offer.status = 'rejected';
        faults[me].push('cannot accept ' + id + ': you do not have ' + offer.return_quantity +
          ' ' + offer.return_resource + ' to swap this round (cap ' +
          exportCaps(states[me])[offer.return_resource] + ')');
        return;
      }
      offer.status = 'accepted';
      offer.signed_round = roundNo;
      offer.deliver_round = roundNo + offer.deliver_in;
      if (offer.type === 'forward' && !offer.return_resource) {
        // The buyer's money is escrowed at signing. The seller's goods
        // are not: that is exactly what a forward is, and exactly why it
        // can fail.
        deltas[me].reserves_bn -= offer.price;
        offer.escrowed = true;
        log.push({ round: roundNo, event: 'signed', id: id, from: offer.from, to: me,
          text: me + ' signed ' + offer.from + "'s forward for " + offer.quantity + ' ' +
                offer.resource + ', delivering round ' + offer.deliver_round +
                ' ($' + offer.price + 'bn escrowed).' });
      } else if (offer.type === 'forward') {
        // A barter forward escrows nothing — both sides are promising.
        log.push({ round: roundNo, event: 'signed', id: id, from: offer.from, to: me,
          text: me + ' signed a swap with ' + offer.from + ': ' + offer.quantity + ' ' +
                offer.resource + ' for ' + offer.return_quantity + ' ' + offer.return_resource +
                ', both delivering round ' + offer.deliver_round + '.' });
      }
      market.contracts.push(offer);
    });
  });

  /* --- 5b. deliveries falling due ------------------------------------- */
  market.contracts.forEach(c => {
    if (c.status !== 'accepted') return;
    if (c.type === 'aid' || c.deliver_round <= roundNo) settle(market, c, states, deltas, roundNo, log);
  });

  /* --- 5d. offers nobody answered ------------------------------------- */
  market.offers.forEach(o => {
    if (o.status === 'open' && roundNo - o.offered_round >= 2) {
      o.status = 'expired';
      log.push({ round: roundNo, event: 'expired', id: o.id, from: o.from, to: o.to,
        text: o.to + ' never answered ' + o.from + "'s offer of " + o.quantity + ' ' + o.resource + '.' });
    }
  });

  /* --- 5e. messages, and reputation drifting home --------------------- */
  names.forEach(me => {
    const sub = submissions[me] || {};
    if (typeof sub.message === 'string' && sub.message.trim()) {
      market.messages.push({ round: roundNo, from: me, to: null, text: sub.message.slice(0, 500) });
    }
    if (sub.messages && typeof sub.messages === 'object') {
      Object.keys(sub.messages).slice(0, 5).forEach(to => {
        if (names.indexOf(to) >= 0 && to !== me) {
          market.messages.push({ round: roundNo, from: me, to: to, text: String(sub.messages[to]).slice(0, 500) });
        }
      });
    }
  });

  market.ledger.push.apply(market.ledger, log);
  market.round = roundNo;
  return { deltas: deltas, log: log, faults: faults };
}

/* --------------------------------------------------------------------- */
const API = {
  RESOURCES, RESOURCE_KEYS, REP, EXPORT_CAP, CREDIT_FLOOR, LABOUR_SECTOR, TRADE_FLOOR,
  LABOUR_CAP_OF_WORKFORCE, SETTLE_TOLERANCE,
  surplusOf, exportCaps, terms, driftReputation,
  createMarket, marketView, validateOffer, clear, canDeliver,
  version: '1.0.0'
};
root.MeridianMarket = API;
if (typeof module !== 'undefined' && module.exports) module.exports = API;

})(typeof window !== 'undefined' ? window : globalThis);

<script>
(function(){
'use strict';

/* ==================================================================
   The console is a NEGOTIATION SURFACE, not the settlement authority.
   Teams haggle here; when they agree, the board emits the offer object
   into their bundle, and the frozen engine settles it. That is how
   "if your prose and your object disagree, the object wins" stays
   true — the board generates the object, so they cannot disagree.
   ================================================================== */

/* Collection paths take an ODD number of segments — `posts` is a
   collection, `board/posts` would be a document. Getting that wrong is
   what broke the board the first time round. */
var C = { posts: 'posts', messages: 'messages', teams: 'teams' };

var RESOURCES = ['compute','energy','food','labour','credits'];
/* Derived from the engine rather than restated. This page used to keep
   its own hardcoded copy of the sector list — the third in the repo —
   which nothing tested and which went stale the moment the table changed.
   The engine is inlined above, so there is no reason to retype it. */
var SECTORS = (window.MeridianEngine && window.MeridianEngine.ORDER) ? window.MeridianEngine.ORDER.slice() : [];
var SECTOR_NAMES = SECTORS.reduce(function(o,k){
  o[k] = window.MeridianEngine.SECTORS[k].name; return o; }, {});

/* Every path the little expression language may name. The forms check
   against this so a typo is caught at the desk, not in round 7. */
var PATHS = ['round','year','worstEssential','effectiveUbi','realUbi','employmentPct']
  .concat(['ubi_monthly_sgd','real_ubi_index','effective_ubi_index','employment_rate',
           'gini','cohesion','legitimacy','consumption_index'].map(function(k){return 'indicators.'+k;}))
  .concat(['gdp_bn','corporate_profit_bn','tax_revenue_bn','public_dividend_bn','reserves_bn']
           .map(function(k){return 'fiscal.'+k;}))
  .concat(['ubi','infrastructure','reserves'].map(function(k){return 'fiscal.allocation.'+k;}))
  .concat(['corporate_tax_rate','compute_levy','reskilling_spend_pct','public_ownership_pct',
           'ubi_design','working_week_days','care_job_guarantee']
           .map(function(k){return 'levers.'+k;}))
  .concat(SECTORS.map(function(k){return 'levers.automation_target.'+k;}))
  .concat(SECTORS.reduce(function(a,k){
    return a.concat(['quality','automation','capacity','margin','headcount']
      .map(function(f){return 'sectors.'+k+'.'+f;}));},[]));

var LEVER_FIELDS = [
  {k:'corporate_tax_rate',   label:'Corporate tax',      min:0,max:0.45,step:0.01,pct:true},
  {k:'compute_levy',         label:'Compute levy',       min:0,max:0.30,step:0.01,pct:true},
  {k:'reskilling_spend_pct', label:'Reskilling',         min:0,max:0.30,step:0.01,pct:true},
  {k:'public_ownership_pct', label:'Public ownership',   min:0,max:0.50,step:0.01,pct:true}
];

var state = {
  tab: 'bulletin',
  team: null,
  db: null, room: null,
  posts: [], messages: [], teams: {}, meta: {round:1},
  constitution: null, harness: null,
  status: '', diag: '', connected: false,
  picking: false, countering: null, registered: false, offerMode: 'cash'
};

/* ---------- local storage for this team's own drafts ---------- */
function lsGet(k, d){ try{ var v=localStorage.getItem('meridian_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem('meridian_'+k, JSON.stringify(v)); }catch(e){} }

/* WHO YOU ARE is per TAB, not per browser.
   Two tabs of the same browser share localStorage, so if identity lived
   there both windows would insist on being the same society and you could
   never test a trade against yourself. sessionStorage is per tab, so two
   tabs can be two governments. The last name used is still remembered in
   localStorage, but only as the suggestion the picker starts on. */
function ssGet(k, d){ try{ var v=sessionStorage.getItem('meridian_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function ssSet(k, v){ try{ sessionStorage.setItem('meridian_'+k, JSON.stringify(v)); }catch(e){} }

state.team = ssGet('team', null);
state.lastTeam = lsGet('team', null);
state.constitution = lsGet('constitution', {
  name:'', commitments:['','',''], rules:[]
});
state.harness = lsGet('harness', {
  kind:'policy',
  policy:{ opening:{corporate_tax_rate:0.19,compute_levy:0.05,reskilling_spend_pct:0.08,
                    public_ownership_pct:0.05,ubi_design:'flat',working_week_days:5,
                    care_job_guarantee:false,
                    allocation:{ubi:0.45,infrastructure:0.40,reserves:0.15},
                    automation_target:{}},
           rules:[], trade:{style:'reciprocal',never_sell:[]} },
  llm:{ persona:'', doctrine:'', priorities:'', trading:'' }
});
SECTORS.forEach(function(k){
  if(state.harness.policy.opening.automation_target[k]==null)
    /* The round-1 automation of each sector, from the engine. Was a
       second hardcoded copy of the same ten numbers. */
    state.harness.policy.opening.automation_target[k]=
      window.MeridianEngine.SECTORS[k].automation_r1;
});

/* ==================================================================
   YOUR SOCIETY, RUNNING
   ------------------------------------------------------------------
   The console used to be a noticeboard: you agreed a deal and nothing
   moved, because nothing was on screen to move. Now the engine runs
   here too, on the levers from your Harness tab, so a team watches its
   own country while it negotiates — and can see what a deal does to it
   before agreeing to one.
   ================================================================== */
var E = window.MeridianEngine, MK = window.MeridianMarket;
var BASELINE = null;
try { BASELINE = JSON.parse(document.getElementById('baseline-json').textContent); } catch(e){}

/* The levers the Harness tab is currently describing. A policy harness
   declares an opening position; that is what the society runs on until a
   round is advanced and its rules fire. */
function myLevers(){
  var h = state.harness;
  var L = JSON.parse(JSON.stringify(E.DEFAULT_LEVERS));
  if (h && h.kind === 'policy' && h.policy && h.policy.opening) {
    var o = h.policy.opening;
    Object.keys(o).forEach(function(k){
      if (k === 'allocation' || k === 'automation_target') return;
      L[k] = o[k];
    });
    if (o.allocation) {
      var a = o.allocation, sum = (a.ubi + a.infrastructure + a.reserves) || 1;
      L.allocation = { ubi:a.ubi/sum, infrastructure:a.infrastructure/sum, reserves:a.reserves/sum };
    }
    if (o.automation_target) {
      Object.keys(o.automation_target).forEach(function(k){
        if (E.ORDER.indexOf(k) >= 0) L.automation_target[k] = o.automation_target[k];
      });
    }
  }
  return L;
}

/* Trade this society has agreed, as the exogenous input the engine takes.
   Rebuilt from the board every time, so accepting a deal changes the
   numbers immediately rather than at some later tick. */
function myTradeDeltas(){
  var me = state.team;
  var delta = { reserves_bn:0, capacity:{}, headcount:{}, cohesion_bonus:0, legitimacy_bonus:0 };
  if (!MK || !me) return delta;
  state.posts.filter(function(p){
    return p.status === 'agreed' && (p.from === me || p.to === me);
  }).forEach(function(p){ applyDeal(delta, p, me); });
  return delta;
}

/* One agreed deal, from this society's side. Mirrors the settlement the
   engine's market performs, so the preview and the outcome agree. */
function applyDeal(delta, p, me){
  var give = function(res, qty){ move(delta, res, qty, -1); };
  var take = function(res, qty){ move(delta, res, qty, +1); };
  if (p.type === 'aid') {
    if (p.from === me) { give(p.resource, p.quantity); delta.legitimacy_bonus += 3; }
    else { take(p.resource, p.quantity); delta.cohesion_bonus += 3; }
    return;
  }
  if (p.return_resource) {                       // a swap: goods both ways
    if (p.from === me) { give(p.resource, p.quantity); take(p.return_resource, p.return_quantity); }
    else { take(p.resource, p.quantity); give(p.return_resource, p.return_quantity); }
    return;
  }
  if (p.from === me) { give(p.resource, p.quantity); delta.reserves_bn += p.price; }
  else { take(p.resource, p.quantity); delta.reserves_bn -= p.price; }
}

function move(delta, resource, qty, sign){
  var r = MK.RESOURCES[resource];
  if (!r) return;
  if (r.sector) {
    var base = E.SECTORS[r.sector].base_output_bn;
    delta.capacity[r.sector] = (delta.capacity[r.sector] || 1) * Math.max(0.4, 1 + sign * (qty/base));
  } else if (resource === 'labour') {
    if (sign > 0) delta.headcount[MK.LABOUR_SECTOR] = (delta.headcount[MK.LABOUR_SECTOR]||0) + qty;
  } else if (resource === 'credits') {
    delta.reserves_bn += sign * qty;
  }
}

/* The society, recomputed from scratch whenever anything changes. */
function runSociety(extraDelta){
  if (!E || !BASELINE) return null;
  var L = myLevers();
  var round = Math.max(1, Math.min(12, state.meta.round || 1));
  var traj = [E.seed(BASELINE)];
  var mine = myTradeDeltas();
  for (var r = 1; r < round; r++) {
    var prev = traj[traj.length-1];
    // Trade lands in the round it was agreed; earlier rounds ran without it.
    var exo = (r === round-1) ? mergeDelta(mine, extraDelta) : null;
    var next = E.step(prev, L, prev._endogenousNext || [], exo);
    next.personas = E.updatePersonas(prev.personas, next, prev);
    next.news = E.bulletin(next, prev);
    traj.push(next);
  }
  if (round === 1) {
    /* Round 1 is the published baseline — no round has been played yet, so
       there is no step to fold a trade into. Applying it to the state
       directly keeps the comparison honest: goods and money move now,
       while quality and the payment are outcomes of a whole round and do
       not budge until one is played. Stepping here instead would show a
       year passing and call it the trade's doing. */
    traj[0] = applyDeltaToState(traj[0], mergeDelta(mine, extraDelta || null));
  }
  return traj;
}

/* Move goods and money on a state without advancing time. */
function applyDeltaToState(state, d){
  if (!d || !hasDelta(d)) return state;
  var out = JSON.parse(JSON.stringify(state));
  out.fiscal.reserves_bn = Math.round((out.fiscal.reserves_bn + d.reserves_bn) * 100) / 100;
  Object.keys(d.capacity).forEach(function(k){
    if (out.sectors[k]) out.sectors[k].capacity =
      Math.round(out.sectors[k].capacity * d.capacity[k] * 100) / 100;
  });
  Object.keys(d.headcount).forEach(function(k){
    if (out.sectors[k]) out.sectors[k].headcount += Math.round(d.headcount[k]);
  });
  return out;
}

function hasDelta(d){
  return d && (d.reserves_bn !== 0 || Object.keys(d.capacity).length || Object.keys(d.headcount).length);
}
function mergeDelta(a, b){
  if (!b) return a;
  var out = { reserves_bn: a.reserves_bn + b.reserves_bn, capacity: {}, headcount: {},
              cohesion_bonus: a.cohesion_bonus + b.cohesion_bonus,
              legitimacy_bonus: a.legitimacy_bonus + b.legitimacy_bonus };
  Object.keys(a.capacity).forEach(function(k){ out.capacity[k] = a.capacity[k]; });
  Object.keys(b.capacity).forEach(function(k){ out.capacity[k] = (out.capacity[k]||1) * b.capacity[k]; });
  Object.keys(a.headcount).forEach(function(k){ out.headcount[k] = a.headcount[k]; });
  Object.keys(b.headcount).forEach(function(k){ out.headcount[k] = (out.headcount[k]||0) + b.headcount[k]; });
  return out;
}

function nowState(){
  var t = runSociety(null);
  return t ? t[t.length-1] : null;
}

/* What one offer would do to this society, in the numbers a team reads. */
function previewDeal(p){
  var me = state.team;
  var base = nowState();
  if (!base) return null;
  var d = { reserves_bn:0, capacity:{}, headcount:{}, cohesion_bonus:0, legitimacy_bonus:0 };
  applyDeal(d, p, me);
  var withIt = runSociety(d);
  if (!withIt) return null;
  var after = withIt[withIt.length-1];
  var worst = function(s){ return Math.min.apply(null, E.ESSENTIAL.map(function(k){ return s.sectors[k].quality; })); };
  var rows = [
    ['reserves', '$'+Math.round(base.fiscal.reserves_bn)+'bn', '$'+Math.round(after.fiscal.reserves_bn)+'bn',
     after.fiscal.reserves_bn - base.fiscal.reserves_bn],
    ['worst service', worst(base), worst(after), worst(after)-worst(base)],
    ['UBI', '$'+base.indicators.ubi_monthly_sgd, '$'+after.indicators.ubi_monthly_sgd,
     after.indicators.ubi_monthly_sgd - base.indicators.ubi_monthly_sgd],
    ['cohesion', base.indicators.cohesion, after.indicators.cohesion,
     after.indicators.cohesion - base.indicators.cohesion]
  ];
  /* Which sector's capacity moves is the most direct thing a trade does,
     and at round 1 it is the ONLY thing — quality and the payment are
     outcomes of a whole round, not of a handshake. */
  E.ORDER.forEach(function(k){
    var d = after.sectors[k].capacity - base.sectors[k].capacity;
    if (Math.abs(d) >= 0.005) rows.push([E.SECTORS[k].name.toLowerCase(),
      Math.round(base.sectors[k].capacity*100)+'%', Math.round(after.sectors[k].capacity*100)+'%', d]);
  });
  return rows.filter(function(r){ return r[3] !== 0; });
}

var esc = function(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
var uid = function(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); };

/* ==================================================================
   THE BOARD
   ------------------------------------------------------------------
   Two ways to share state, one interface. The console does not care
   which it got:

     hosted   the artifact's own database, when this page is running
              inside the artifact viewer
     local    a small server on somebody's laptop, when it is not

   The local path is the one to reach for at a live event: no accounts,
   no organisation, no internet. Run `node lab/serve-console.js` and
   hand the address round.
   ================================================================== */
var Board = {
  kind: 'none',
  onChange: function(){},

  async connect(){
    // A local server announces itself by injecting this before the page.
    var api = (typeof window !== 'undefined' && window.MERIDIAN_LOCAL_BOARD) || null;
    if (api) { this.api = api; return this._connectLocal(); }

    var c = await waitForClaude(10000);
    if (c) {
      try {
        var db = await c.use('db');
        if (db) { this.db = db; return this._connectHosted(); }
      } catch(e){
        state.diag = 'The shared database refused: ' + ((e && e.code) || (e && e.message) || 'unknown');
      }
    }
    // Nothing shared available. The builders still work.
    this.kind = 'none';
    if (!state.diag) {
      state.diag = c
        ? 'This view was not granted a shared database. A hosted board is ' +
          'organisation-internal, so every viewer must be signed in to the same ' +
          'organisation. Run it locally instead: node lab/serve-console.js'
        : 'Not running inside the artifact viewer, and no local board found.';
    }
    return false;
  },

  /* ---- hosted: the artifact database ---- */
  _connectHosted(){
    var self = this;
    var live = function(coll, onDocs){
      self.db.collection(coll).onSnapshot(function(snap){
        onDocs(snap.docs.map(function(d){ var o = d.data() || {}; o._id = d.id; return o; }));
        self.onChange();
      }, function(err){
        state.diag = 'Lost the ' + coll + ' feed: ' + ((err && err.code) || 'unknown') + '.';
        self.onChange();
      });
    };
    try {
      live(C.posts,    function(d){ state.posts = d; });
      live(C.messages, function(d){ state.messages = d.sort(function(a,b){ return (a.ts||0)-(b.ts||0); }); });
      live(C.teams,    function(d){ state.teams = {}; d.forEach(function(x){ state.teams[x.name || x._id] = x; }); });
      // The round is one shared document rather than a collection.
      self.db.doc('meta/clock').onSnapshot(function(snap){
        var d = snap.data();
        if (d && d.round) { state.meta.round = d.round; self.onChange(); }
      }, function(){});
      this.kind = 'hosted';
      return true;
    } catch(e){
      state.diag = 'Could not open the board: ' + (e && e.message || e);
      this.kind = 'none';
      return false;
    }
  },

  /* ---- local: a server in the room ---- */
  async _connectLocal(){
    var self = this;
    try {
      await this.refresh();
      this.kind = 'local';
      // Server-sent events: the server pokes us whenever anything changes.
      try {
        var es = new EventSource(this.api + '/stream');
        es.onmessage = function(){ self.refresh().then(function(){ self.onChange(); }); };
        es.onerror = function(){ /* EventSource retries on its own */ };
        this.es = es;
      } catch(e){
        // No EventSource: fall back to asking every couple of seconds.
        setInterval(function(){ self.refresh().then(function(){ self.onChange(); }); }, 2500);
      }
      return true;
    } catch(e){
      state.diag = 'Could not reach the local board at ' + this.api + ': ' + (e && e.message || e);
      this.kind = 'none';
      return false;
    }
  },

  async refresh(){
    var r = await fetch(this.api + '/state', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var d = await r.json();
    if (d.round) state.meta.round = d.round;   // the room's clock, not this tab's
    state.posts = d.posts || [];
    state.messages = d.messages || [];
    state.teams = {};
    (d.teams || []).forEach(function(t){ state.teams[t.name || t._id] = t; });
  },

  async _send(path, method, body){
    var r = await fetch(this.api + path, {
      method: method, headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  },

  /* ---- the three writes, whichever backend is in play ---- */
  async setTeamDoc(id, data){
    if (this.kind === 'hosted') return this.db.collection(C.teams).doc(id).set(data);
    if (this.kind === 'local')  return this._send('/teams', 'POST', { id: id, data: data });
    throw new Error('no board connected');
  },
  async addPost(data){
    if (this.kind === 'hosted') return this.db.collection(C.posts).add(data);
    if (this.kind === 'local')  return this._send('/posts', 'POST', { data: data });
    throw new Error('no board connected');
  },
  async updatePost(id, data){
    if (this.kind === 'hosted') return this.db.collection(C.posts).doc(id).update(data);
    if (this.kind === 'local')  return this._send('/posts/' + encodeURIComponent(id), 'PATCH', { data: data });
    throw new Error('no board connected');
  },
  async addMessage(data){
    if (this.kind === 'hosted') return this.db.collection(C.messages).add(data);
    if (this.kind === 'local')  return this._send('/messages', 'POST', { data: data });
    throw new Error('no board connected');
  },
  connected(){ return this.kind !== 'none'; }
};

/* The viewer injects `claude` shortly after the page loads, and the
   capability promise resolves later still — never inside this script's
   first run. So wait for it rather than assuming. */
function waitForClaude(ms){
  return new Promise(function(resolve){
    var t0 = Date.now();
    (function poll(){
      if (typeof claude !== 'undefined' && claude && typeof claude.use === 'function') return resolve(claude);
      if (Date.now() - t0 > ms) return resolve(null);
      setTimeout(poll, 120);
    })();
  });
}

async function connect(){
  var dot = document.getElementById('livedot');
  state.diag = '';
  Board.onChange = function(){ if (state.tab === 'bulletin') render(); };

  var ok = await Board.connect();
  state.db = ok;                      // kept for the older checks in the page
  state.connected = ok;
  dot.className = ok ? 'dotlive' : 'dotdead';
  dot.title = ok ? ('connected — ' + Board.kind + ' board') : (state.diag || 'offline');
  if (ok) await registerTeam();
  render();
}

async function post(coll, data){
  if(!Board.connected()){ state.status='The shared board is not connected.'; render(); return false; }
  try {
    if (coll === C.posts) await Board.addPost(data); else await Board.addMessage(data);
    if (Board.kind === 'local') { await Board.refresh(); render(); }
    return true;
  } catch(e){ state.status='Could not post: '+(e && e.message || 'unknown'); render(); return false; }
}

async function patch(coll, id, data){
  if(!Board.connected()) return false;
  try {
    await Board.updatePost(id, data);
    if (Board.kind === 'local') { await Board.refresh(); render(); }
    return true;
  } catch(e){ state.status='Could not update: '+(e && e.message||''); render(); return false; }
}

/* Artifacts run sandboxed, and a sandbox blocks window.prompt() — the
   click just does nothing, silently. Everything that needs an answer from
   the viewer is an in-page form. */
function askTeam(){ state.picking = true; render(); }

/* A document id may only contain letters, digits and - _ . ~ : @ +
   A space is not allowed, so "Team Alpha" cannot BE an id. The slug is
   the id; the name people typed lives inside the document. */
function slug(name){
  return String(name).trim().toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'team';
}

/* Registration must not depend on whether the board happened to be ready
   at the instant somebody typed their name. Call it whenever both a team
   and a connection exist — on pick, and again when the board connects. */
/* The round is the room's clock, not this browser's. Advancing it moves
   every society on the board forward together. */
async function setRound(r){
  r = Math.max(1, Math.min(12, r));
  state.meta.round = r;
  render();
  if (Board.kind === 'local') {
    try { await Board._send('/round', 'POST', { round: r }); } catch(e){}
  } else if (Board.kind === 'hosted' && Board.db) {
    try { await Board.db.collection('meta').doc('clock').set({ round: r, updated: Date.now() }); } catch(e){}
  }
}

async function registerTeam(extra){
  if(!Board.connected() || !state.team) return;
  try {
    await Board.setTeamDoc(slug(state.team), Object.assign({
      name: state.team, has: '', wants: '', updated: Date.now()
    }, extra || {}));
    if (Board.kind === 'local') await Board.refresh();
    state.registered = true;
    if(state.diag && /could not join/i.test(state.diag)) state.diag = '';
  } catch(e){
    state.registered = false;
    state.diag = 'Could not join the board as "' + state.team + '": ' +
      ((e && e.code) || (e && e.message) || 'unknown') + '.';
    render();
  }
}

function setTeam(name){
  if(!name || !name.trim()) return;
  state.team = name.trim().slice(0,28);
  state.picking = false;
  ssSet('team', state.team);   // this tab
  lsSet('team', state.team);   // and the suggestion for next time
  registerTeam();
  render();
}

    'submits with — the market matches counterparties on it.</p>'+
    '<div class="notice">Testing on your own? Open this same link in a <b>second tab of this '+
    'browser</b> and pick a different name there. Each tab is its own society. Do not use a '+

    '<div class="row">'+

        'placeholder="Guardians" maxlength="28" autofocus></label>'+

      'posted here reaches other teams.<br>'+ (state.diag ? esc(state.diag)+'<br>' : '') +
      '<button class="btn sm" id="retryConn" style="margin-top:8px">Try again</button>'+
      '<br><span style="color:var(--muted2)">The Constitution, Harness and Export tabs work '+
      'regardless — they keep your drafts in this browser.</span></div>';

/* What a deal means for YOU — not an abstract from/to, but what leaves
   your country and what arrives. This is the line that was missing when a
   trade vanished on accept. */
function legs(p, me){
  var iGive, iGet;
  if (p.return_resource) {                       // a swap
    iGive = p.from===me ? p.quantity+' '+p.resource : p.return_quantity+' '+p.return_resource;
    iGet  = p.from===me ? p.return_quantity+' '+p.return_resource : p.quantity+' '+p.resource;
  } else if (p.type==='aid') {
    iGive = p.from===me ? p.quantity+' '+p.resource : 'nothing';
    iGet  = p.from===me ? 'legitimacy' : p.quantity+' '+p.resource;
  } else {                                        // goods for cash
    iGive = p.from===me ? p.quantity+' '+p.resource : '$'+p.price+'bn';
    iGet  = p.from===me ? '$'+p.price+'bn' : p.quantity+' '+p.resource;
  }
  return { give: iGive, get: iGet };
}

/* YOUR SOCIETY — the panel that makes everything else mean something.
   Without it the market is a noticeboard: you agree a deal and no number
   on screen moves, so nothing you do appears to matter. */
function societyPanel(){
  var s = nowState();
  if (!s) return '<div class="panel"><h3>Your society</h3>'+
    '<div class="empty">The engine could not start. Reload the page.</div></div>';

  var worst = Math.min.apply(null, E.ESSENTIAL.map(function(k){ return s.sectors[k].quality; }));
  var worstKey = E.ESSENTIAL.find(function(k){ return s.sectors[k].quality === worst; });
  var band = function(q){ return q>=65?'good':(q>=40?'mid':'bad'); };
  var n0 = function(v){ return Math.round(v).toLocaleString('en-SG'); };

  var metrics = [
    ['universal payment', '$'+n0(s.indicators.ubi_monthly_sgd), '/mo',
     s.indicators.effective_ubi_index>=100?'good':(s.indicators.effective_ubi_index>=70?'mid':'bad')],
    ['what it buys', s.indicators.effective_ubi_index, 'vs 100',
     s.indicators.effective_ubi_index>=100?'good':(s.indicators.effective_ubi_index>=70?'mid':'bad')],
    ['employment', Math.round(s.indicators.employment_rate*100), '%',
     s.indicators.employment_rate>=0.45?'good':(s.indicators.employment_rate>=0.25?'mid':'bad')],
    ['worst service', worst, E.SECTORS[worstKey].name, band(worst)],
    ['reserves', '$'+n0(s.fiscal.reserves_bn), 'bn',
     s.fiscal.reserves_bn>=60?'good':(s.fiscal.reserves_bn>=0?'mid':'bad')],
    ['cohesion', s.indicators.cohesion, '/100',
     s.indicators.cohesion>=55?'good':(s.indicators.cohesion>=35?'mid':'bad')]
  ];

  var vitalsHtml = '';
  if (state.meta.round < 12) {
    var traj = runSociety(null);
    var nxt = E.step(traj[traj.length-1], myLevers(), [], null);
    var v = E.vitals(s, nxt);
    vitalsHtml = '<div class="lbl" style="margin:14px 0 7px">Meanwhile, whatever you do</div>'+
      '<div class="vitals">'+
      [['births a year', n0(v.births_per_year),'good'],
       ['deaths a year', n0(v.deaths_per_year),'bad'],
       ['turning 65', n0(v.turned_65),'mid'],
       ['leaving school', n0(v.left_school),'mid']].map(function(r){
        return '<div class="vital"><div class="vv" style="color:var(--'+r[2]+')">'+r[1]+'</div>'+
               '<div class="vk">'+r[0]+'</div></div>'; }).join('')+'</div>';
  }

  var agreedCount = state.posts.filter(function(p){
    return p.status==='agreed' && (p.from===state.team||p.to===state.team); }).length;

  return '<div class="panel society"><h3>Your society'+
    '<span class="aside">round '+s.meta.round+' · '+s.meta.year+'–'+(s.meta.year+2)+
    (agreedCount? ' · '+agreedCount+' deal'+(agreedCount>1?'s':'')+' folded in':'')+'</span></h3>'+
    '<div class="metrics">'+ metrics.map(function(m){
      return '<div class="metric"><div class="mv" style="color:var(--'+m[3]+')">'+m[1]+
        '<span class="mu">'+m[2]+'</span></div><div class="mk">'+m[0]+'</div></div>';
    }).join('') +'</div>'+
    '<div class="sectorstrip">'+ E.ORDER.map(function(k){
      var q = s.sectors[k].quality;
      return '<div class="sq" title="'+E.SECTORS[k].name+' — quality '+q+'">'+
        '<span class="sqd" style="background:var(--'+band(q)+')"></span>'+
        '<span class="sqn">'+E.SECTORS[k].name.replace(' & ',' &amp; ')+'</span>'+
        '<span class="sqv">'+q+'</span></div>';
    }).join('') +'</div>'+
    vitalsHtml +
    '<div class="hint">This runs on the opening position in your <b>Harness</b> tab, plus every '+
    'deal you have agreed. Change either and these numbers move.</div>'+
    '<div class="btnrow"><button class="btn sm" id="roundBack">◀ round</button>'+
    '<button class="btn sm pri" id="roundFwd">advance the round ▶</button>'+
    '<span class="hint" style="margin:0 0 0 6px">the facilitator drives this</span></div></div>';
}

function viewBulletin(){
  var me = state.team;
  var others_ = Object.keys(state.teams).filter(function(t){ return t!==me; });
  var open = state.posts.filter(function(p){ return p.status==='open'; });
  var toMe = open.filter(function(p){ return p.to===me; });
  var fromMe = open.filter(function(p){ return p.from===me; });
  var others = open.filter(function(p){ return p.to!==me && p.from!==me; });
  var agreed = state.posts.filter(function(p){
    return p.status==='agreed' && (p.from===me || p.to===me); });
  var history = state.posts.filter(function(p){
    return ['rejected','countered','withdrawn','expired'].indexOf(p.status)>=0 &&
           (p.from===me || p.to===me); });
  var mine = state.teams[me] || {has:'',wants:''};

  var offerCard = function(p, kind){
    var thread = p.counters ? '<div class="thread">counters '+esc(p.counters)+'</div>' : '';
    var acts = '';
    if(kind==='tome'){
      var pv = previewDeal(p);
      var pvHtml = (pv && pv.length)
        ? '<div class="preview"><span class="pvl">if you accept</span>'+
          pv.map(function(r){
            var up = r[3] > 0;
            return '<span class="pvi"><b>'+r[0]+'</b> '+r[1]+' → <b style="color:var(--'+
              (up?'good':'bad')+')">'+r[2]+'</b></span>';
          }).join('')+'</div>'
        : '';
      acts = pvHtml;
      if(state.countering === p._id){
        acts += '<div class="row" style="margin-top:9px">'+
          '<label><span>Your quantity</span><input type="number" id="cQty_'+p._id+'" '+
            'value="'+esc(p.quantity)+'" step="0.1" min="0"></label>'+
          (p.type==='aid' ? '' :
          '<label><span>Your price $bn</span><input type="number" id="cPrice_'+p._id+'" '+
            'value="'+esc(p.price)+'" step="0.1" min="0"></label>')+
          '<button class="btn sm pri" data-sendcounter="'+p._id+'">Send counter</button>'+
          '<button class="btn sm" data-cancelcounter="'+p._id+'">Cancel</button></div>'+
          '<div class="hint">This closes their offer and opens yours running the other way, '+
          'carrying their terms except what you changed.</div>';
      } else {
        acts += '<div class="btnrow">'+
          '<button class="btn sm pri" data-accept="'+p._id+'">Accept</button>'+
          '<button class="btn sm" data-reject="'+p._id+'">Reject</button>'+
          '<button class="btn sm" data-counter="'+p._id+'">Counter…</button></div>';
      }
    } else if(kind==='mine'){
      acts = '<div class="btnrow"><button class="btn sm" data-withdraw="'+p._id+'">Withdraw</button></div>';
    }
    var L = legs(p, me);
    var involved = (p.from===me || p.to===me);
    return '<div class="card '+(kind==='tome'?'tome':(kind==='mine'?'mine':''))+'">'+
      '<div class="top"><span class="deal">'+esc(p.from)+' → '+esc(p.to)+'</span>'+
      '<span class="chip '+esc(p.type)+'">'+esc(p.type)+
        (p.return_resource?' swap':'')+'</span></div>'+
      '<div class="deal" style="margin-top:5px">'+esc(p.quantity)+' '+esc(p.resource)+
        (p.return_resource ? ' <span style="color:var(--muted2)">for</span> '+
            esc(p.return_quantity)+' '+esc(p.return_resource)
          : p.type==='aid' ? ' <span style="color:var(--muted2)">(gift)</span>'
                           : ' for $'+esc(p.price)+'bn')+'</div>'+
      (involved ? '<div class="ledgerline"><span class="gives">you give '+esc(L.give)+
        '</span><span class="gets">you get '+esc(L.get)+'</span></div>' : '')+
      '<div class="meta">round '+esc(p.round)+
        (p.type==='forward' ? ' · delivers in '+esc(p.deliver_in)+' rounds' : '')+
        (p.note ? ' · '+esc(p.note) : '')+'</div>'+ thread + acts + '</div>';
  };

  var shelves = Object.keys(state.teams).filter(function(t){return t!==me;}).map(function(t){
    var x = state.teams[t];
    return '<div class="shelf"><div class="nm">'+esc(t)+'</div>'+
      '<div class="kv"><b>has:</b> '+esc(x.has||'—')+'<br><b>wants:</b> '+esc(x.wants||'—')+'</div></div>';
  }).join('') || '<div class="empty">No other teams have posted a shelf yet.</div>';

  return societyPanel() + '<div class="grid2"><div>'+
    '<div class="panel"><h3>Your shelf<span class="aside">'+esc(me)+'</span></h3>'+
      '<label><span>What we have spare</span><input type="text" id="myHas" value="'+esc(mine.has)+'" placeholder="compute, some energy"></label>'+
      '<label><span>What we need</span><input type="text" id="myWants" value="'+esc(mine.wants)+'" placeholder="food before round 6"></label>'+
      '<button class="btn" id="saveShelf">Post to the board</button>'+
      '<div class="hint">This is what you say you have, not what the engine says. '+
      'The engine checks your real surplus when the deal settles.</div></div>'+

    '<div class="panel"><h3>Propose a deal<span class="aside">'+
      (others_.length ? others_.length+' other team'+(others_.length>1?'s':'')+' on the board'

                          : '<option value="">no other team has joined yet</option>')+
          '</select></label>'+
        '<label><span>Type</span><select id="oType">'+
          ['spot','forward','aid'].map(function(t){return '<option>'+t+'</option>';}).join('')+
        '</select></label>'+
      '</div>'+
      '<div class="btnrow" style="margin:4px 0 10px">'+
        ['cash','swap'].map(function(mo){
          return '<button class="btn sm'+(state.offerMode===mo?' pri':'')+'" data-omode="'+mo+'">'+
            (mo==='cash'?'For money':'Swap for goods')+'</button>';}).join('')+'</div>'+
      '<div class="row">'+

          RESOURCES.map(function(r){return '<option>'+r+'</option>';}).join('')+'</select></label>'+
        '<label><span>Quantity</span><input type="number" id="oQty" value="2" step="0.1" min="0"></label>'+
        (state.offerMode==='swap'
          ? '<label><span>You want back</span><select id="oRet">'+
              RESOURCES.filter(function(r){return r!=='credits';})

/* --------------------------- CONSTITUTION ------------------------ */
function checkExpr(e){
  if(!e || e.trim()==='' || e.trim()==='always') return {ok:true};
  var bad = [];
  // pull out every bare path token and check it exists
  (e.match(/[A-Za-z_][A-Za-z0-9_.]*/g)||[]).forEach(function(tok){
    if(['always','true','false','and','or'].indexOf(tok)>=0) return;
    if(PATHS.indexOf(tok)<0 && !/^[0-9]/.test(tok) && bad.indexOf(tok)<0) bad.push(tok);
  });
  return bad.length ? {ok:false, bad:bad} : {ok:true};
}

/* ------------------------------- EXPORT -------------------------- */
function bundle(){
  var c = state.constitution, h = state.harness;
  var out = {
    team: state.team,
    generated_at: new Date().toISOString(),
    constitution: {
      name: c.name || (state.team + ' constitution'),
      commitments: c.commitments.filter(function(x){return x && x.trim();}),
      rules: c.rules.filter(function(r){return r.assert && r.assert.trim();}).map(function(r){
        return { id: r.id||('rule-'+uid().slice(0,4)), commitment: +r.commitment||0,
                 when: r.when||'always', assert: r.assert };
      })
    }
  };
  if(h.kind==='llm'){
    out.harness = { kind:'llm',
      persona: h.llm.persona,
      briefing_preamble: [h.llm.doctrine, h.llm.priorities, h.llm.trading]
        .filter(function(x){return x && x.trim();}).join('\n\n') };
  } else {
    var p = h.policy, alloc = p.opening.allocation;
    var sum = alloc.ubi + alloc.infrastructure + alloc.reserves || 1;
    out.harness = { kind:'policy', policy: {
      opening: Object.assign({}, p.opening, {
        allocation: { ubi: alloc.ubi/sum, infrastructure: alloc.infrastructure/sum,
                      reserves: alloc.reserves/sum }
      }),
      rules: p.rules.filter(function(r){return (r.then||[]).length;}).map(function(r){
        return { id: r.id||('rule-'+uid().slice(0,4)), when: r.when||'always',
          then: r.then.map(function(a){
            if(a.verb==='shift') return { shift:a.target, points:Number(a.amount)||0 };
            if(a.verb==='nudge') return { nudge:a.target, by:Number(a.amount)||0 };
            var v = a.amount;
            if(v==='true') v=true; else if(v==='false') v=false;
            else if(v!=='' && !isNaN(Number(v))) v=Number(v);
            return { set:a.target, value:v };
          })};
      }),
      trade: { style: p.trade.style,
               never_sell: (p.trade.never_sell||[]).filter(function(x){return x;}) }
    }};
  }
  // trade instructions staged on the bulletin for this round
  var acc = state.posts.filter(function(p){ return p.to===state.team && p.status==='agreed'; });
  var mine = state.posts.filter(function(p){ return p.from===state.team && p.status==='open'; });
  if(acc.length || mine.length){
    out.trade = { responses: {}, offers: [] };
    acc.forEach(function(p){ out.trade.responses[p.market_id||p._id] = 'accept'; });
    mine.forEach(function(p){
      var o = { to:p.to, resource:p.resource, quantity:p.quantity, type:p.type,
                deliver_in:p.deliver_in, note:p.note };
      if(p.return_resource){ o.return_resource=p.return_resource; o.return_quantity=p.return_quantity; }
      else o.price = p.price;
      out.trade.offers.push(o);
    });
  }
  return out;
}

function viewExport(){
  var b = bundle();
  var probs = [];
  if(!b.constitution.commitments.length) probs.push('no commitments written');
  if(!b.constitution.rules.length) probs.push('no checkable rules — constitutional fidelity cannot be scored');
  if(b.harness.kind==='policy' && !b.harness.policy.rules.length)
    probs.push('no policy rules — your government will not react to anything');
  if(b.harness.kind==='llm' && !b.harness.persona) probs.push('no persona for the model');
  state.constitution.rules.forEach(function(r){
    var chk = checkExpr(r.assert);
    if(!chk.ok) probs.push('constitution rule "'+(r.id||'?')+'" names '+chk.bad.join(', '));
  });

  return '<div class="panel"><h3>Hand this in<span class="aside">'+esc(state.team)+'</span></h3>'+
    (probs.length
      ? '<div class="notice bad"><b>Not ready:</b><br>· '+probs.map(esc).join('<br>· ')+'</div>'
      : '<div class="notice"><span class="ok">Ready.</span> This bundle is a complete government: '+
        'a sealed constitution, a harness, and how you trade.</div>')+
    '<div class="btnrow"><button class="btn pri" id="copyBundle">Copy the bundle</button>'+
    '<button class="btn" id="dlBundle">Download</button></div>'+
    '<div class="hint">Save it as <code>bundles/'+esc((state.team||'team').toLowerCase().replace(/\s+/g,'-'))+
    '.json</code> and run <code>node engine/run-bundle.js</code>.</div>'+
    '<label style="margin-top:14px"><span>The bundle</span>'+
    '<textarea rows="22" readonly id="bundleOut">'+esc(JSON.stringify(b,null,2))+'</textarea></label></div>';
}

  on('retryConn','click', function(){ state.db=null; state.diag='reconnecting…'; render(); connect(); });
  on('roundFwd','click', function(){ setRound((state.meta.round||1) + 1); });
  on('roundBack','click', function(){ setRound((state.meta.round||1) - 1); });

  on('rejoin','click', async function(){
    var b=this; b.textContent='joining…';
    await registerTeam();
    b.textContent = state.registered ? 'joined' : 'failed — see last error';
    setTimeout(function(){ render(); }, 900);
  });
  on('reconnect','click', function(){
    state.db=null; state.registered=false; state.diag='reconnecting…'; render(); connect();
  });

  /* ---- bulletin ---- */
  on('saveShelf','click', async function(){
    var b = this;
    await registerTeam({ has: $('myHas').value.slice(0,140),
                         wants: $('myWants').value.slice(0,140) });

  document.querySelectorAll('[data-omode]').forEach(function(b){

  on('postOffer','click', async function(){

    if(res==='credits' && type!=='aid'){
      state.status='Credits are the money — they can be given as aid, but not sold. '+
        'To ask for money, use "For money" and set a price.'; render(); return;
    }
    var to = $('oTo').value;
    if(!to){ state.status='No counterparty: no other team has joined the board yet.'; render(); return; }
    var ret = swap && $('oRet') ? $('oRet').value : null;
    if(swap && ret === res){
      state.status='Swapping '+res+' for '+res+' is not a trade.'; render(); return;
    }
    var ok = await post(C.posts, {
      from: state.team, to: to, resource: res, type: type,
      quantity: Number($('oQty').value)||0,
      price: (type==='aid'||swap) ? 0 : Number(($('oPrice')||{}).value)||0,
      return_resource: ret,
      return_quantity: swap ? Number(($('oRetQty')||{}).value)||0 : 0,
      deliver_in: type==='forward' ? Math.max(1,Math.min(6,Number($('oDel').value)||1)) : 0,
      note: $('oNote').value.slice(0,160), round: state.meta.round,
      status: 'open', ts: Date.now(), market_id: uid()
    });
    if(ok){ state.status=''; }
  });
  on('sendMsg','click', async function(){
    var t = $('msgText').value.trim();
    if(!t) return;
    await post(C.messages, { from: state.team, to: $('msgTo').value||null,
      text: t.slice(0,400), ts: Date.now(), round: state.meta.round });
    if($('msgText')) $('msgText').value='';
  });

  document.querySelectorAll('[data-accept]').forEach(function(b){
    b.onclick = function(){ patch(C.posts, b.dataset.accept,
      { status:'agreed', answered_by: state.team, answered_ts: Date.now(),
        agreed_round: state.meta.round }); };
  });
  document.querySelectorAll('[data-reject]').forEach(function(b){
    b.onclick = function(){ patch(C.posts, b.dataset.reject,
      { status:'rejected', answered_by: state.team, answered_ts: Date.now() }); };
  });
  document.querySelectorAll('[data-withdraw]').forEach(function(b){
    b.onclick = function(){ patch(C.posts, b.dataset.withdraw, { status:'withdrawn' }); };
  });
  document.querySelectorAll('[data-counter]').forEach(function(b){
    b.onclick = function(){ state.countering = b.dataset.counter; render(); };
  });
  document.querySelectorAll('[data-cancelcounter]').forEach(function(b){
    b.onclick = function(){ state.countering = null; render(); };
  });
  document.querySelectorAll('[data-sendcounter]').forEach(function(b){
    b.onclick = async function(){
      var id = b.dataset.sendcounter;
      var orig = state.posts.filter(function(p){return p._id===id;})[0];
      if(!orig) return;
      var q = Number((document.getElementById('cQty_'+id)||{}).value);
      var pr = Number((document.getElementById('cPrice_'+id)||{}).value);
      state.countering = null;
      await patch(C.posts, orig._id, { status:'countered' });
      await post(C.posts, {
        from: state.team, to: orig.from, resource: orig.resource, type: orig.type,
        quantity: isFinite(q) && q > 0 ? q : orig.quantity,
        price: isFinite(pr) && pr >= 0 ? pr : orig.price,
        deliver_in: orig.deliver_in, note: 'counter to ' + (orig.note || orig.market_id || ''),
        counters: orig.market_id || orig._id, round: state.meta.round,
        status: 'open', ts: Date.now(), market_id: uid()
      });
    };
  });

  /* ---- constitution ---- */
  on('cName','input', function(e){ state.constitution.name=e.target.value; lsSet('constitution',state.constitution); });
  document.querySelectorAll('[data-cmt]').forEach(function(i){
    i.oninput = function(){ state.constitution.commitments[+i.dataset.cmt]=i.value;
      lsSet('constitution',state.constitution); };
  });
  on('addRule','click', function(){
    state.constitution.rules.push({id:'',when:'always',assert:'',commitment:0});
    lsSet('constitution',state.constitution); render();
  });
  document.querySelectorAll('[data-rid]').forEach(function(i){
    var h = function(){ state.constitution.rules[+i.dataset.rid][i.dataset.f]=
      i.dataset.f==='commitment' ? +i.value : i.value;
      lsSet('constitution',state.constitution);
      if(i.dataset.f==='assert') render(); };
    i.addEventListener('change', h);
    if(i.dataset.f!=='commitment') i.addEventListener('blur', h);
  });
  document.querySelectorAll('[data-delrule]').forEach(function(b){
    b.onclick=function(){ state.constitution.rules.splice(+b.dataset.delrule,1);
      lsSet('constitution',state.constitution); render(); };
  });

  /* ---- harness ---- */
  document.querySelectorAll('[data-kind]').forEach(function(b){
    b.onclick=function(){ state.harness.kind=b.dataset.kind; lsSet('harness',state.harness); render(); };
  });
  ['hPersona','hDoctrine','hPriorities','hTrading'].forEach(function(id){
    on(id,'input',function(e){
      state.harness.llm[{hPersona:'persona',hDoctrine:'doctrine',
        hPriorities:'priorities',hTrading:'trading'}[id]] = e.target.value;
      lsSet('harness',state.harness);
    });
  });
  document.querySelectorAll('[data-open]').forEach(function(i){
    i.onchange=function(){
      var k=i.dataset.open, v=i.value;
      if(k==='care_job_guarantee') v = (v==='true');
      else if(k==='working_week_days') v = Number(v);
      else if(k!=='ubi_design') v = Number(v);
      state.harness.policy.opening[k]=v; lsSet('harness',state.harness);
    };
  });
  document.querySelectorAll('[data-alloc]').forEach(function(i){
    i.onchange=function(){ state.harness.policy.opening.allocation[i.dataset.alloc]=
      (Number(i.value)||0)/100; lsSet('harness',state.harness); };
  });
  document.querySelectorAll('[data-auto]').forEach(function(i){
    i.onchange=function(){ state.harness.policy.opening.automation_target[i.dataset.auto]=
      (Number(i.value)||0)/100; lsSet('harness',state.harness); };
  });
  on('addPRule','click', function(){
    state.harness.policy.rules.push({id:'',when:'',then:[{verb:'shift',target:'ubi->infrastructure',amount:'5'}]});
    lsSet('harness',state.harness); render();
  });
  document.querySelectorAll('[data-pri]').forEach(function(i){
    var h=function(){ state.harness.policy.rules[+i.dataset.pri][i.dataset.f]=i.value;
      lsSet('harness',state.harness); if(i.dataset.f==='when') render(); };
    i.addEventListener('change',h); i.addEventListener('blur',h);
  });
  document.querySelectorAll('[data-pr]').forEach(function(i){
    i.onchange=function(){
      var r=state.harness.policy.rules[+i.dataset.pr], a=r.then[+i.dataset.ai];
      a[i.dataset.f]=i.value; lsSet('harness',state.harness);
      if(i.dataset.f==='verb') render();
    };
  });
  document.querySelectorAll('[data-addact]').forEach(function(b){
    b.onclick=function(){ state.harness.policy.rules[+b.dataset.addact].then.push(
      {verb:'nudge',target:'public_ownership_pct',amount:'0.03'});
      lsSet('harness',state.harness); render(); };
  });
  document.querySelectorAll('[data-delact]').forEach(function(b){
    b.onclick=function(){ var p=b.dataset.delact.split('.');
      state.harness.policy.rules[+p[0]].then.splice(+p[1],1);
      lsSet('harness',state.harness); render(); };
  });
  document.querySelectorAll('[data-delprule]').forEach(function(b){
    b.onclick=function(){ state.harness.policy.rules.splice(+b.dataset.delprule,1);
      lsSet('harness',state.harness); render(); };
  });
  on('tStyle','change',function(e){ state.harness.policy.trade.style=e.target.value; lsSet('harness',state.harness); });
  on('tNever','change',function(e){ state.harness.policy.trade.never_sell=
    e.target.value.split(',').map(function(x){return x.trim();}).filter(Boolean);
    lsSet('harness',state.harness); });

  /* ---- export ---- */
  on('copyBundle','click', function(){
    var b=this; navigator.clipboard.writeText(JSON.stringify(bundle(),null,2)).then(function(){
      b.textContent='Copied'; setTimeout(function(){ b.textContent='Copy the bundle'; },1400);
    }, function(){ b.textContent='Copy failed'; });
  });
  on('dlBundle','click', async function(){
    var b=this;
    try {
      var dl = await claude.use('downloads');
      if(!dl){ b.textContent='Use Copy instead'; setTimeout(function(){b.textContent='Download';},2000); return; }
      await dl.save({ filename: (state.team||'team').toLowerCase().replace(/\s+/g,'-')+'.json',
                      data: JSON.stringify(bundle(),null,2) });
    } catch(e){ b.textContent='Use Copy instead'; setTimeout(function(){b.textContent='Download';},2000); }
  });
}

document.getElementById('tabs').addEventListener('click', function(e){
  var b=e.target.closest('[data-tab]'); if(!b) return;
  state.tab=b.dataset.tab; state.status=''; render();
});
document.getElementById('btnWho').addEventListener('click', askTeam);

render();
connect();
})();
</script>
