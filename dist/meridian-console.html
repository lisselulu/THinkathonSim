<title>Meridian Team Console</title>

<style>

    --bg:#EDE8DC; --panel:#F7F3EB; --panel2:#FCFAF4; --ink:#3B423E;
    --rust:#A8624C; --muted:#868C86; --muted2:#585E59; --line:#D6D0C2;

  }

  :where(button,[href],input,textarea,select):focus-visible{outline:3px solid var(--rust);outline-offset:2px}
  h1,h2,h3{text-wrap:balance}
  .mono,.n{font-variant-numeric:tabular-nums}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}
  h1,h2,h3{margin:0;font-weight:400}
  .serif{font-family:"Instrument Serif",Georgia,serif}
  .mono{font-family:"Space Mono",ui-monospace,monospace}
  .lbl{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}

  header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:18px;
    padding:0 24px;min-height:74px;background:var(--ink);color:var(--panel);flex-wrap:wrap}
  header .title{font-family:"Instrument Serif",Georgia,serif;font-size:29px;line-height:1}
  header .sub{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:#9BA29B;margin-top:3px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}

    text-transform:uppercase;padding:9px 13px;cursor:pointer;border:2px solid #4A4636;
    background:transparent;color:#9BA29B}
  .tabs button.on{background:var(--panel);color:var(--ink);border-color:var(--panel)}
  .who{margin-left:auto;display:flex;align-items:center;gap:12px}
  .whoname{font-family:"Space Mono",monospace;font-size:15px;font-weight:700}
  .dotlive{width:9px;height:9px;border-radius:50%;background:#7FA476;flex:0 0 auto}
  .dotdead{width:9px;height:9px;border-radius:50%;background:#A85B49;flex:0 0 auto}

  .wrap{max-width:1220px;margin:0 auto;padding:20px 24px 70px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}

    padding:16px 18px;margin-bottom:18px}
  .panel h3{font-size:12px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;
    padding-bottom:9px;margin-bottom:14px;border-bottom:2px solid var(--ink);
    display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .panel h3 .aside{font-weight:600;letter-spacing:.04em;text-transform:none;color:var(--muted)}

  label{display:block;margin-bottom:11px}
  label>span{display:block;font-size:11px;font-weight:800;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  input[type=text],input[type=number],select,textarea{width:100%;font-family:inherit;font-size:13px;
    padding:8px 9px;border:2px solid var(--ink);background:var(--panel2);color:var(--ink)}
  textarea{font-family:"Space Mono",monospace;font-size:11px;line-height:1.5;resize:vertical}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
  .row>label{flex:1;min-width:110px;margin-bottom:0}

  .btn{font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;

  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

  .card{border:2px solid var(--ink);background:var(--panel2);padding:11px 12px;margin-bottom:9px}

  .card.tome{border-left:7px solid var(--good)}

  .card .deal{font-family:"Space Mono",monospace;font-size:14px;font-weight:700}
  .card .meta{font-size:11px;color:var(--muted2);margin-top:3px}
  .chip{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    padding:3px 7px;border:2px solid var(--ink);background:var(--panel)}
  .chip.spot{background:#DCE7E6}.chip.forward{background:#F2E7C9}.chip.aid{background:#E4EDDC}
  .chip.open{background:var(--panel2);color:var(--muted2)}
  .chip.countered{background:#E8D9C8}
  .thread{margin:8px 0 0 18px;padding-left:12px;border-left:2px dashed var(--line);font-size:12px;
    color:var(--muted2)}
  .card.agreed{border-left:7px solid var(--good);background:#F2F6EE}
  .ledgerline{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;padding-top:7px;
    border-top:1px dashed var(--line);font-size:12px;font-weight:700}
  .ledgerline .gives{color:var(--bad)}
  .ledgerline .gives::before{content:"− "}
  .ledgerline .gets{color:var(--good)}

  .msg{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5}
  .msg .from{font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .msg .to{color:var(--rust);font-weight:800}
  .msgs{max-height:300px;overflow-y:auto}

  .shelf{border:2px solid var(--ink);background:var(--panel2);padding:10px 11px}
  .shelf .nm{font-weight:800;font-size:13px;margin-bottom:5px}
  .shelf .kv{font-size:11px;color:var(--muted2);line-height:1.6}
  .shelf .kv b{color:var(--ink)}

  .rule{border:2px solid var(--ink);background:var(--panel2);padding:10px 11px;margin-bottom:9px}
  .rule .rh{display:flex;gap:8px;align-items:center;margin-bottom:7px}

  .panel.society{background:linear-gradient(160deg,#F7F3EB 0%,#F2EDE1 100%)}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px;
    margin-bottom:12px}
  .metric{border:2px solid var(--ink);background:var(--panel2);padding:9px 10px}
  .metric .mv{font-family:"Space Mono",monospace;font-size:21px;font-weight:700;line-height:1.1;
    font-variant-numeric:tabular-nums}
  .metric .mu{font-size:11px;font-weight:700;color:var(--muted2);margin-left:3px}
  .metric .mk{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);margin-top:3px}
  .sectorstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:5px}
  .sq{display:flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--panel2);padding:4px 7px;font-size:11px}
  .sqd{width:9px;height:9px;flex:0 0 auto;border:1px solid var(--ink)}
  .sqn{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sqv{font-family:"Space Mono",monospace;font-weight:700;font-variant-numeric:tabular-nums}
  .preview{margin-top:8px;padding:7px 9px;border:2px dashed var(--line);background:#FAF7F0;
    display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;font-size:11px}
  .preview .pvl{font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .preview .pvi{font-variant-numeric:tabular-nums}
  .vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
  .vital{border:2px solid var(--ink);background:var(--panel2);padding:8px 9px}
  .vital .vv{font-family:"Space Mono",monospace;font-size:16px;font-weight:700;
    font-variant-numeric:tabular-nums;line-height:1.1}
  .vital .vk{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);margin-top:3px}
  .hint{font-size:11px;color:var(--muted2);line-height:1.5;margin-top:7px}
  .ok{color:var(--good);font-weight:700}
  .warn{color:var(--mid);font-weight:700}
  .err{color:var(--bad);font-weight:700}
  .notice{padding:10px 12px;border:2px solid var(--ink);background:#F1ECE0;font-size:12px;
    line-height:1.5;margin-bottom:14px}
  .notice.bad{background:#F3E0DA;border-color:var(--bad)}
  .empty{font-size:12px;color:var(--muted);padding:10px 0}
  code{font-family:"Space Mono",monospace;font-size:11px;background:var(--panel2);
    border:1px solid var(--line);padding:1px 4px}
</style>

<header>
  <div>
    <div class="title">Meridian team console</div>
    <div class="sub">market bulletin · constitution · harness</div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="who">
    <span id="livedot" class="dotdead" title="offline"></span>
    <div style="text-align:right">
      <div class="lbl" style="color:#9BA29B">you are</div>
      <div class="whoname" id="whoname">—</div>
    </div>
    <button class="btn sm" id="btnWho" style="background:transparent;color:#9BA29B;border-color:#4A4636">change</button>
  </div>
</header>

<div class="wrap" id="wrap"></div>

<script>
(function(){
/* =====================================================================
   WHAT EACH INDUSTRY IS FOR
   ---------------------------------------------------------------------
   Every sector is scored out of 100 by ONE formula:

     target = Q_BASE + Q_CAPACITY·access + Q_INFRA·reliability
                     - Q_HUMAN·human_touch·overAutomation
                     + Q_STAFF·delivery + guarantee + friction

   Four dimensions, the same four for everybody, in the same proportions
   for everybody. Healthcare and Finance are judged identically apart
   from two coefficients. A hospital and a bank are not good at the same
   things and should not be measured as though they were.

   THE FIX, AND THE TRAP IN IT
   ---------------------------
   Each sector gets a MISSION and a scorecard of weighted dimensions. The
   obvious next step — letting each industry's agent decide what its own
   KPIs are — is the trap, and it is worth naming because it looks like
   more autonomy rather than less rigour. An agent that sets its own
   targets can declare success on transactions processed while the
   country starves, and no number anywhere would contradict it.

   So: the scorecard is AUTHORED HERE and measured deterministically from
   engine state. The agent's agency is in HOW it hits the targets, never
   in what they are. That keeps the score falsifiable, which is the only
   thing that makes it worth anything.

   THE OLD FORMULA IS A SPECIAL CASE
   ---------------------------------
   It is the scorecard where every sector weights the same four
   dimensions in the same proportions. Setting a sector's weights to
   mirror the global coefficients reproduces its old behaviour, which is
   what makes this safe to introduce gradually: `MISSION_WEIGHT` blends
   between the two and is zero until the blend has been looked at.

   WEIGHTS SUM TO 1 within a sector, so a scorecard is a statement about
   PRIORITY rather than about intensity. A sector cannot be made better
   simply by caring about more things.
   ===================================================================== */

'use strict';

/* ---------------------------------------------------------------------
   THE DIMENSIONS
   ---------------------------------------------------------------------
   Each is a signal roughly in [-1, +1], computed from what the engine
   already has. `scale` converts a weight of 1.0 into a full-strength
   effect on the 100-point scale, and is set so that a sector weighting
   a dimension the way the old global formula implicitly did produces
   approximately its old number.
   --------------------------------------------------------------------- */
const DIMENSIONS = {
  access:       { scale: 120, blurb: 'is there enough of it for everyone asking' },
  delivery:     { scale:  80, blurb: 'are there enough people to actually deliver it' },
  humanity:     { scale: 400, blurb: 'is a person still doing the part that has to be a person' },
  reliability:  { scale: 100, blurb: 'is the infrastructure underneath it maintained' },
  affordability:{ scale:  60, blurb: 'can people pay for it without going without something else' },
  equity:       { scale:  70, blurb: 'when it is rationed, who goes without' }
};

/* ---------------------------------------------------------------------
   THE MISSIONS
   ---------------------------------------------------------------------
   The `mission` line is what the industry is FOR, in one sentence. It is
   read by a human, and in due course by that industry's agent, which is
   why it is written as an obligation rather than a description.
   --------------------------------------------------------------------- */
const MISSIONS = {
  healthcare: {
    mission: 'Everyone who needs care gets it in time, and nobody is ruined by needing it.',
    /* Access dominates because a hospital that turns people away has
       failed at the thing it is for, however good the care inside is. */
    kpi: { access: 0.34, humanity: 0.24, delivery: 0.18, equity: 0.16, reliability: 0.08 }
  },
  care_services: {
    mission: 'The people who cannot look after themselves are looked after, by someone who knows them.',
    /* The one sector where the human IS the service. Automate it past
       its comfort and there is nothing left worth measuring. */
    kpi: { humanity: 0.40, delivery: 0.24, access: 0.20, equity: 0.16 }
  },
  education_research: {
    mission: 'Every child becomes someone this economy still has a use for, and the country keeps learning things nobody knew.',
    kpi: { humanity: 0.28, delivery: 0.26, access: 0.22, equity: 0.14, reliability: 0.10 }
  },
  transport_logistics: {
    mission: 'People and goods get where they are going, on time, at a price that does not decide who travels.',
    kpi: { access: 0.34, reliability: 0.28, affordability: 0.20, delivery: 0.10, equity: 0.08 }
  },
  energy_utilities: {
    mission: 'The lights stay on, the water runs, and the bill does not choose between them.',
    /* Reliability and affordability, not margin. A grid that is
       profitable and intermittent has failed. */
    kpi: { reliability: 0.34, access: 0.28, affordability: 0.28, delivery: 0.10 }
  },
  compute_telecom: {
    mission: 'The network carries what the country asks of it, and asking more of it is not ruinous.',
    kpi: { access: 0.38, reliability: 0.30, affordability: 0.22, delivery: 0.10 }
  },
  housing_construction: {
    mission: 'Everyone has somewhere to live that they can afford and that is still standing in thirty years.',
    kpi: { affordability: 0.32, access: 0.28, reliability: 0.22, equity: 0.18 }
  },
  food_agri: {
    mission: 'Nobody goes hungry, and the city is not one shipping lane away from finding out it could.',
    kpi: { access: 0.32, affordability: 0.28, reliability: 0.22, equity: 0.18 }
  },
  manufacturing: {
    mission: 'The things this country needs can be made here, by an industry that is still here next decade.',
    kpi: { access: 0.36, reliability: 0.26, delivery: 0.20, affordability: 0.18 }
  },
  finance: {
    /* Scored on whether capital reaches the real economy, NOT on margin.
       A banking sector can be enormously profitable while starving
       everything it is supposed to fund. */
    mission: 'Capital reaches the people and firms that can use it, and the system survives its own bad years.',
    kpi: { reliability: 0.34, access: 0.30, equity: 0.22, delivery: 0.14 }
  },
  retail_commerce: {
    mission: 'People can buy what they need near where they live, at a price they can meet.',
    kpi: { affordability: 0.34, access: 0.30, delivery: 0.20, equity: 0.16 }
  },
  public_admin: {
    mission: 'The state can still do what it decides to do, and a citizen can find out why.',
    kpi: { delivery: 0.32, humanity: 0.26, reliability: 0.22, access: 0.20 }
  },
  public_safety: {
    mission: 'People are safe, and feel safe, without being policed into it.',
    kpi: { delivery: 0.30, humanity: 0.26, access: 0.24, equity: 0.20 }
  }
};

/* ---------------------------------------------------------------------
   VALIDATION
   ---------------------------------------------------------------------
   Weights that do not sum to 1 make a sector quietly easier or harder to
   score than its neighbours, which is exactly the kind of thing nobody
   notices until a team asks why their hospital is doing so well.
   --------------------------------------------------------------------- */
function validate(order) {
  const problems = [];
  (order || Object.keys(MISSIONS)).forEach(k => {
    const m = MISSIONS[k];
    if (!m) { problems.push(k + ' has no mission'); return; }
    if (!m.mission || m.mission.length < 20) problems.push(k + ' has no mission statement');
    const keys = Object.keys(m.kpi || {});
    if (!keys.length) { problems.push(k + ' has no KPI weights'); return; }
    keys.forEach(d => {
      if (!DIMENSIONS[d]) problems.push(k + ' weights an unknown dimension "' + d + '"');
    });
    const sum = keys.reduce((a, d) => a + m.kpi[d], 0);
    if (Math.abs(sum - 1) > 1e-9) {
      problems.push(k + ' KPI weights sum to ' + sum.toFixed(4) + ', not 1');
    }
  });
  Object.keys(MISSIONS).forEach(k => {
    if (order && order.indexOf(k) < 0) problems.push('mission for "' + k + '", which is not a sector');
  });
  return problems;
}

/**
 * Score one sector against its own mission.
 *
 * `signals` are the normalised dimension readings for this sector this
 * round. Returns the 0-100 target plus the per-dimension breakdown, so a
 * team can see WHICH part of the mission is failing rather than being
 * handed one number.
 */
function scoreAgainstMission(key, signals, base) {
  const m = MISSIONS[key];
  const parts = {};
  let total = base;
  if (!m) return { target: total, parts: parts, mission: null };

  Object.keys(m.kpi).forEach(d => {
    const dim = DIMENSIONS[d];
    if (!dim) return;
    const raw = signals[d] == null ? 0 : signals[d];
    const contribution = m.kpi[d] * dim.scale * raw;
    parts[d] = { weight: m.kpi[d], signal: raw, points: contribution };
    total += contribution;
  });

  return { target: total, parts: parts, mission: m.mission };
}

/** The weakest part of a sector's mission, for a report or a prompt. */
function weakest(parts) {
  const keys = Object.keys(parts || {});
  if (!keys.length) return null;
  const worst = keys.sort((a, b) => parts[a].points - parts[b].points)[0];
  return { dimension: worst, points: parts[worst].points,
           blurb: (DIMENSIONS[worst] || {}).blurb };
}

/* Dual export, the same shape market.js uses.
   The browser builds inline this file ahead of the engine, and the
   engine reads `window.MeridianMissions` when there is no `require`.
   A bare `module.exports` here threw in the browser and left MISSIONS
   null, which took every client-side page down at the first sector it
   tried to score. */
const API = { MISSIONS, DIMENSIONS, validate, scoreAgainstMission, weakest };
if (typeof window !== 'undefined') window.MeridianMissions = API;
if (typeof module !== 'undefined' && module.exports) module.exports = API;

})();
/* =====================================================================
   THE MERIDIAN SIMULATION — LAYER 1 ENGINE
   ---------------------------------------------------------------------
   world state + lever settings  ->  next world state

   Deterministic. There is no randomness anywhere in this file. Shocks are
   drawn by the facilitator from a sealed deck and passed IN as arguments.

   READ THIS FILE. You are meant to. Reason about it, argue with the
   constants, plan against it. You may not modify it during the run.

   THE ONE THING TO UNDERSTAND
   ---------------------------
   Nothing in here has an opinion about whether automation is good. The
   engine only does bookkeeping, and the bookkeeping forms a ring:

       automation removes headcount
         -> headcount is a wage bill
            -> wages are household income
               -> household income becomes consumption
                  -> consumption is the demand sectors sell into
                     -> sales are the profit you tax
                        -> tax funds the UBI that replaced the wages

   Margins, profit, GDP, quality and cohesion are all DERIVED from that
   ring. The demand cliff is not written down anywhere as a rule. It is
   what happens when you go round the ring enough times.

   The single most important line in this file is marked THE CLIFF.
   ===================================================================== */

(function (root) {
'use strict';

/* ---------------------------------------------------------------------
   0. HELPERS
   --------------------------------------------------------------------- */
const clamp = (v, lo, hi) => (v < lo ? lo : (v > hi ? hi : v));
const lerp = (a, b, t) => a + (b - a) * t;
const round2 = v => Math.round(v * 100) / 100;
const deepClone = o => JSON.parse(JSON.stringify(o));

/* ---------------------------------------------------------------------
   1. EXOGENOUS DEMOGRAPHY
   ---------------------------------------------------------------------
   Population is not a lever. Singapore 2050-2074 ages and shrinks
   whatever you do. Anchored to the published baseline, interpolated
   between anchors.

   This is the ground the whole simulation stands on: demand for care and
   healthcare climbs every round while the working-age base that could
   staff it falls every round.
   --------------------------------------------------------------------- */
const DEMOGRAPHY_ANCHORS = [
  { round: 1,  total: 5940000, age_0_19: 950000, age_20_64: 3325000, age_65_plus: 1665000 },
  { round: 5,  total: 5830000, age_0_19: 900000, age_20_64: 3150000, age_65_plus: 1780000 },
  { round: 6,  total: 5780000, age_0_19: 880000, age_20_64: 3090000, age_65_plus: 1810000 },
  { round: 10, total: 5650000, age_0_19: 790000, age_20_64: 2910000, age_65_plus: 1950000 },
  { round: 12, total: 5520000, age_0_19: 810000, age_20_64: 2760000, age_65_plus: 1950000 }
];

/* Beyond the last anchor the published projection runs out and we are
   on our own. Holding the final anchor flat -- which is what this did --
   means a hundred-year run has a static population and the ageing
   crisis simply stops deepening, quietly making long runs easier than
   short ones.

   Instead the final observed trend continues, damped toward zero over
   about three decades, with floors. Damping rather than straight-line
   extrapolation because a linear continuation eventually produces
   negative children; a demographic transition decelerates as it
   completes. This is EXTRAPOLATION, not projection, and anything past
   round 12 should be read as "the trend, continued" rather than as a
   forecast. */
function demography(rnd) {
  const a = DEMOGRAPHY_ANCHORS;
  if (rnd <= a[0].round) return Object.assign({}, a[0]);

  const last = a[a.length - 1], prev = a[a.length - 2];
  if (rnd > last.round) {
    const span = last.round - prev.round;
    const beyond = rnd - last.round;
    /* Each additional round contributes less than the one before, so the
       cumulative move converges instead of running away. */
    const HALF_LIFE = 15;               // rounds, ~30 years
    const damped = HALF_LIFE * (1 - Math.pow(0.5, beyond / HALF_LIFE));
    const step = k => (last[k] - prev[k]) / span * damped;
    const out = {
      round: rnd,
      age_0_19:    Math.max(250000, Math.round(last.age_0_19 + step('age_0_19'))),
      age_20_64:   Math.max(800000, Math.round(last.age_20_64 + step('age_20_64'))),
      age_65_plus: Math.max(400000, Math.round(last.age_65_plus + step('age_65_plus')))
    };
    out.total = out.age_0_19 + out.age_20_64 + out.age_65_plus;
    return out;
  }
  if (rnd === last.round) return Object.assign({}, last);
  for (let i = 0; i < a.length - 1; i++) {
    if (rnd >= a[i].round && rnd <= a[i + 1].round) {
      const t = (rnd - a[i].round) / (a[i + 1].round - a[i].round);
      return {
        round: rnd,
        total:       Math.round(lerp(a[i].total,       a[i + 1].total,       t)),
        age_0_19:    Math.round(lerp(a[i].age_0_19,    a[i + 1].age_0_19,    t)),
        age_20_64:   Math.round(lerp(a[i].age_20_64,   a[i + 1].age_20_64,   t)),
        age_65_plus: Math.round(lerp(a[i].age_65_plus, a[i + 1].age_65_plus, t))
      };
    }
  }
}

  INVEST_TAX_ELASTICITY: 1.30, // reinvestment lost per point of tax above 19%
  INVEST_LEVY_ELASTICITY: 0.85,// ...and per point of compute levy above 5%
  LEVY_ADOPTION_BRAKE: 1.60,   // compute levy slows how fast you CAN automate

  /* spending */
  UBI_ADMIN_EFFICIENCY: { flat: 0.97, means_tested: 0.90, age_weighted: 0.95 },
  MEANS_TEST_COVERAGE: 0.55,   // share of the population that qualifies
  AGE_WEIGHT_SENIOR: 1.6,      // 65+ receive 1.6 shares under age-weighting

  /* prices */
  BASE_INFLATION: 0.021,
  IMPORT_SHARE: 0.55,          // of the consumption basket. SG imports nearly all food
  COMPUTE_SCARCITY_PASSTHROUGH: 0.09,

  /* SCARCITY PRICING (docs/EVIDENCE.md section 6).
     Compute and energy demand is driven by how automated the economy
     is. Until now that demand met a finite capacity and the only
     consequence was RATIONING -- a quality shortfall -- with the price
     drifting at a flat 1% a round regardless. A society could triple
     its automation and the energy price would not notice.

     Now the price responds to how tight the sector is:

         tightness = demand / capacity        (last round's realised)
         pressure  = (tightness - SLACK)      above the slack band only
         price    *= 1 + ELASTICITY * pressure^CONVEXITY

     CONVEXITY > 1 because scarcity bites nonlinearly: the last ten per
     cent of spare capacity costs far more than the first. Below
     SLACK_BAND nothing happens, because an economy running comfortably
     under capacity has no reason to bid prices up.

     The price already reaches households (via the price index, and so
     effective_ubi_index) and already raises the cost of running
     automated capacity (via computeCost). Both channels existed; this
     is what makes them respond to the team's own automation policy
     rather than only to shocks. */
  SCARCITY_SLACK_BAND: 0.92,   // tightness below this is comfortable
  SCARCITY_ELASTICITY: 0.55,   // price response per unit of pressure
  SCARCITY_CONVEXITY: 1.6,     // >1: the last of the capacity is dear
  SCARCITY_RELIEF: 0.25,       // how fast prices fall when slack returns
  SCARCITY_PRICE_CEILING: 6.0, // a price index, not a cliff

  /* PER-SECTOR CAPITAL (stage 3 foundations).
     ------------------------------------------------------------------
     `capitalIndex` is a single economy-wide scalar, so a sector running a
     40% margin and one running -10% receive the IDENTICAL capital
     multiplier next round. Nothing in the model rewards a sector for
     being profitable, which is why growth cannot compound: there is no
     positive feedback loop anywhere in the supply side.

     `_sectorCapital` fixes that by accumulating each sector's own
     retained earnings. It is COMPUTED from this round but applied to
     capacity only in proportion to SECTOR_CAPITAL_WEIGHT, which is zero
     here on purpose. At zero the term is exactly 1 and every existing run
     is byte-identical; the weight is raised when non-linear growth lands,
     and until then the figure is observable and testable without moving
     a single result. */
  SECTOR_CAPITAL_WEIGHT: 1,      // 0 = off. Raised when growth lands.

  SECTOR_CAPITAL_FLOOR: 0.35,

     ------------------------------------------------------------------
     Quality is one formula for all thirteen sectors: the same four
     dimensions in the same proportions, so a hospital and a bank are
     judged identically apart from two coefficients. `sector_missions.js`
     gives each industry its own scorecard instead.

     Blended rather than swapped, and at weight 0 the blend is exactly
     the old target, so this introduces the machinery without moving a
     result. Raising it is a deliberate, separately reviewable act. */
  MISSION_WEIGHT: 1,

  /* ==================================================================
     NON-LINEAR GROWTH (stage 5)
     ==================================================================
     Three mechanisms, each replacing a piece of a model in which
     automation buys a fixed, immediate, one-off increase in capacity.
     All three start at zero weight; a calibration pass raises them
     together, because they interact and tuning them one at a time
     would fit each to the absence of the others.

     1. THE PRODUCTIVITY J-CURVE.
        Automation does not pay on arrival. The complementary work —
        reorganising, retraining, rewriting the process around the
        machine — is real, expensive and unmeasured, so measured
        productivity DIPS before it rises. `_autoExperience` lags
        `automation`; the gap is automation the sector has bought and
        not yet learned to use, and it costs output.
        (Brynjolfsson, Rock & Syverson 2021; David 1990.)

     2. THE LEARNING CURVE.
        Unit cost falls with CUMULATIVE production, not with the level.
        This is the mechanism that makes AI exponential rather than
        merely large: every unit of compute consumed makes the next one
        cheaper, so a society far along the curve gets more automation
        per dollar than one starting out. (Wright's law.)

     3. BASS DIFFUSION.
        Adoption is an S-curve, not a ramp. `AUTOMATION_STEP_UP` applies
        the same 0.14 whether a sector sits at 0.12 or 0.90, which is a
        constant-rate line. The Bass form `(p + q·F)(1 − F)` is slow
        while few have adopted, fastest in the middle, and saturates.
        (Bass 1969; Rogers, Diffusion of Innovations.) */

  J_CURVE_WEIGHT: 1,
  J_ABSORB_RATE: 0.45,     // share of the unabsorbed gap learned per round
  J_DIP: 0.35,             // output cost per unit of unabsorbed automation
  /* The other half of the J, and the half that makes it a J rather than
     a tax. Automation that has been ABSORBED pays more than the naive
     linear gain, because the reorganisation it forced is itself
     productive — that is the whole finding, not a caveat to it. Without
     this the mechanism only ever costs output and a team would rightly
     conclude that automating is never worth it. */
  J_MATURE: 1.40,          // multiplier on the gain from absorbed automation

  LEARNING_WEIGHT: 1,
  LEARNING_EXPONENT: 0.15, // cost ~ cumulative^(-b). b=0.15 is ~10% per doubling
  LEARNING_FLOOR: 0.45,    // experience never makes compute free

  DIFFUSION_WEIGHT: 1,
  BASS_P: 0.030,           // innovation: who moves with nobody to copy
  BASS_Q: 0.380,           // imitation: how strongly the adopted pull the rest
  BASS_SCALE: 1.30,        // so the PEAK rate matches the old constant step

  RESKILL_LAG: 3,              // rounds before it pays off (spec 5)
  RESKILL_POTENCY: 2.6e6,      // people moved high->low exposure per $bn
  EXPOSURE_SENSITIVITY: 1.2,   // share of the workforce newly exposed per
                               // point of economy-wide automation growth

  /* social */
  COHESION_INERTIA: 0.45,
  LEGITIMACY_INERTIA: 0.40,
  GINI_INERTIA: 0.50,

  /* civic friction: what people withhold when they have had enough.
     Below the threshold a society grumbles and works; above it, it stops
     cooperating — absence, go-slows, boycotts, things not maintained. */
  UNREST_THRESHOLD: 50,
  UNREST_DRAG: 0.55,        // share of output lost at total unrest
  UNREST_SERVICE_DRAG: 26   // quality points lost from care and health at the same
};
