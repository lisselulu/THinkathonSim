document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

m: 1px solid rgba(58,66,62,0.12);\">\n        <sc-for list=\"{{ indicators }}\" as=\"p\" hint-placeholder-count=\"7\">\n          <div style=\"padding: 11px 0;\">\n            <div style=\"display: flex; justify-content: space-between; align-items: baseline;\">\n              <span style=\"font-size: 15px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;\">{{ p.label }}<\u002Fspan>\n              <span style=\"font-size: 19px; font-weight: 900; font-variant-numeric: tabular-nums;\">{{ p.display }}<\u002Fspan>\n            <\u002Fdiv>\n            <div sc-camel-on-pointer-down=\"{{ p.onDown }}\" style=\"position: relative; height: 26px; margin-top: 6px; border: 1px solid rgba(59,66,62,0.13); border-radius: 999px; background: #EDE8DB; cursor: ew-resize; touch-action: none;\">\n              <div style=\"{{ p.fill }}\"><\u002Fdiv>\n              <div style=\"{{ p.handle }}\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"padding: 18px 26px 4px; font-size: 15px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #868C86;\">shocks<\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 26px 18px;\">\n        <sc-for list=\"{{ shockChips }}\" as=\"c\" hint-placeholder-count=\"5\">\n          <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding: 4px 26px 4px; font-size: 15px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #868C86;\">fail gates<\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 26px 22px;\">\n        <sc-for list=\"{{ gateChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding: 0 26px 30px;\">\n        <div style=\"display: flex; justify-content: space-between; align-items: baseline;\">\n          <span style=\"font-size: 15px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;\">resilience index<\u002Fspan>\n          <span style=\"font-size: 19px; font-weight: 900; font-variant-numeric: tabular-nums;\">{{ scoreDisplay }}<\u002Fspan>\n        <\u002Fdiv>\n        <div sc-camel-on-pointer-down=\"{{ scoreDown }}\" style=\"position: relative; height: 26px; margin-top: 6px; border: 1px solid rgba(59,66,62,0.13); border-radius: 999px; background: #EDE8DB; cursor: ew-resize; touch-action: none;\">\n          <div style=\"{{ scoreFill }}\"><\u002Fdiv>\n          <div style=\"{{ scoreHandle }}\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"display: flex; align-items: baseline; gap: 16px; padding: 22px 30px 12px;\">\n        <span style=\"font-size: 15px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #868C86;\">sector dials<\u002Fspan>\n        <span style=\"font-size: 15px; font-weight: 600; font-family: 'Space Mono', monospace; color: #868C86;\">drag a dial to set service quality · 65+ green, 40–64 amber, below 40 red<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 18px; padding: 0 30px 26px;\">\n        <sc-for list=\"{{ sectors }}\" as=\"s\" hint-placeholder-count=\"10\">\n          <div style=\"{{ s.card }}\">\n            <div style=\"display: flex; gap: 18px;\">\n              <div sc-camel-on-pointer-down=\"{{ s.dialDown }}\" style=\"position: relative; width: 132px; height: 132px; flex: 0 0 auto; cursor: grab; touch-action: none;\">\n                <svg sc-camel-view-box=\"0 0 132 132\" style=\"width: 132px; height: 132px; display: block;\">\n                  <circle cx=\"66\" cy=\"66\" r=\"50\" fill=\"none\" stroke=\"#E6E1D5\" stroke-width=\"13\" stroke-linecap=\"round\" stroke-dasharray=\"236 315\" transform=\"rotate(135 66 66)\"><\u002Fcircle>\n                  <circle cx=\"66\" cy=\"66\" r=\"50\" fill=\"none\" stroke=\"{{ s.color }}\" stroke-width=\"13\" stroke-linecap=\"round\" stroke-dasharray=\"{{ s.dash }}\" transform=\"rotate(135 66 66)\"><\u002Fcircle>\n                  <circle cx=\"66\" cy=\"66\" r=\"50\" fill=\"none\" stroke=\"#3B423E\" stroke-width=\"0\" stroke-dasharray=\"0 315\" transform=\"rotate(135 66 66)\"><\u002Fcircle>\n                  <line x1=\"66\" y1=\"66\" x2=\"66\" y2=\"26\" stroke=\"#6E756F\" stroke-width=\"3\" stroke-linecap=\"round\" transform=\"{{ s.needle }}\"><\u002Fline>\n                  <circle cx=\"66\" cy=\"66\" r=\"5\" fill=\"#6E756F\"><\u002Fcircle>\n                <\u002Fsvg>\n                <div style=\"position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; font-variant-numeric: tabular-nums; pointer-events: none;\">{{ s.quality }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex: 1 1 auto; min-width: 0;\">\n                <div style=\"display: flex; align-items: center; gap: 8px;\">\n                  <span style=\"{{ s.dot }}\"><\u002Fspan>\n                  <span style=\"font-size: 18px; font-weight: 600; letter-spacing: 0.01em;\">{{ s.name }}<\u002Fspan>\n                  <div style=\"flex: 1 1 auto;\"><\u002Fdiv>\n                  <span style=\"{{ s.bandChip }}\">{{ s.band }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ s.sliders }}\" as=\"p\" hint-placeholder-count=\"4\">\n                  <div style=\"padding: 6px 0 0;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: baseline;\">\n                      <span style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #585E59;\">{{ p.label }}<\u002Fspan>\n                      <span style=\"font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums;\">{{ p.display }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div sc-camel-on-pointer-down=\"{{ p.onDown }}\" style=\"position: relative; height: 18px; margin-top: 3px; border: 1px solid rgba(59,66,62,0.13); border-radius: 999px; background: #EDE8DB; cursor: ew-resize; touch-action: none;\">\n                      <div style=\"{{ p.fill }}\"><\u002Fdiv>\n                      <div style=\"{{ p.handle }}\"><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <input type=\"text\" value=\"{{ s.note }}\" sc-camel-on-change=\"{{ s.onNote }}\" placeholder=\"status line shown in the building popup\" style=\"width: 100%; box-sizing: border-box; margin-top: 12px; padding: 9px 11px; font-size: 15px; font-weight: 500; border: 1px solid rgba(59,66,62,0.13); border-radius: 6px; background: #FCFAF4; color: #3B423E;\">\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"padding: 0 30px 40px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 14px; padding-bottom: 10px;\">\n          <span style=\"font-size: 15px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #868C86;\">resulting json<\u002Fspan>\n          <span style=\"font-size: 14px; font-family: 'Space Mono', monospace; color: #868C86;\">read-only preview of what apply hands the monitor<\u002Fspan>\n        <\u002Fdiv>\n        <textarea readonly=\"readonly\" value=\"{{ jsonPreview }}\" spellcheck=\"false\" style=\"width: 100%; height: 300px; box-sizing: border-box; padding: 14px 16px; font-family: 'Space Mono', monospace; font-size: 13px; line-height: 1.5; border: 1px solid rgba(59,66,62,0.13); border-radius: 6px; background: #FCFAF4; color: #585E59; resize: vertical;\"><\u002Ftextarea>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;initialState&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;baseline_2050&quot;, &quot;boom_2060&quot;, &quot;shock_2058&quot;, &quot;doom_loop_2068&quot;, &quot;resilient_2074&quot;], &quot;default&quot;: &quot;baseline_2050&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Simulation&quot; }\n}\">\nconst INK = '#3B423E';\nconst KEY = 'meridian_overrides_v1';\nconst ORDER = ['healthcare','transport','housing_utilities','food_agri','finance','education','retail_commerce','care_services','public_safety','compute_energy'];\nconst NAMES = { healthcare: 'Healthcare', transport: 'Transport', housing_utilities: 'Housing & Utilities', food_agri: 'Food & Agri', finance: 'Finance', education: 'Education', retail_commerce: 'Retail & Commerce', care_services: 'Care Services', public_safety: 'Public Safety', compute_energy: 'Compute & Energy' };\nconst SHOCKS = ['pandemic','food_import_disruption','civil_unrest','fiscal_crisis','service_failure_cascade','energy_price_spike','cyber_attack'];\nconst GATES = ['insolvency','legitimacy_collapse','service_critical_care_services','service_critical_retail','service_critical_healthcare','service_critical_education'];\nconst BAND = { healthy: '#7FA476', strained: '#C9A45E', failing: '#AE6450' };\n\nclass Component extends DCLogic {\n  state = { data: null, err: null, key: null, draft: null, dirty: false, msg: '', bad: false };\n\n  componentDidMount() {\n    const inline = () => { const el = document.getElementById('world-states-inline'); if (!el) throw new Error('no data'); return JSON.parse(el.textContent); };\n    const load = new Promise(res => {\n      let done = false;\n      const finish = d => { if (!done) { done = true; res(d); } };\n      fetch('uploads/world-states.json').then(r => r.json()).then(finish).catch(() => finish(inline()));\n      setTimeout(() => finish(inline()), 1200);\n    });\n    load.then(data => {\n      const keys = Object.keys(data.states);\n      const key = keys.indexOf(this.props.initialState) >= 0 ? this.props.initialState : keys[0];\n      let saved = {};\n      try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { saved = {}; }\n      this.setState({ data: data, saved: saved, key: key, draft: this.clone(saved[key] || data.states[key]),\n        msg: Object.keys(saved).length ? 'loaded ' + Object.keys(saved).length + ' applied override(s) from this browser' : 'loaded from world-states.json' });\n    }).catch(e => this.setState({ err: String(e), msg: 'could not read uploads/world-states.json', bad: true }));\n  }\n  clone(o) { return JSON.parse(JSON.stringify(o)); }\n\n  pick(key) {\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}\n    this.setState({ key: key, draft: this.clone(saved[key] || this.state.data.states[key]), dirty: false, msg: 'editing ' + key, bad: false });\n  }\n  set(mut) {\n    const d = this.clone(this.state.draft);\n    mut(d);\n    this.setState({ draft: d, dirty: true });\n  }\n  apply() {\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}\n    saved[this.state.key] = this.state.draft;\n    try {\n      localStorage.setItem(KEY, JSON.stringify(saved));\n      this.setState({ dirty: false, bad: false, msg: 'applied ' + this.state.key + ' at ' + new Date().toLocaleTimeString() + ' — reload the world state monitor to see it' });\n    } catch (e) { this.setState({ bad: true, msg: 'could not save — ' + e.message }); }\n  }\n  revert() {\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}\n    delete saved[this.state.key];\n    try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}\n    this.setState({ draft: this.clone(this.state.data.states[this.state.key]), dirty: false, bad: false, msg: 'reverted ' + this.state.key + ' to the file values — reload the monitor' });\n  }\n\n  drag(vertical, min, max, step, onVal) {\n    return e => {\n      const el = e.currentTarget, r = el.getBoundingClientRect();\n      const read = ev => {\n        const t = vertical ? 1 - (ev.clientY - r.top) / r.height : (ev.clientX - r.left) / r.width;\n        let v = min + Math.max(0, Math.min(1, t)) * (max - min);\n        v = Math.round(v / step) * step;\n        onVal(Math.round(v * 1e6) / 1e6);\n      };\n      read(e);\n      const move = ev => { ev.preventDefault(); read(ev); };\n      const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };\n      window.addEventListener('pointermove', move);\n      window.addEventListener('pointerup', up);\n    };\n  }\n  dialDrag(onVal) {\n    return e => {\n      const r = e.currentTarget.getBoundingClientRect();\n      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;\n      const read = ev => {\n        let a = Math.atan2(ev.clientX - cx, cy - ev.clientY) * 180 / Math.PI;\n        a = Math.max(-135, Math.min(135, a));\n        onVal(Math.round((a + 135) / 270 * 100));\n      };\n      read(e);\n      const move = ev => { ev.preventDefault(); read(ev); };\n      const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };\n      window.addEventListener('pointermove', move);\n      window.addEventListener('pointerup', up);\n    };\n  }\n\n  hSlider(label, value, min, max, step, fmt, onVal, small) {\n    const t = Math.max(0, Math.min(1, (value - min) / (max - min)));\n    return { label: label, display: fmt(value), onDown: this.drag(false, min, max, step, onVal),\n      fill: { position: 'absolute', left: 0, top: 0, bottom: 0, width: (t * 100) + '%', background: '#A8624C', borderRadius: '3px' },\n      handle: { position: 'absolute', left: 'calc(' + (t * 100) + '% - ' + (small ? 7 : 10) + 'px)', top: small ? '-3px' : '-4px', bottom: small ? '-3px' : '-4px', width: (small ? 13 : 17) + 'px', borderRadius: '999px', background: '#FCFAF4', border: '2px solid ' + INK, pointerEvents: 'none' } };\n  }\n\n  renderVals() {\n    const d = this.state.draft;\n    if (!d) return { msg: this.state.msg || 'loading…', msgStyle: { padding: '14px 34px', fontFamily: \"'Space Mono', monospace\", fontSize: '15px', background: '#F1ECE0', borderBottom: '2px solid ' + INK }, tabs: [], allocLevers: [], policy: [], indicators: [], sectors: [], shockChips: [], gateChips: [], ubiDesigns: [], weekDays: [] };\n\n    const pct = v => Math.round(v * 100) + '%';\n    const tabs = Object.keys(this.state.data.states).map(k => {\n      const on = k === this.state.key;\n      const st = this.state.data.states[k];\n      return { label: st.meta.state_label, onClick: () => this.pick(k),\n        style: { fontSize: '15px', fontWeight: 800, letterSpacing: '0.06em', textTransform: 'uppercase', padding: '9px 14px', cursor: 'pointer', border: '2px solid ' + (on ? '#F7F3EB' : '#4A4636'), background: on ? '#F7F3EB' : 'transparent', color: on ? INK : '#9BA29B' } };\n    });\n\n    const allocKeys = ['ubi', 'infrastructure', 'reserves'];\n    const allocLevers = allocKeys.map(k => {\n      const v = d.levers.allocation[k];\n      const t = Math.max(0, Math.min(1, v));\n      return { label: k, display: pct(v),\n        onDown: this.drag(true, 0, 1, 0.01, nv => this.set(x => {\n          const others = allocKeys.filter(o => o !== k);\n          const rest = 1 - nv;\n          const sum = others.reduce((a, o) => a + x.levers.allocation[o], 0) || 1;\n          x.levers.allocation[k] = nv;\n          others.forEach(o => { x.levers.allocation[o] = Math.round(x.levers.allocation[o] / sum * rest * 100) / 100; });\n          x.fiscal.allocation = this.clone(x.levers.allocation);\n        })),\n        fill: { position: 'absolute', left: 0, right: 0, bottom: 0, height: (t * 100) + '%', background: k === 'ubi' ? '#A8624C' : (k === 'infrastructure' ? '#7FA3AC' : '#88A87E') },\n        handle: { position: 'absolute', left: '-5px', right: '-5px', bottom: 'calc(' + (t * 100) + '% - 8px)', height: '16px', background: '#F7F3EB', border: '3px solid ' + INK, pointerEvents: 'none' } };\n    });\n\n    const policy = [\n      this.hSlider('corporate tax rate', d.levers.corporate_tax_rate, 0, 0.6, 0.01, pct, v => this.set(x => { x.levers.corporate_tax_rate = v; })),\n      this.hSlider('compute levy', d.levers.compute_levy, 0, 0.4, 0.01, pct, v => this.set(x => { x.levers.compute_levy = v; })),\n      this.hSlider('reskilling spend', d.levers.reskilling_spend_pct, 0, 0.3, 0.01, pct, v => this.set(x => { x.levers.reskilling_spend_pct = v; })),\n      this.hSlider('public ownership', d.levers.public_ownership_pct, 0, 1, 0.01, pct, v => this.set(x => { x.levers.public_ownership_pct = v; })),\n      this.hSlider('reserves', d.fiscal.reserves_bn, -60, 200, 1, v => '$' + v.toFixed(0) + 'bn', v => this.set(x => { x.fiscal.reserves_bn = v; })),\n      this.hSlider('tax revenue', d.fiscal.tax_revenue_bn, 0, 400, 1, v => '$' + v.toFixed(0) + 'bn', v => this.set(x => { x.fiscal.tax_revenue_bn = v; })),\n      this.hSlider('gdp', d.fiscal.gdp_bn, 200, 1600, 2, v => '$' + v.toFixed(0) + 'bn', v => this.set(x => { x.fiscal.gdp_bn = v; }))\n    ];\n\n    const indicators = [\n      this.hSlider('ubi monthly', d.indicators.ubi_monthly_sgd, 0, 5000, 10, v => '$' + Math.round(v).toLocaleString('en-SG'), v => this.set(x => { x.indicators.ubi_monthly_sgd = Math.round(v); })),\n      this.hSlider('real ubi index', d.indicators.real_ubi_index, 0, 320, 1, v => v.toFixed(0), v => this.set(x => { x.indicators.real_ubi_index = Math.round(v); })),\n      this.hSlider('employment rate', d.indicators.employment_rate, 0, 1, 0.01, pct, v => this.set(x => { x.indicators.employment_rate = v; })),\n      this.hSlider('social cohesion', d.indicators.cohesion, 0, 100, 1, v => v.toFixed(0), v => this.set(x => { x.indicators.cohesion = Math.round(v); })),\n      this.hSlider('legitimacy', d.indicators.legitimacy, 0, 100, 1, v => v.toFixed(0), v => this.set(x => { x.indicators.legitimacy = Math.round(v); })),\n      this.hSlider('gini', d.indicators.gini, 0.15, 0.7, 0.01, v => v.toFixed(2), v => this.set(x => { x.indicators.gini = v; })),\n      this.hSlider('consumption index', d.indicators.consumption_index, 0, 220, 1, v => v.toFixed(0), v => this.set(x => { x.indicators.consumption_index = Math.round(v); }))\n    ];\n\n    const chip = on => ({ fontSize: '14px', fontWeight: 800, letterSpacing: '0.08em', textTransform: 'uppercase', padding: '8px 12px', cursor: 'pointer', border: '2px solid ' + INK, background: on ? '#A85B49' : '#F7F3EB', color: on ? '#FAF6EE' : '#868C86' });\n    const shockChips = SHOCKS.map(sk => {\n      const on = (d.shocks || []).indexOf(sk) >= 0;\n      return { label: sk.replace(/_/g, ' '), style: chip(on),\n        onClick: () => this.set(x => { x.shocks = x.shocks || []; on ? x.shocks.splice(x.shocks.indexOf(sk), 1) : x.shocks.push(sk); }) };\n    });\n    const gateChips = GATES.map(gk => {\n      const on = ((d.score || {}).gates_failed || []).indexOf(gk) >= 0;\n      return { label: gk.replace(/service_critical_/, '').replace(/_/g, ' '), style: chip(on),\n        onClick: () => this.set(x => { x.score.gates_failed = x.score.gates_failed || []; on ? x.score.gates_failed.splice(x.score.gates_failed.indexOf(gk), 1) : x.score.gates_failed.push(gk); }) };\n    });\n\n    const seg = on => ({ fontSize: '14px', fontWeight: 800, letterSpacing: '0.08em', textTransform: 'uppercase', padding: '9px 13px', cursor: 'pointer', border: '2px solid ' + INK, background: on ? INK : '#F7F3EB', color: on ? '#F7F3EB' : '#868C86' });\n    const ubiDesigns = ['flat', 'means_tested', 'age_weighted'].map(v => ({ label: v.replace(/_/g, ' '), style: seg(d.levers.ubi_design === v), onClick: () => this.set(x => { x.levers.ubi_design = v; }) }));\n    const weekDays = [3, 4, 5, 6].map(v => ({ label: v + 'd', style: seg(d.levers.working_week_days === v), onClick: () => this.set(x => { x.levers.working_week_days = v; }) }));\n\n    const band = q => q >= 65 ? 'healthy' : (q >= 40 ? 'strained' : 'failing');\n    const sectors = ORDER.filter(k => d.sectors[k]).map(k => {\n      const sec = d.sectors[k], b = band(sec.quality), col = BAND[b];\n      return {\n        name: NAMES[k] || k, quality: sec.quality, color: col, band: b,\n        card: { border: '3px solid ' + INK, background: '#F7F3EB', padding: '16px 18px', boxShadow: b === 'failing' ? '6px 6px 0 rgba(180,50,31,0.35)' : '6px 6px 0 rgba(22,21,15,0.12)' },\n        dot: { width: '14px', height: '14px', background: col, border: '2px solid ' + INK, display: 'inline-block', flex: '0 0 auto' },\n        bandChip: { fontSize: '12px', fontWeight: 900, letterSpacing: '0.12em', textTransform: 'uppercase', padding: '4px 8px', background: col, color: b === 'failing' ? '#FAF6EE' : INK, border: '2px solid ' + INK },\n        dash: (sec.quality / 100 * 236) + ' 315',\n        needle: 'rotate(' + (-135 + sec.quality / 100 * 270) + ' 66 66)',\n        dialDown: this.dialDrag(v => this.set(x => { x.sectors[k].quality = v; })),\n        sliders: [\n          this.hSlider('automation', sec.automation, 0, 1, 0.01, pct, v => this.set(x => { x.sectors[k].automation = v; }), true),\n          this.hSlider('headcount', sec.headcount, 0, 500000, 1000, v => Math.round(v).toLocaleString('en-SG'), v => this.set(x => { x.sectors[k].headcount = Math.round(v); }), true),\n          this.hSlider('capacity', sec.capacity, 0, 1.6, 0.01, v => (v * 100).toFixed(0) + '% of demand', v => this.set(x => { x.sectors[k].capacity = v; }), true),\n          this.hSlider('margin', sec.margin, -0.5, 0.5, 0.01, v => (v > 0 ? '+' : '') + Math.round(v * 100) + '%', v => this.set(x => { x.sectors[k].margin = v; }), true)\n        ],\n        note: sec.note || '',\n        onNote: e => { const t = e.target.value; this.set(x => { x.sectors[k].note = t; }); }\n      };\n    });\n\n    const sc = (d.score || {}).total ?? 0;\n    const scT = Math.max(0, Math.min(1, sc / 100));\n\n    return {\n      tabs: tabs,\n      editingLabel: d.meta.state_label, round: d.meta.round, year: d.meta.year,\n      roundUp: () => this.set(x => { x.meta.round = Math.min(12, x.meta.round + 1); x.meta.year = 2048 + x.meta.round * 2; }),\n      roundDown: () => this.set(x => { x.meta.round = Math.max(1, x.meta.round - 1); x.meta.year = 2048 + x.meta.round * 2; }),\n      allocLevers: allocLevers, policy: policy, indicators: indicators, sectors: sectors,\n      shockChips: shockChips, gateChips: gateChips, ubiDesigns: ubiDesigns, weekDays: weekDays,\n      guaranteeLabel: d.levers.care_job_guarantee ? 'on' : 'off',\n      guaranteeStyle: Object.assign(seg(!!d.levers.care_job_guarantee), { minWidth: '78px' }),\n      toggleGuarantee: () => this.set(x => { x.levers.care_job_guarantee = !x.levers.care_job_guarantee; }),\n      scoreDisplay: sc + ' / 100',\n      scoreDown: this.drag(false, 0, 100, 1, v => this.set(x => { x.score.total = Math.round(v); })),\n      scoreFill: { position: 'absolute', left: 0, top: 0, bottom: 0, width: (scT * 100) + '%', background: sc >= 70 ? '#88A87E' : (sc >= 45 ? '#C6A468' : '#A85B49') },\n      scoreHandle: { position: 'absolute', left: 'calc(' + (scT * 100) + '% - 10px)', top: '-4px', bottom: '-4px', width: '17px', borderRadius: '999px', background: '#FCFAF4', border: '2px solid ' + INK, pointerEvents: 'none' },\n      jsonPreview: JSON.stringify(d, null, 2),\n      onApply: () => this.apply(), onRevert: () => this.revert(),\n      dirtyStyle: { fontSize: '15px', fontWeight: 800, letterSpacing: '0.12em', textTransform: 'uppercase', padding: '8px 12px', border: '2px solid #C6A468', color: '#C6A468', display: this.state.dirty ? 'inline-block' : 'none' },\n      msg: this.state.msg,\n      msgStyle: { padding: '13px 34px', fontFamily: \"'Space Mono', monospace\", fontSize: '15px', background: this.state.bad ? '#A85B49' : '#F1ECE0', color: this.state.bad ? '#FAF6EE' : '#585E59', borderBottom: '2px solid ' + INK }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
